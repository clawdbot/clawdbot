name: Mantis Telegram Desktop Image

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region for the image bake
        required: true
        default: eu-west-1
        type: string
      linux_type:
        description: AWS instance type for source and proof leases
        required: true
        default: m7i.large
        type: string
      promote:
        description: Publish the candidate as a catalog-only variant
        required: true
        default: true
        type: boolean
      crabbox_ref:
        description: Crabbox ref containing the variant image commands
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  bake_telegram_desktop_image:
    name: Bake Telegram Desktop image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: qa-live-shared
    steps:
      - name: Checkout OpenClaw
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Go for Crabbox CLI
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install Crabbox CLI
        shell: bash
        env:
          CRABBOX_REF: ${{ inputs.crabbox_ref }}
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/crabbox"
          mkdir -p "$install_dir" "$HOME/.local/bin"
          git init "$install_dir/src"
          git -C "$install_dir/src" remote add origin https://github.com/openclaw/crabbox.git
          timeout --signal=TERM --kill-after=10s 120s git -C "$install_dir/src" fetch --depth 1 origin "$CRABBOX_REF"
          git -C "$install_dir/src" checkout --detach FETCH_HEAD
          go build -C "$install_dir/src" -o "$HOME/.local/bin/crabbox" ./cmd/crabbox
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/crabbox" --version
          "$HOME/.local/bin/crabbox" warmup --help > "$install_dir/warmup-help.txt" 2>&1
          grep -q -- "-desktop" "$install_dir/warmup-help.txt"
          "$HOME/.local/bin/crabbox" media preview --help >/dev/null
          "$HOME/.local/bin/crabbox" image promote --help > "$install_dir/image-promote-help.txt" 2>&1
          grep -q -- "--variant-sdk" "$install_dir/image-promote-help.txt"

      - name: Bake and prove Telegram Desktop image
        env:
          CRABBOX_COORDINATOR: ${{ secrets.CRABBOX_COORDINATOR }}
          CRABBOX_COORDINATOR_ADMIN_TOKEN: ${{ secrets.CRABBOX_COORDINATOR_ADMIN_TOKEN }}
          CRABBOX_ACCESS_CLIENT_ID: ${{ secrets.CRABBOX_ACCESS_CLIENT_ID }}
          CRABBOX_ACCESS_CLIENT_SECRET: ${{ secrets.CRABBOX_ACCESS_CLIENT_SECRET }}
          IMAGE_REGION: ${{ inputs.region }}
          IMAGE_TYPE: ${{ inputs.linux_type }}
          PROMOTE_IMAGE: ${{ inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir=".artifacts/mantis/telegram-desktop-image"
          mkdir -p "$output_dir"
          args=(
            --run
            --region "$IMAGE_REGION"
            --type "$IMAGE_TYPE"
            --output "$output_dir/summary.json"
            --crabbox-bin "$HOME/.local/bin/crabbox"
          )
          if [[ "$PROMOTE_IMAGE" != "true" ]]; then
            args+=(--no-promote)
          fi
          scripts/mantis/bake-telegram-desktop-image.sh "${args[@]}" 2>&1 | tee "$output_dir/bake.log"

      - name: Upload Telegram Desktop image bake artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mantis-telegram-desktop-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/mantis/telegram-desktop-image
          retention-days: 14
          if-no-files-found: error
