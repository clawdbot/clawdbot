# Diagnostic-branch replacement only; do not promote to main.
name: Windows Testbox Probe

on:
  workflow_dispatch:

permissions:
  contents: read

run-name: Windows worker transform diagnostic ${{ github.sha }}

jobs:
  worker-transforms:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - name: Verify source and prepare pinned native runtime
        id: runtime
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Expected a fresh GitHub-hosted Windows job.' }
          if ((git rev-parse HEAD) -cne $env:EXPECTED_HEAD) { throw 'Diagnostic checkout mismatch.' }
          if ((git rev-parse 'HEAD^') -cne '119e789d62e2a1ac77daf6f5a74f3b878dc7dd3f') { throw 'Diagnostic commit must be directly based on the failing CI merge.' }
          $expected = @('test/scripts/vitest-worker-artifacts.transforms.test.ts', 'test/scripts/vitest-worker-artifacts.test-support.ts', '.github/workflows/windows-testbox-probe.yml') | Sort-Object
          $actual = @(git diff-tree --no-commit-id --name-only -r HEAD | Sort-Object)
          if (Compare-Object $expected $actual) { throw 'Unexpected diagnostic source delta.' }
          $credentialNames = @('GH_TOKEN', 'GITHUB_TOKEN', 'NPM_TOKEN', 'NODE_AUTH_TOKEN', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN', 'AWS_WEB_IDENTITY_TOKEN_FILE', 'AZURE_CLIENT_SECRET', 'AZURE_FEDERATED_TOKEN_FILE', 'GOOGLE_APPLICATION_CREDENTIALS', 'SSH_AUTH_SOCK', 'OPENCLAW_HOME', 'OPENCLAW_STATE_DIR', 'OPENCLAW_CONFIG_PATH', 'OPENCLAW_GATEWAY_TOKEN', 'OPENCLAW_GATEWAY_PASSWORD')
          foreach ($name in $credentialNames) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) { throw 'Unexpected forwarded credential or operator state.' }
          }
          $hashes = @{
            'test/scripts/vitest-worker-artifacts.transforms.test.ts' = '52c3002b03ce6fd364770fa65890349d1fedb8b33a20c9042a299e333e03227d'
            'test/scripts/vitest-worker-artifacts.test-support.ts' = '88b6c2d337abb9d83b1b27d9302099046a18b39a7ea1e254bb7fdfb806e52dab'
          }
          foreach ($entry in $hashes.GetEnumerator()) {
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $entry.Key).Hash.ToLowerInvariant() -cne $entry.Value) { throw 'Diagnostic file digest mismatch.' }
          }
          (Get-FileHash -Algorithm SHA256 -LiteralPath '.github/workflows/windows-testbox-probe.yml').Hash.ToLowerInvariant() | Set-Content -LiteralPath "$env:RUNNER_TEMP/task41-workflow.sha256"
          $zip = Join-Path $env:RUNNER_TEMP 'node-v22.23.2-win-x64.zip'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip' -OutFile $zip -ConnectionTimeoutSeconds 15 -OperationTimeoutSeconds 120
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -cne '1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97') { throw 'Node distribution digest mismatch.' }
          $runtime = Join-Path $env:RUNNER_TEMP 'task41-node'
          Expand-Archive -LiteralPath $zip -DestinationPath $runtime
          $bin = Join-Path $runtime 'node-v22.23.2-win-x64'
          $bin >> $env:GITHUB_PATH
          "COREPACK_HOME=$env:RUNNER_TEMP/task41-corepack" >> $env:GITHUB_ENV

      - name: Install exact repository package manager and frozen dependencies once
        id: install
        env:
          CI: "true"
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node -p 'process.version') -cne 'v22.23.2') { throw 'Unexpected Node version.' }
          if ((corepack --version) -cne '0.34.6') { throw 'Unexpected bundled Corepack version.' }
          $pin = 'pnpm@12.3.4+sha512.961aa41fb077da3a04a441d9f8e15ebc0c96da8ef710b2eb67bf9ee7cb0610eabd48f1fd85f51cffe73846785fa0f87c56a3a872a1d893f8446741b5cce45457'
          if ((node -p "require('./package.json').packageManager") -cne $pin) { throw 'Repository packageManager integrity pin mismatch.' }
          $bin = Split-Path -Parent (Get-Command node).Source
          corepack enable --install-directory $bin *> "$env:RUNNER_TEMP/task41-corepack-enable.log"
          if ($LASTEXITCODE -ne 0) { throw 'Owned pnpm shim preparation failed.' }
          corepack prepare $pin --activate *> "$env:RUNNER_TEMP/task41-corepack-prepare.log"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned package manager preparation failed.' }
          if ((corepack pnpm --version) -cne '12.3.4' -or (pnpm --version) -cne '12.3.4') { throw 'Selected package manager version mismatch.' }
          # Existing Node22 Windows CI contract: ci.yml:4484 at the failing merge.
          # No install retry or shared cache; side-effect cache writes stay disabled.
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=false *> "$env:RUNNER_TEMP/task41-install.log"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen dependency installation failed; no test was run.' }
          if ((node -p "require('./node_modules/vitest/package.json').version") -cne '5.0.0') { throw 'Unexpected Vitest version.' }
          node -e 'const fs=require("node:fs"),os=require("node:os"),path=require("node:path");fs.writeFileSync(path.join(process.env.RUNNER_TEMP,"task41-before.json"),JSON.stringify({nodeVersion:process.version,packageManagerVerified:true,corepackVerified:true,atMs:Date.now(),processMonotonicMs:performance.now(),logicalCpuCount:os.cpus().length,availableParallelism:os.availableParallelism(),osTotalMemoryBytes:os.totalmem(),osFreeMemoryBytes:os.freemem()}));'
          if ($LASTEXITCODE -ne 0) { throw 'Initial runtime evidence capture failed.' }

      - name: Run original six-case transform sequence once
        id: tests
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
          OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/run-vitest.mjs test/scripts/vitest-worker-artifacts.transforms.test.ts --reporter=json --outputFile="$env:RUNNER_TEMP/task41-results.json" *> "$env:RUNNER_TEMP/task41-test.log"
          $testExit = $LASTEXITCODE
          "TASK41_TEST_EXIT=$testExit" >> $env:GITHUB_ENV
          exit $testExit

      - name: Reverify source and runtime after tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TASK41_PNPM_OK = 'false'
          $env:TASK41_COREPACK_OK = 'false'
          if ((corepack pnpm --version 2>$null) -ceq '12.3.4' -and (pnpm --version 2>$null) -ceq '12.3.4') { $env:TASK41_PNPM_OK = 'true' }
          if ((corepack --version 2>$null) -ceq '0.34.6') { $env:TASK41_COREPACK_OK = 'true' }
          @'
          const fs = require('node:fs'), path = require('node:path'), os = require('node:os'), crypto = require('node:crypto'), cp = require('node:child_process');
          const result = { sourceVerified: false, nodeVersion: process.version === 'v22.23.2' ? process.version : 'unexpected', packageManagerVerified: process.env.TASK41_PNPM_OK === 'true', corepackVerified: process.env.TASK41_COREPACK_OK === 'true', atMs: Date.now(), processMonotonicMs: performance.now(), logicalCpuCount: os.cpus().length, availableParallelism: os.availableParallelism(), osTotalMemoryBytes: os.totalmem(), osFreeMemoryBytes: os.freemem(), verificationErrorCount: 0 };
          try {
            const hashes = {
              'test/scripts/vitest-worker-artifacts.transforms.test.ts': '52c3002b03ce6fd364770fa65890349d1fedb8b33a20c9042a299e333e03227d',
              'test/scripts/vitest-worker-artifacts.test-support.ts': '88b6c2d337abb9d83b1b27d9302099046a18b39a7ea1e254bb7fdfb806e52dab',
              '.github/workflows/windows-testbox-probe.yml': fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'task41-workflow.sha256'), 'utf8').trim(),
            };
            const git = args => cp.execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
            result.sourceVerified = git(['rev-parse', 'HEAD']) === process.env.EXPECTED_HEAD && git(['rev-parse', 'HEAD^']) === '119e789d62e2a1ac77daf6f5a74f3b878dc7dd3f' && git(['status', '--porcelain', '--untracked-files=no']) === '' && Object.entries(hashes).every(([file, hash]) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex') === hash) && JSON.parse(fs.readFileSync('package.json', 'utf8')).packageManager === 'pnpm@12.3.4+sha512.961aa41fb077da3a04a441d9f8e15ebc0c96da8ef710b2eb67bf9ee7cb0610eabd48f1fd85f51cffe73846785fa0f87c56a3a872a1d893f8446741b5cce45457' && JSON.parse(fs.readFileSync('node_modules/vitest/package.json', 'utf8')).version === '5.0.0';
          } catch { result.verificationErrorCount++; }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'task41-after.json'), JSON.stringify(result));
          if (!result.sourceVerified || result.nodeVersion !== 'v22.23.2' || !result.packageManagerVerified || !result.corepackVerified) process.exitCode = 1;
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Post-test source/runtime verification failed; allowlisted evidence retained.' }

      - name: Publish allowlisted phase summary only
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.tests.outcome }}
          INSTALL_STEP_OUTCOME: ${{ steps.install.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const fs = require('node:fs'), path = require('node:path');
          const root = '.artifacts/task38-integration/ci-planner-timeout/windows-phases';
          const errors = {};
          const error = code => { errors[code] = (errors[code] || 0) + 1; };
          const read = file => { try { return fs.readFileSync(file, 'utf8'); } catch (e) { error(e.code === 'ENOENT' ? 'missing-file' : 'read-failed'); return ''; } };
          const list = directory => { try { return fs.readdirSync(directory).sort(); } catch { error('directory-unavailable'); return []; } };
          const json = file => { const text = read(file); if (!text) return null; try { return JSON.parse(text); } catch { error('invalid-json'); return null; } };
          const events = file => {
            const text = read(file), lines = text.split('\n'), result = [];
            for (let i = 0; i < lines.length; i++) {
              if (!lines[i].trim()) continue;
              try { const event = JSON.parse(lines[i]); if (event && typeof event === 'object') result.push(event); else error('invalid-event'); }
              catch { error(i === lines.length - 1 && !text.endsWith('\n') ? 'torn-final-jsonl' : 'invalid-jsonl-record'); }
            }
            return result;
          };
          const numeric = value => typeof value === 'number' && Number.isFinite(value);
          const outcome = value => ['success', 'failure', 'cancelled', 'skipped'].includes(value) ? value : 'unknown';
          const runtime = file => {
            const data = json(file); if (!data) return null;
            const result = { nodeVersion: data.nodeVersion === 'v22.23.2' ? data.nodeVersion : 'unexpected' };
            for (const key of ['sourceVerified', 'packageManagerVerified', 'corepackVerified']) if (typeof data[key] === 'boolean') result[key] = data[key];
            for (const key of ['atMs', 'processMonotonicMs', 'logicalCpuCount', 'availableParallelism', 'osTotalMemoryBytes', 'osFreeMemoryBytes', 'verificationErrorCount']) if (numeric(data[key])) result[key] = data[key];
            return result;
          };
          const layouts = ['single', 'projects'], invariants = ['fresh generations', 'source mode', 'source and config edits'];
          const summary = { diagnostic: 'worker-transforms', defenderPolicy: 'unchanged-unlike-original-ci-exclusions', testExit: /^\d+$/.test(process.env.TASK41_TEST_EXIT || '') ? Number(process.env.TASK41_TEST_EXIT) : null, testStepOutcome: outcome(process.env.TEST_STEP_OUTCOME), installStepOutcome: outcome(process.env.INSTALL_STEP_OUTCOME), before: runtime(path.join(process.env.RUNNER_TEMP, 'task41-before.json')), after: runtime(path.join(process.env.RUNNER_TEMP, 'task41-after.json')), cases: layouts.flatMap(layout => invariants.map(invariant => ({ layout, invariant, completion: 'not-recorded', timedOut: null, launches: [] }))) };
          const allowed = new Set(['launch', 'spawn', 'abort', 'exit', 'close', 'joined', 'generation-and-values-verified', 'collection-complete', 'sqlite-readonly-start', 'sqlite-readonly-returned', 'archive-worker-create', 'archive-worker-online', 'archive-worker-message', 'archive-worker-exit', 'archive-publish-start', 'archive-publish-returned', 'sqlite-cleanup-start', 'sqlite-cleanup-done', 'fixture-body-finally-done']);
          for (const directory of list(root)) for (const launch of list(path.join(root, directory))) {
            const p = path.join(root, directory, launch), identity = json(path.join(p, 'identity.json'));
            if (!identity || !layouts.includes(identity.layout) || !invariants.includes(identity.invariant) || ![1, 2, 3].includes(identity.launchIndex) || !['source', 'compiled'].includes(identity.mode)) { error('invalid-launch-identity'); continue; }
            const item = summary.cases.find(c => c.layout === identity.layout && c.invariant === identity.invariant);
            const all = [...events(path.join(p, 'parent.jsonl')).map(e => ({ ...e, clock: 'fixture-parent' })), ...events(path.join(p, 'child.jsonl')).map(e => ({ ...e, clock: 'test-child' }))].filter(e => allowed.has(e.event) && numeric(e.at)).sort((a, b) => a.at - b.at);
            const start = all.find(e => e.event === 'launch')?.at;
            const prepared = [...read(path.join(p, 'stderr.log')).matchAll(/\[vitest-workers\] prepared [a-f\d]+ in (\d+)ms \((\d+) inputs, (\d+) outputs\)/g)].map(m => ({ durationMs: +m[1], inputs: +m[2], outputs: +m[3] }));
            const collection = all.find(e => e.event === 'collection-complete');
            item.launches.push({ index: identity.launchIndex, mode: identity.mode, childNodeVersion: !collection ? 'not-recorded' : collection.version === 'v22.23.2' ? collection.version : 'unexpected', childExecutableMatchesParent: collection && typeof collection.execPath === 'string' ? path.win32.normalize(collection.execPath).toLowerCase() === path.win32.normalize(process.execPath).toLowerCase() : null, prepared, phases: all.map(e => ({ event: e.event, clock: e.clock, atMs: e.at, elapsedSinceLaunchMs: numeric(start) ? e.at - start : null, ...(numeric(e.monotonicMs) ? { processMonotonicMs: e.monotonicMs } : {}), ...(numeric(e.pid) ? { pid: e.pid } : {}), ...(numeric(e.code) ? { code: e.code } : {}), ...(e.type === 'published' ? { type: 'published' } : {}) })) });
          }
          const report = json(path.join(process.env.RUNNER_TEMP, 'task41-results.json'));
          if (report && Array.isArray(report.testResults)) for (const file of report.testResults) {
            if (!Array.isArray(file.assertionResults)) { error('invalid-result-shape'); continue; }
            for (const result of file.assertionResults) {
              const item = summary.cases.find(c => result.title === `preserves filesystem transforms for ${c.invariant} (${c.layout})`);
              if (!item || item.completion !== 'not-recorded') { error('unexpected-or-duplicate-result'); continue; }
              item.completion = ['passed', 'failed', 'pending', 'skipped', 'todo'].includes(result.status) ? result.status : 'unknown';
              item.timedOut = Array.isArray(result.failureMessages) ? result.failureMessages.some(m => typeof m === 'string' && /Test timed out in 120000\s?ms/.test(m)) : null;
              if (numeric(result.duration)) item.durationMs = result.duration;
            }
          }
          summary.completedCaseCount = summary.cases.filter(c => ['passed', 'failed'].includes(c.completion)).length;
          summary.timedOutCaseCount = summary.cases.filter(c => c.timedOut === true).length;
          summary.allSixPassed = summary.cases.every(c => c.completion === 'passed');
          summary.collectionErrors = errors;
          const serialized = JSON.stringify(summary, null, 2);
          console.log(serialized);
          try { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + serialized + '\n```\n'); }
          catch { console.log(JSON.stringify({ collectionError: 'step-summary-write-failed', count: 1 })); }
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Allowlisted diagnostic summary failed.' }
