name: UI cleanup observation

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: Unique observation identifier
        required: true

run-name: UI cleanup observation ${{ inputs.testbox_id }}

permissions:
  contents: read

concurrency:
  group: ui-cleanup-observation-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnostic:
    name: original-ui-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the original runtime without restoring a dependency tree
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.20.0"
          cache-mode: "off"
          install-deps: "false"
          install-bun: "false"
      - name: Restore the original pnpm store entry when retained
        id: pnpm-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /home/runner/.local/share/pnpm/store/v11
          key: pnpm-store-Linux-X64-24.x-4e9c9841dd8e600f6d0fbd33a8d69c1d74ecc1138a0341a496b5dcb27465aa19-11114f26b0c283569539dcba22afb7f0bdc5f0586b4e76f15ea43010b7e221d7
      - name: Restore the original V8 compile cache entry when retained
        id: node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /var/tmp/openclaw-node-compile-cache
          key: openclaw/openclaw-node-compile-v3-test-protected-Linux-X64-node-24.x-33668684640-1
      - name: Configure original cache topology and record provenance
        env:
          PNPM_CACHE_MATCH: ${{ steps.pnpm-store.outputs.cache-matched-key }}
          NODE_CACHE_MATCH: ${{ steps.node-cache.outputs.cache-matched-key }}
          TRANSFORM_GENERATION: ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/package.json', '**/tsconfig*.json', 'vitest.config.*', 'test/vitest/**', 'src/state/*.sql', '!**/node_modules/**') }}
        run: |
          set -euo pipefail
          test "$(node -p process.versions.node)" = 24.20.0
          test "$(pnpm store path)" = /home/runner/.local/share/pnpm/store/v11
          test "$TRANSFORM_GENERATION" = 210d37fa8de0ae0423bf5a0f20868d8420abaa71cb740f72bd555bd39e6f06e9
          test ! -e /var/tmp/openclaw-vitest-fs-cache
          mkdir -p /var/tmp/openclaw-vitest-fs-cache /var/tmp/openclaw-node-compile-cache .artifacts/ui-cleanup-observation
          printf '%s\n' "$TRANSFORM_GENERATION" > /var/tmp/openclaw-vitest-fs-cache/.openclaw-transform-generation
          echo 'OPENCLAW_VITEST_FS_MODULE_CACHE_PATH=/var/tmp/openclaw-vitest-fs-cache' >> "$GITHUB_ENV"
          echo 'OPENCLAW_VITEST_FS_MODULE_CACHE_WRITER=0' >> "$GITHUB_ENV"
          echo 'NODE_COMPILE_CACHE=/var/tmp/openclaw-node-compile-cache' >> "$GITHUB_ENV"
          echo 'NODE_COMPILE_CACHE_PORTABLE=1' >> "$GITHUB_ENV"
          echo 'OPENCLAW_NODE_COMPILE_CACHE_WRITER=0' >> "$GITHUB_ENV"
          node --input-type=module -e 'import fs from "node:fs"; import os from "node:os"; import {execFileSync} from "node:child_process"; fs.writeFileSync(".artifacts/ui-cleanup-observation/inputs.json", JSON.stringify({head:execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),originalIntegration:"0249635cbf06cce81e5877f403ca619b5f42847e",originalBase:"ec46a506639c900156edfb58e4ee4b8458536f7e",candidate:"2425a5ab4beff8f5b8be94e1250df3248c325d3b",node:process.version,cpus:os.availableParallelism(),memoryBytes:os.totalmem(),pnpmCache:process.env.PNPM_CACHE_MATCH,nodeCache:process.env.NODE_CACHE_MATCH,transformGeneration:process.env.TRANSFORM_GENERATION,transformCache:"empty, matching original cache miss"},null,2));'
      - name: Install the original frozen dependency tree
        env:
          CI: "true"
          DEPENDENCY_CACHE: "false"
          DEPENDENCY_CACHE_HIT: "false"
          FROZEN_LOCKFILE: "true"
        run: bash .github/actions/setup-node-env/install-dependencies.sh
      - name: Observe the original selected group once
        run: |
          set -euo pipefail
          test ! -e dist
          test ! -e dist-runtime
          test "$(node -p process.versions.node)" = 24.20.0
          timeout --signal=TERM --kill-after=30s 12m node .diagnostics/pr-138321/run-selected-group.mjs 2>&1 | tee .artifacts/ui-cleanup-observation/run.log
      - name: Preserve complete observation output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-cleanup-observation-${{ github.run_attempt }}
          path: .artifacts/ui-cleanup-observation/
          if-no-files-found: warn
          retention-days: 3
