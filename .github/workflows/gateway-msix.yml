name: Gateway MSIX

on:
  pull_request:
    paths:
      - ".github/workflows/gateway-msix.yml"
      - "packaging/gateway-msix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/package-openclaw-for-docker.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gateway-msix.yml"
      - "packaging/gateway-msix/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/package-openclaw-for-docker.mjs"
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Package signing mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - test
          - official
      release_tag:
        description: Existing stable OpenClaw release tag for official signing
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.22.0

jobs:
  test-host:
    name: Test Gateway MSIX host
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: packaging/gateway-msix/global.json
          cache: true
          cache-dependency-path: packaging/gateway-msix/Directory.Packages.props

      - name: Restore
        run: dotnet restore .\packaging\gateway-msix\OpenClaw.Gateway.MSIX.slnx

      - name: Test
        run: >
          dotnet test .\packaging\gateway-msix\OpenClaw.Gateway.MSIX.slnx
          --configuration Release
          --no-restore

      - name: Test release signing policy
        shell: pwsh
        run: .\packaging\gateway-msix\scripts\Test-SigningInputs.Tests.ps1

  build-package:
    name: Build current OpenClaw package
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: |
          pnpm build
          pnpm ui:build

      - name: Pack current checkout
        id: source
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/openclaw-package"
          mkdir -p "${artifact_dir}"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --skip-build \
            --pnpm-pack \
            --output-dir "${artifact_dir}" \
            --output-name openclaw.tgz

          source_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

          cat > "${artifact_dir}/source.json" <<EOF
          {
            "repository": "https://github.com/${GITHUB_REPOSITORY}",
            "requestedRef": "${GITHUB_SHA}",
            "resolvedCommit": "${source_sha}",
            "packageVersion": "${package_version}"
          }
          EOF

      - name: Upload intermediate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}/openclaw-package/
          if-no-files-found: error
          retention-days: 7

  build-payload:
    name: Build ${{ matrix.architecture }} Gateway payload
    needs: build-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download intermediate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}\openclaw-package

      - name: Stage and archive payload
        shell: pwsh
        run: |
          .\packaging\gateway-msix\scripts\Build-Payload.ps1 `
            -PackageDirectory '${{ runner.temp }}\openclaw-package' `
            -Architecture '${{ matrix.architecture }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-payload'

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload\
          if-no-files-found: error
          retention-days: 7

  build-msix:
    name: Build unsigned ${{ matrix.architecture }} Gateway MSIX
    needs:
      - build-package
      - test-host
      - build-payload
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: packaging/gateway-msix/global.json
          cache: true
          cache-dependency-path: packaging/gateway-msix/Directory.Packages.props

      - name: Download payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload

      - name: Restore NativeAOT and MSIX dependencies
        shell: pwsh
        run: |
          dotnet restore `
            .\packaging\gateway-msix\src\OpenClaw.Gateway.MSIXHost\OpenClaw.Gateway.MSIXHost.csproj `
            --runtime 'win-${{ matrix.architecture }}' `
            -p:PublishAot=true `
            -p:IncludePackagingContent=true `
            -p:Platform='${{ matrix.architecture }}'

      - name: Compose unsigned MSIX
        shell: pwsh
        run: |
          if ('${{ inputs.signing_mode }}' -eq 'official') {
            $packageVersion = .\packaging\gateway-msix\scripts\Resolve-MSIXVersion.ps1 `
              -PackageVersion '${{ needs.build-package.outputs.package_version }}'
          }
          else {
            $buildComponent = [int64]::Parse('${{ github.run_number }}') % 65536
            $attemptComponent = [int64]::Parse('${{ github.run_attempt }}') % 65536
            $packageVersion = "0.1.$buildComponent.$attemptComponent"
          }

          .\packaging\gateway-msix\scripts\Build-MSIX.ps1 `
            -PayloadDirectory '${{ runner.temp }}\openclaw-payload' `
            -Architecture '${{ matrix.architecture }}' `
            -NodeVersion '${{ env.NODE_VERSION }}' `
            -PackageVersion $packageVersion `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-msix'

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-gateway-msix-unsigned-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}\openclaw-msix\OpenClawGateway-${{ matrix.architecture }}.msix
            ${{ runner.temp }}\openclaw-msix\msix-metadata.json
          if-no-files-found: error
          retention-days: 7

  test-sign-msix:
    name: Test-sign Gateway MSIX packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'test' }}
    needs: build-msix
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: openclaw-gateway-msix-unsigned-*
          path: artifacts
          merge-multiple: false

      - name: Normalize artifact directories
        shell: pwsh
        run: |
          Move-Item artifacts\openclaw-gateway-msix-unsigned-x64 artifacts\x64
          Move-Item artifacts\openclaw-gateway-msix-unsigned-arm64 artifacts\arm64

      - name: Apply temporary test signature
        shell: pwsh
        run: |
          .\packaging\gateway-msix\scripts\Sign-TestMSIX.ps1 `
            -ArtifactsDirectory artifacts `
            -OutputDirectory test-signed

      - name: Upload test-signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-gateway-msix-test-signed
          path: test-signed\
          if-no-files-found: error
          retention-days: 7

  authorize-release-signing:
    name: Authorize stable release signing
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'official' }}
    needs:
      - build-package
      - build-msix
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require immutable stable release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REF: ${{ github.ref }}
          PACKAGE_VERSION: ${{ needs.build-package.outputs.package_version }}
        run: |
          $expectedRef = "refs/tags/$env:RELEASE_TAG"
          if ($env:RELEASE_REF -ne $expectedRef) {
            throw "Official signing must be dispatched from $expectedRef."
          }
          if ($env:RELEASE_TAG -ne "v$env:PACKAGE_VERSION") {
            throw 'release_tag must match the checked-out OpenClaw package version.'
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: openclaw-gateway-msix-unsigned-*
          path: artifacts
          merge-multiple: false

      - name: Normalize artifact directories
        shell: pwsh
        run: |
          Move-Item artifacts\openclaw-gateway-msix-unsigned-x64 artifacts\x64
          Move-Item artifacts\openclaw-gateway-msix-unsigned-arm64 artifacts\arm64

      - name: Enforce release signing inputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_COMMIT: ${{ github.sha }}
          PACKAGE_VERSION: ${{ needs.build-package.outputs.package_version }}
        run: |
          .\packaging\gateway-msix\scripts\Test-SigningInputs.ps1 `
            -ArtifactsDirectory artifacts `
            -ReleaseTag $env:RELEASE_TAG `
            -RepositoryCommit $env:REPOSITORY_COMMIT `
            -PackageVersion $env:PACKAGE_VERSION

  sign-and-publish-msix:
    name: Sign and publish stable Gateway MSIX
    if: ${{ needs.authorize-release-signing.result == 'success' }}
    needs:
      - authorize-release-signing
    runs-on: windows-latest
    environment: release-signing
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Download unsigned packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: openclaw-gateway-msix-unsigned-*
          path: artifacts
          merge-multiple: false

      - name: Normalize artifact directories
        shell: pwsh
        run: |
          Move-Item artifacts\openclaw-gateway-msix-unsigned-x64 artifacts\x64
          Move-Item artifacts\openclaw-gateway-msix-unsigned-arm64 artifacts\arm64

      - name: Azure login
        uses: azure/login@d54469830ea7d513b7371e02a077c3ee5cb7b112 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSIX packages
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files-folder: artifacts
          files-folder-filter: msix
          files-folder-recurse: true
          files-folder-depth: 2
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and write checksums
        shell: pwsh
        run: |
          $expectedSubject = 'CN=OpenClaw Foundation, O=OpenClaw Foundation, L=Mill Valley, S=California, C=US'
          $checksumLines = foreach ($architecture in @('x64', 'arm64')) {
            $directory = Join-Path artifacts $architecture
            $msix = @(Get-ChildItem -LiteralPath $directory -Filter '*.msix' -File)
            if ($msix.Count -ne 1) {
              throw "Expected one signed MSIX in $directory."
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $msix[0].FullName
            if (
              $signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -ne $expectedSubject
            ) {
              throw "Unexpected signature for $($msix[0].Name)."
            }

            $metadataPath = Join-Path $directory 'msix-metadata.json'
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            $metadata.sha256 = (
              Get-FileHash -LiteralPath $msix[0].FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $metadata.signed = $true
            $metadata | ConvertTo-Json |
              Set-Content -LiteralPath $metadataPath -Encoding utf8

            "$($metadata.sha256)  $($msix[0].Name)"
          }
          $checksumLines |
            Set-Content -LiteralPath artifacts\OpenClawGateway-SHA256SUMS.txt -Encoding utf8

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath artifacts -Recurse -File |
              Where-Object { $_.Extension -eq '.msix' -or $_.Name -eq 'OpenClawGateway-SHA256SUMS.txt' } |
              ForEach-Object FullName
          )
          gh release upload $env:RELEASE_TAG @assets --clobber
