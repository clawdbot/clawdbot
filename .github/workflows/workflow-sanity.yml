name: Workflow Sanity

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  no-tabs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - &workflow_sanity_checkout_step
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail on tabs in workflow files
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import sys

          root = pathlib.Path(".github/workflows")
          bad: list[str] = []
          for path in sorted(root.rglob("*.yml")):
            if b"\t" in path.read_bytes():
              bad.append(str(path))

          for path in sorted(root.rglob("*.yaml")):
            if b"\t" in path.read_bytes():
              bad.append(str(path))

          if bad:
            print("Tabs found in workflow file(s):")
            for path in bad:
              print(f"- {path}")
            sys.exit(1)
          PY

  actionlint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - *workflow_sanity_checkout_step
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare Git owner
        uses: openclaw/openclaw/.github/actions/git-owner@dd4528b6393e7d00063067a080ca7241b48ce475

      - name: Prepare trusted workflow audit configs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          from pathlib import Path
          from subprocess import DEVNULL
          from tempfile import TemporaryFile
          from ci_git_owner import FetchTimeout, GitFailure, backoff, check_cancelled, run_git

          workspace = os.getcwd()
          base, branch = os.environ["BASE_SHA"], os.environ["BASE_REF"]
          remote = f"refs/remotes/origin/{branch}"
          trusted_config = Path(os.environ["RUNNER_TEMP"]) / "pre-commit-base.yaml"
          trusted_zizmor_config = Path(os.environ["RUNNER_TEMP"]) / "zizmor-base.yml"

          def has_object(spec):
              try:
                  run_git(workspace, "cat-file", "-e", spec, stderr=DEVNULL)
                  return True
              except GitFailure:
                  return False

          def fetch_base(ref, target):
              for attempt in range(1, 4):
                  try:
                      run_git(workspace, "fetch", "--no-tags", "--depth=1", "origin",
                              f"+{ref}:{target}", timeout=30, reclaim_locks=True)
                      return
                  except (FetchTimeout, GitFailure) as error:
                      if (isinstance(error, GitFailure) and error.code not in (124, 137)) or attempt == 3:
                          raise
                      print(f"::warning::trusted base fetch for '{ref}' timed out on attempt {attempt}; retrying", flush=True)
                      backoff(5)

          if not has_object(f"{base}^{{commit}}"):
              try:
                  fetch_base(base, "refs/remotes/origin/security-base")
              except (FetchTimeout, GitFailure):
                  fetch_base(f"refs/heads/{branch}", remote)

          for source, target, label in [
              (".pre-commit-config.yaml", trusted_config, "pre-commit"),
              (".github/zizmor.yml", trusted_zizmor_config, "zizmor"),
          ]:
              exact = has_object(f"{base}:{source}")
              # Only joined Git output may become a config; fatal ownership never selects another ref.
              with TemporaryFile() as output:
                  try:
                      run_git(workspace, "show", f"{base if exact else remote}:{source}",
                              stdout=output, stderr=None if exact else DEVNULL)
                  except GitFailure:
                      if exact:
                          raise
                      print(f"::error title=trusted {label} config unavailable::Could not read {source} from {base} or origin/{branch}.")
                      raise SystemExit(1)
                  output.seek(0)
                  check_cancelled()
                  target.write_bytes(output.read())
              if not exact:
                  print(f"Base SHA {base} does not expose {source}; using origin/{branch} instead.")

          text = trusted_config.read_text()
          if ".github/zizmor.yml" not in text:
              raise SystemExit("trusted pre-commit config does not reference .github/zizmor.yml")
          trusted_config.write_text(text.replace(".github/zizmor.yml", str(trusted_zizmor_config)))
          check_cancelled()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PRE_COMMIT_CONFIG_PATH={trusted_config}\n")
          PYTHON

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.2

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="0.11.0"
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --connect-timeout 10 --max-time 120 \
            --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${archive}" | sha256sum -c -
          tar -xJf "${archive}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          # v1.7.12 writes ShellCheck stdin before starting it and deadlocks on large run blocks.
          # Pin the upstream fix until a release includes rhysd/actionlint#651.
          ACTIONLINT_REVISION="011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7"
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_REVISION}"
          version="$("$GOBIN/actionlint" -version)"
          printf '%s\n' "$version"
          grep -Fxq "v1.7.13-0.20260419144658-${ACTIONLINT_REVISION:0:12}" <<< "$version"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint

      - name: Audit all workflows with zizmor
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          )
          pre-commit run --config "${PRE_COMMIT_CONFIG_PATH:-.pre-commit-config.yaml}" zizmor --files "${workflow_files[@]}"

      - name: Disallow direct inputs interpolation in composite run blocks
        run: python3 scripts/check-composite-action-input-interpolation.py

      - name: Disallow tracked merge conflict markers
        run: node scripts/check-no-conflict-markers.mjs

  generated-doc-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - *workflow_sanity_checkout_step
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Check config docs drift statefile
        run: pnpm config:docs:check

      - name: Check SQLite sessions/transcripts schema baseline drift
        run: pnpm sqlite:sessions-schema:check

      - name: Check plugin SDK surface budget
        run: pnpm plugin-sdk:surface:check
