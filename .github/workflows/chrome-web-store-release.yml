name: Chrome Web Store Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrome-web-store-release.yml
      - extensions/browser/chrome-extension/**
      - extensions/browser/scripts/copy-chrome-extension.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.16.0"
  # Stable public ID assigned to the approved OpenClaw Chrome Web Store listing.
  CHROME_WEB_STORE_EXTENSION_ID: kcdjddhmeafeomebliikmbpblkmkfoig

jobs:
  publish:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/main'
    name: Upload and publish extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: chrome-web-store-release
      url: https://chromewebstore.google.com/detail/openclaw/kcdjddhmeafeomebliikmbpblkmkfoig
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Chrome Web Store archive
        id: package
        env:
          OPENCLAW_CHROME_EXT_OUT_DIR: ${{ runner.temp }}/chrome-extension
        run: |
          set -euo pipefail
          manifest="extensions/browser/chrome-extension/manifest.json"
          version="$(jq -er '.version | select(test("^[0-9]+(\\.[0-9]+){0,3}$"))' "$manifest")"
          node extensions/browser/scripts/copy-chrome-extension.mjs

          archive="${RUNNER_TEMP}/openclaw-chrome-extension-${version}.zip"
          (
            cd "${OPENCLAW_CHROME_EXT_OUT_DIR}"
            zip -X -q -r "$archive" .
          )
          test -s "$archive"
          unzip -Z1 "$archive" | grep -Fx manifest.json >/dev/null
          if unzip -Z1 "$archive" | grep -E '(\.test(-support|-harness)?\.ts|\.d\.ts)$'; then
            echo "Chrome Web Store archive contains test or type-only files." >&2
            exit 1
          fi
          archived_version="$(unzip -p "$archive" manifest.json | jq -er '.version')"
          if [[ "$archived_version" != "$version" ]]; then
            echo "Packaged manifest version ${archived_version} does not match source ${version}." >&2
            exit 1
          fi
          sha256sum "$archive" | tee "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        env:
          PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          SERVICE_ACCOUNT: ${{ vars.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHER_ID" || { echo "CHROME_WEB_STORE_PUBLISHER_ID is not configured." >&2; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "CHROME_WEB_STORE_SERVICE_ACCOUNT is not configured." >&2; exit 1; }
          test -n "$WORKLOAD_IDENTITY_PROVIDER" || { echo "CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER is not configured." >&2; exit 1; }
          [[ "$PUBLISHER_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Chrome Web Store publisher ID is malformed." >&2; exit 1; }
          [[ "$SERVICE_ACCOUNT" =~ ^[^[:space:]]+@[^[:space:]]+\.iam\.gserviceaccount\.com$ ]] || { echo "Chrome Web Store service account is malformed." >&2; exit 1; }
          [[ "$WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || { echo "Chrome Web Store workload identity provider is malformed." >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CHROME_WEB_STORE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Compare Chrome Web Store version
        id: release
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          EXTENSION_ID: ${{ env.CHROME_WEB_STORE_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          SOURCE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          item_name="publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}"
          api_url="https://chromewebstore.googleapis.com/v2/${item_name}"
          status_path="${RUNNER_TEMP}/chrome-web-store-status.json"
          curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
            --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -o "$status_path" \
            "${api_url}:fetchStatus"

          published_version="$(jq -r '[.publishedItemRevisionStatus.distributionChannels[]?.crxVersion][0] // ""' "$status_path")"
          submitted_version="$(jq -r '[.submittedItemRevisionStatus.distributionChannels[]?.crxVersion][0] // ""' "$status_path")"
          submitted_state="$(jq -r '.submittedItemRevisionStatus.state // ""' "$status_path")"

          if [[ "$SOURCE_VERSION" == "$published_version" || "$SOURCE_VERSION" == "$submitted_version" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store already has version ${SOURCE_VERSION} published or under review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$submitted_state" ]]; then
            echo "Chrome Web Store already has a different active submission (${submitted_version:-unknown}, ${submitted_state})." >&2
            exit 1
          fi

          SOURCE_VERSION="$SOURCE_VERSION" PUBLISHED_VERSION="$published_version" node --input-type=module <<'NODE'
          const parse = (label, value) => {
            if (!value) return [];
            if (!/^\d+(\.\d+){0,3}$/.test(value)) {
              throw new Error(`${label} is not a Chrome manifest version: ${value}`);
            }
            return value.split(".").map(Number);
          };
          const source = parse("Source version", process.env.SOURCE_VERSION);
          const published = parse("Published version", process.env.PUBLISHED_VERSION);
          const width = Math.max(source.length, published.length);
          for (let index = 0; index < width; index += 1) {
            const delta = (source[index] ?? 0) - (published[index] ?? 0);
            if (delta > 0) process.exit(0);
            if (delta < 0) throw new Error("Source extension version must be newer than the published version.");
          }
          if (published.length > 0) throw new Error("Source extension version is not newer than the published version.");
          NODE
          echo "api_url=${api_url}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "published_version=${published_version:-none}" >> "$GITHUB_OUTPUT"

      - name: Upload extension package
        if: steps.release.outputs.publish == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          API_URL: ${{ steps.release.outputs.api_url }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          upload_path="${RUNNER_TEMP}/chrome-web-store-upload.json"
          curl --connect-timeout 10 --max-time 120 \
            --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ARCHIVE}" \
            -o "$upload_path" \
            "${API_URL/\/v2\//\/upload\/v2\/}:upload"

          upload_state="$(jq -er '.uploadState' "$upload_path")"
          if [[ "$upload_state" == "SUCCEEDED" ]]; then
            exit 0
          fi
          if [[ "$upload_state" != "IN_PROGRESS" ]]; then
            echo "Chrome Web Store upload failed with state ${upload_state}." >&2
            jq -c . "$upload_path" >&2
            exit 1
          fi

          status_path="${RUNNER_TEMP}/chrome-web-store-upload-status.json"
          for _ in $(seq 1 60); do
            sleep 5
            curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
              --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -o "$status_path" \
              "${API_URL}:fetchStatus"
            upload_state="$(jq -er '.lastAsyncUploadState' "$status_path")"
            if [[ "$upload_state" == "SUCCEEDED" ]]; then
              exit 0
            fi
            if [[ "$upload_state" != "IN_PROGRESS" ]]; then
              echo "Chrome Web Store upload failed with state ${upload_state}." >&2
              jq -c . "$status_path" >&2
              exit 1
            fi
          done
          echo "Chrome Web Store upload did not finish within five minutes." >&2
          exit 1

      - name: Submit extension for publication
        if: steps.release.outputs.publish == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          API_URL: ${{ steps.release.outputs.api_url }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          publish_path="${RUNNER_TEMP}/chrome-web-store-publish.json"
          curl --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"publishType":"DEFAULT_PUBLISH","blockOnWarnings":true}' \
            -o "$publish_path" \
            "${API_URL}:publish"
          state="$(jq -er '.state' "$publish_path")"
          if [[ "$state" != "PENDING_REVIEW" && "$state" != "PUBLISHED" ]]; then
            echo "Chrome Web Store returned unexpected publication state ${state}." >&2
            jq -c . "$publish_path" >&2
            exit 1
          fi
          {
            echo "### Chrome Web Store"
            echo ""
            echo "Submitted OpenClaw extension ${VERSION}; state: ${state}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-web-store-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ runner.temp }}/chrome-web-store-status.json
            ${{ runner.temp }}/chrome-web-store-upload.json
            ${{ runner.temp }}/chrome-web-store-upload-status.json
            ${{ runner.temp }}/chrome-web-store-publish.json
          if-no-files-found: ignore
          retention-days: 30
