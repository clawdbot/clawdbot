name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v2026.1.15) '
        required: true
        type: string
        default: 'v20260815'

  # 新增：当推送代码时自动触发
  push:
    branches:
      - main # 如果你的默认分支叫 master，请改成 master
    paths:
      - '.github/workflows/android-release.yml' # 监听到当前 workflow 文件被修改就触发
      - 'apps/android/**'                     # 监听到 Android 源码被修改也触发

concurrency: # 只自动取消旧的 push 构建，不取消手动发布。
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.16.0"

jobs:
  publish_signed_android_apk:
    name: Publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # 如果有输入的 tag 则检出 tag，否则检出触发 push 的分支代码
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
                
      - name: Resolve Release Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            pkg_ver="$(node -p 'require("./apps/android/version.json").version')"
            echo "tag=v${pkg_ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "true"
          install-deps: "true"
          use-actions-cache: "false"

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: 物化 signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          signing_dir="$GITHUB_WORKSPACE/apps/android/build/release-signing"
          mkdir -p "$signing_dir"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"

          chmod 600 "$signing_dir/release.keystore"
          test -s "$signing_dir/release.keystore"

          
      - name: Build Android APK
        env:
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_FILE: ${{ github.workspace }}/apps/android/build/release-signing/release.keystore
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd apps/android

          build_commit="$(git rev-parse HEAD)"
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          ./gradlew --no-daemon \
            -PopenclawBuildCommit="$build_commit" \
            -PopenclawBuildTimestamp="$build_timestamp" \
            :app:assembleThirdPartyRelease

      
      - name: 清理物化 signing files
        if: ${{ always() }}
        run: rm -rf apps/android/build/release-signing

      - name: 收集 Android APK
        run: |
          set -euo pipefail      
      
          mapfile -t apk_files < <(
            find apps/android/app/build/outputs/apk \
              -type f \
              -path "*/thirdParty/release/*.apk" \
              -print
          )
      
          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one third-party release APK, found ${#apk_files[@]}"
            printf '%s\n' "${apk_files[@]}"
            exit 1
          fi
                
          apk_path="${apk_files[0]}"
          test -s "$apk_path"
          
          echo "APK found: $apk_path"
          cp "$apk_path" dist/OpenClaw-Android.apk
          
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_SDK_ROOT 和 ANDROID_HOME 均为空"
            exit 1
          fi          
          mapfile -t apksigners < <(
            find "$sdk_root/build-tools" \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name apksigner \
              -print |
            sort -V
          )
          
          if [[ "${#apksigners[@]}" -eq 0 ]]; then
            echo "::error::apksigner not found in $sdk_root/build-tools"
            exit 1
          fi
          
          apksigner_path="${apksigners[$((${#apksigners[@]} - 1))]}"
          
          echo "Using apksigner: $apksigner_path"

          # 注意这里只看有没有签名，没有固定证书指纹
          "$apksigner_path" verify \
            --verbose \
            --print-certs \
            dist/OpenClaw-Android.apk
          
          (
            cd dist
            sha256sum OpenClaw-Android.apk \
              > OpenClaw-Android-SHA256SUMS.txt
          )

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android-Release
          path: dist/
          retention-days: 14
          
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release $RELEASE_TAG already exists, updating assets"

            gh release upload "$RELEASE_TAG" \
              dist/OpenClaw-Android.apk \
              dist/OpenClaw-Android-SHA256SUMS.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating Release $RELEASE_TAG"

            gh release create "$RELEASE_TAG" \
              dist/OpenClaw-Android.apk \
              dist/OpenClaw-Android-SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "OpenClaw Android $RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Summary
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Signed Android APK published"
            echo
            echo "- APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/OpenClaw-Android.apk"
            echo "- Checksums: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/OpenClaw-Android-SHA256SUMS.txt"
            echo "- Provenance: \`gh attestation verify OpenClaw-Android.apk --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/android-release.yml\`"
          } >> "${GITHUB_STEP_SUMMARY}"
