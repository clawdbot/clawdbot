name: version-bump-on-merge

# Bumps package.json (and therefore the Control UI version chip, which embeds
# the package version at build time) once per merged PR on main.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump package version
        id: bump
        run: echo "version=$(node .github/scripts/bump-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "opencrustacean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin main
