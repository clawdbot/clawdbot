name: Android debug Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v2026.1.15)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:     
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: npm install -g pnpm


      - run: pnpm install --frozen-lockfile
      - run: pnpm android:version:sync

      - name: Build
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android
          path: apps/android/app/build/outputs/apk/debug/*.apk
