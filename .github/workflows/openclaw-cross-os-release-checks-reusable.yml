name: OpenClaw Cross-OS Release Checks (Reusable)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Public OpenClaw ref to validate (tag, branch, or full commit SHA)
        required: true
        default: main
        type: string
      workflow_ref:
        description: Optional openclaw/openclaw ref that provides the reusable workflow harness
        required: false
        default: ""
        type: string
      provider:
        description: Provider lane to use for onboarding and the end-to-end turn
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
          - minimax
      mode:
        description: Which release-check lanes to run
        required: true
        default: both
        type: choice
        options:
          - fresh
          - upgrade
          - both
      suite_filter:
        description: Optional focused cross-OS suite filter, e.g. windows/packaged-upgrade or packaged-fresh
        required: false
        default: ""
        type: string
      previous_version:
        description: Optional baseline version for installer/dev-update and packaged upgrade
        required: false
        default: ""
        type: string
      ubuntu_runner:
        description: Optional Linux runner label override
        required: false
        default: ""
        type: string
      windows_runner:
        description: Optional Windows runner label override
        required: false
        default: ""
        type: string
      macos_runner:
        description: Optional macOS runner label override
        required: false
        default: ""
        type: string
      candidate_artifact_name:
        description: Optional artifact name containing the candidate OpenClaw tarball
        required: false
        default: ""
        type: string
      candidate_artifact_id:
        description: Immutable GitHub artifact id for candidate_artifact_name
        required: false
        default: ""
        type: string
      candidate_artifact_digest:
        description: Exact upload-artifact SHA-256 digest for candidate_artifact_id
        required: false
        default: ""
        type: string
      candidate_artifact_run_id:
        description: Exact workflow run id that produced candidate_artifact_id
        required: false
        default: ""
        type: string
      candidate_artifact_run_attempt:
        description: Exact workflow run attempt that produced candidate_artifact_id
        required: false
        default: ""
        type: string
      candidate_file_name:
        description: Optional candidate tarball file name inside candidate_artifact_name
        required: false
        default: ""
        type: string
      candidate_version:
        description: Optional candidate OpenClaw package version
        required: false
        default: ""
        type: string
      candidate_source_sha:
        description: Optional source SHA used to build the candidate tarball
        required: false
        default: ""
        type: string
      candidate_sha256:
        description: Exact candidate tarball SHA-256
        required: false
        default: ""
        type: string
      prepublish_plugin_registry_json:
        description: Optional immutable prerelease plugin registry tuple for manual dispatch
        required: false
        default: ""
        type: string
      openai_model:
        description: OpenAI model for release cross-OS agent-turn smoke
        required: false
        default: ""
        type: string
      advisory:
        description: Treat failures as advisory for the caller
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      advisory:
        description: Treat failures as advisory for the caller
        required: false
        default: false
        type: boolean
      ref:
        description: Public OpenClaw ref to validate (tag, branch, or full commit SHA)
        required: true
        type: string
      workflow_ref:
        description: Optional openclaw/openclaw ref that provides the reusable workflow harness
        required: false
        default: ""
        type: string
      provider:
        description: Provider lane to use for onboarding and the end-to-end turn
        required: true
        type: string
      mode:
        description: Which release-check lanes to run
        required: true
        type: string
      suite_filter:
        description: Optional focused cross-OS suite filter, e.g. windows/packaged-upgrade or packaged-fresh
        required: false
        default: ""
        type: string
      previous_version:
        description: Optional baseline version for the upgrade lane (defaults to npm latest)
        required: false
        default: ""
        type: string
      ubuntu_runner:
        description: Optional Linux runner label override
        required: false
        default: ""
        type: string
      windows_runner:
        description: Optional Windows runner label override
        required: false
        default: ""
        type: string
      macos_runner:
        description: Optional macOS runner label override
        required: false
        default: ""
        type: string
      candidate_artifact_name:
        description: Optional artifact name containing the candidate OpenClaw tarball
        required: false
        default: ""
        type: string
      candidate_artifact_id:
        description: Immutable GitHub artifact id for candidate_artifact_name
        required: false
        default: ""
        type: string
      candidate_artifact_digest:
        description: Exact upload-artifact SHA-256 digest for candidate_artifact_id
        required: false
        default: ""
        type: string
      candidate_artifact_run_id:
        description: Exact workflow run id that produced candidate_artifact_id
        required: false
        default: ""
        type: string
      candidate_artifact_run_attempt:
        description: Exact workflow run attempt that produced candidate_artifact_id
        required: false
        default: ""
        type: string
      candidate_file_name:
        description: Optional candidate tarball file name inside candidate_artifact_name
        required: false
        default: ""
        type: string
      candidate_version:
        description: Optional candidate OpenClaw package version
        required: false
        default: ""
        type: string
      candidate_source_sha:
        description: Optional source SHA used to build the candidate tarball
        required: false
        default: ""
        type: string
      candidate_sha256:
        description: Exact candidate tarball SHA-256
        required: false
        default: ""
        type: string
      prepublish_plugin_registry_json:
        description: Optional immutable prerelease plugin registry tuple
        required: false
        default: ""
        type: string
      openai_model:
        description: OpenAI model for release cross-OS agent-turn smoke
        required: false
        default: ""
        type: string
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      MINIMAX_API_KEY:
        required: false
      OPENCLAW_DISCORD_SMOKE_BOT_TOKEN:
        required: false
      OPENCLAW_DISCORD_SMOKE_GUILD_ID:
        required: false
      OPENCLAW_DISCORD_SMOKE_CHANNEL_ID:
        required: false

permissions: read-all

concurrency:
  group: openclaw-cross-os-release-checks-${{ inputs.ref }}-${{ inputs.provider }}-${{ inputs.mode }}
  cancel-in-progress: ${{ inputs.ref == 'main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.16.0"
  OPENCLAW_REPOSITORY: openclaw/openclaw
  OPENCLAW_CROSS_OS_OPENAI_MODEL: ${{ inputs.openai_model || vars.OPENCLAW_CROSS_OS_OPENAI_MODEL || 'openai/gpt-5.6-luna' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ inputs.advisory }}
    outputs:
      baseline_artifact_digest: ${{ steps.upload_baseline.outputs.artifact-digest }}
      baseline_artifact_id: ${{ steps.upload_baseline.outputs.artifact-id }}
      baseline_artifact_run_attempt: ${{ github.run_attempt }}
      baseline_artifact_run_id: ${{ github.run_id }}
      baseline_file_name: ${{ steps.baseline_metadata.outputs.file_name }}
      baseline_sha256: ${{ steps.baseline_metadata.outputs.sha256 }}
      baseline_spec: ${{ steps.baseline.outputs.value }}
      candidate_artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_artifact_run_attempt: ${{ github.run_attempt }}
      candidate_artifact_run_id: ${{ github.run_id }}
      candidate_file_name: ${{ steps.candidate_metadata.outputs.file_name }}
      candidate_sha256: ${{ steps.candidate_metadata.outputs.sha256 }}
      candidate_version: ${{ steps.candidate_metadata.outputs.version }}
      matrix: ${{ steps.matrix.outputs.value }}
      prepublish_plugin_registry_json: ${{ steps.registry_identity.outputs.json }}
      required_companion_packages_json: ${{ steps.provider_requirements.outputs.json }}
      source_sha: ${{ steps.candidate_metadata.outputs.source_sha }}
      workflow_ref: ${{ steps.workflow_ref.outputs.value }}
    steps:
      - name: Validate provider secret availability
        env:
          PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          case "${PROVIDER}" in
            openai)
              [[ -n "${OPENAI_API_KEY}" ]] || { echo "Missing OPENAI_API_KEY secret." >&2; exit 1; }
              ;;
            anthropic)
              [[ -n "${ANTHROPIC_API_KEY}" ]] || { echo "Missing ANTHROPIC_API_KEY secret." >&2; exit 1; }
              ;;
            minimax)
              [[ -n "${MINIMAX_API_KEY}" ]] || { echo "Missing MINIMAX_API_KEY secret." >&2; exit 1; }
              ;;
            *)
              echo "Unsupported provider: ${PROVIDER}" >&2
              exit 1
              ;;
          esac

      - name: Resolve workflow ref
        id: workflow_ref
        env:
          INPUT_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          WORKFLOW_CONTEXT_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ env.OPENCLAW_REPOSITORY }}
        run: |
          set -euo pipefail
          resolve_unique_remote_ref() {
            local remote_url="$1"
            shift
            local -a refs=("$@")
            local -a matches=()
            local ref=""

            for ref in "${refs[@]}"; do
              [[ -n "${ref}" ]] || continue
              mapfile -t matches < <(
                git ls-remote "${remote_url}" "${ref}" | awk '{print $1}' | awk '!seen[$0]++'
              )
              if [[ "${#matches[@]}" -eq 0 ]]; then
                continue
              fi
              if [[ "${#matches[@]}" -ne 1 ]]; then
                return 2
              fi

              printf '%s\n' "${matches[0]}"
              return 0
            done
            return 1
          }

          if [[ -n "${INPUT_WORKFLOW_REF}" ]]; then
            TARGET_REF="${INPUT_WORKFLOW_REF}"
          elif [[ "${CALLER_REPOSITORY}" == "${WORKFLOW_REPOSITORY}" ]]; then
            TARGET_REF="${CURRENT_SHA}"
          elif [[ "${WORKFLOW_CONTEXT_REF}" == "${WORKFLOW_REPOSITORY}/"* ]] && [[ "${WORKFLOW_CONTEXT_REF}" == *"@"* ]]; then
            TARGET_REF="${WORKFLOW_CONTEXT_REF##*@}"
          else
            echo "Failed to infer workflow ref from github.workflow_ref=${WORKFLOW_CONTEXT_REF}" >&2
            exit 1
          fi

          if [[ "${TARGET_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "value=${TARGET_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REMOTE_URL="https://github.com/${WORKFLOW_REPOSITORY}.git"
          if [[ "${TARGET_REF}" == refs/* ]]; then
            if [[ "${TARGET_REF}" == refs/tags/* ]]; then
              mapfile -t MATCHES < <(
                resolve_unique_remote_ref "${REMOTE_URL}" "${TARGET_REF}^{}" "${TARGET_REF}" || true
              )
            else
              mapfile -t MATCHES < <(resolve_unique_remote_ref "${REMOTE_URL}" "${TARGET_REF}" || true)
            fi
          else
            mapfile -t BRANCH_MATCHES < <(
              resolve_unique_remote_ref "${REMOTE_URL}" "refs/heads/${TARGET_REF}" || true
            )
            mapfile -t TAG_MATCHES < <(
              resolve_unique_remote_ref "${REMOTE_URL}" "refs/tags/${TARGET_REF}^{}" "refs/tags/${TARGET_REF}" || true
            )

            MATCH_COUNT=$(( ${#BRANCH_MATCHES[@]} + ${#TAG_MATCHES[@]} ))
            if [[ "${MATCH_COUNT}" -eq 1 ]]; then
              if [[ "${#BRANCH_MATCHES[@]}" -eq 1 ]]; then
                MATCHES=("${BRANCH_MATCHES[0]}")
              else
                MATCHES=("${TAG_MATCHES[0]}")
              fi
            elif [[ "${MATCH_COUNT}" -eq 0 ]]; then
              MATCHES=()
            else
              echo "Workflow ref resolved ambiguously: ${TARGET_REF}" >&2
              exit 1
            fi
          fi

          case "${#MATCHES[@]}" in
            1)
              echo "value=${MATCHES[0]}" >> "$GITHUB_OUTPUT"
              ;;
            0)
              echo "Failed to resolve workflow ref: ${TARGET_REF}" >&2
              exit 1
              ;;
            *)
              echo "Workflow ref resolved ambiguously: ${TARGET_REF}" >&2
              exit 1
              ;;
          esac

      - name: Checkout workflow repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.OPENCLAW_REPOSITORY }}
          ref: ${{ steps.workflow_ref.outputs.value }}
          path: workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Validate provided candidate artifact binding
        if: inputs.candidate_artifact_name != '' || inputs.candidate_artifact_id != '' || inputs.candidate_artifact_digest != '' || inputs.candidate_artifact_run_id != '' || inputs.candidate_artifact_run_attempt != '' || inputs.candidate_file_name != '' || inputs.candidate_sha256 != '' || inputs.candidate_version != '' || inputs.candidate_source_sha != ''
        env:
          ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          ARTIFACT_RUN_ATTEMPT: ${{ inputs.candidate_artifact_run_attempt }}
          ARTIFACT_RUN_ID: ${{ inputs.candidate_artifact_run_id }}
          CANDIDATE_FILE_NAME: ${{ inputs.candidate_file_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_NAME// }" ||
                ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ||
                ! "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ||
                ! "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ||
                ! "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ||
                -z "${CANDIDATE_FILE_NAME// }" ||
                ! "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ||
                ! "$CANDIDATE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ||
                -z "${CANDIDATE_VERSION// }" ]]; then
            echo "Candidate artifact selection requires the complete immutable artifact and package identity tuple." >&2
            exit 1
          fi
          [[ "$ARTIFACT_NAME" == *"-${ARTIFACT_RUN_ID}-${ARTIFACT_RUN_ATTEMPT}" ]] || {
            echo "Candidate artifact name does not bind the declared producer run attempt." >&2
            exit 1
          }
          if [[ "$INPUT_REF" =~ ^[a-f0-9]{40}$ && "$CANDIDATE_SOURCE_SHA" != "$INPUT_REF" ]]; then
            echo "Candidate package source SHA does not match the selected exact ref." >&2
            exit 1
          fi
          bash workflow/scripts/docker/shared-image-artifact.sh \
            verify-upload "Candidate" \
            "$ARTIFACT_ID" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" \
            "$ARTIFACT_RUN_ID" "$ARTIFACT_RUN_ATTEMPT"

      - name: Checkout public source ref
        if: inputs.candidate_artifact_name == ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.OPENCLAW_REPOSITORY }}
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: ./workflow/.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-file: ${{ inputs.candidate_artifact_name == '' && 'source/package.json' || 'workflow/package.json' }}
          lockfile-path: ${{ inputs.candidate_artifact_name == '' && 'source/pnpm-lock.yaml' || 'workflow/pnpm-lock.yaml' }}
          cache-mode: ${{ inputs.candidate_artifact_name == '' && 'restore' || 'off' }}

      - name: Resolve provider-owned companion requirements
        id: provider_requirements
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          packages_json="$(
            bash workflow/scripts/github/run-openclaw-cross-os-release-checks.sh \
              --resolve-provider-required-companion-packages \
              --provider "$PROVIDER"
          )"
          jq -e 'type == "array" and all(.[]; type == "string")' <<< "$packages_json" >/dev/null
          echo "json=$packages_json" >> "$GITHUB_OUTPUT"

      - name: Normalize companion registry contract
        id: provided_registry
        env:
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          PREPUBLISH_PLUGIN_REGISTRY_JSON: ${{ inputs.prepublish_plugin_registry_json }}
          REQUIRED_COMPANION_PACKAGES_JSON: ${{ steps.provider_requirements.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          required_count="$(jq -er 'length' <<< "$REQUIRED_COMPANION_PACKAGES_JSON")"
          if [[ -z "${CANDIDATE_ARTIFACT_NAME// }" ]]; then
            [[ -z "${PREPUBLISH_PLUGIN_REGISTRY_JSON// }" ]] || {
              echo "Source-built candidates produce their own companion registry and reject a second tuple." >&2
              exit 1
            }
            echo "json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${PREPUBLISH_PLUGIN_REGISTRY_JSON// }" ]]; then
            if [[ "$required_count" -gt 0 ]]; then
              echo "The selected provider requires a complete immutable companion registry tuple." >&2
              exit 1
            fi
            echo "json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          normalized="$(
            jq -ce '
              def digits: test("^[1-9][0-9]*$");
              def hex64: test("^[a-f0-9]{64}$");
              . as $value |
              (keys | sort) == ([
                "prepublishPluginRegistryArtifactDigest",
                "prepublishPluginRegistryArtifactId",
                "prepublishPluginRegistryArtifactName",
                "prepublishPluginRegistryArtifactRunAttempt",
                "prepublishPluginRegistryArtifactRunId",
                "prepublishPluginRegistryManifestSha256"
              ] | sort) and
              all(.[]; type == "string") and
              (.prepublishPluginRegistryArtifactDigest | hex64) and
              (.prepublishPluginRegistryArtifactId | digits) and
              (.prepublishPluginRegistryArtifactRunAttempt | digits) and
              (.prepublishPluginRegistryArtifactRunId | digits) and
              (.prepublishPluginRegistryManifestSha256 | hex64) and
              (.prepublishPluginRegistryArtifactName |
                endswith("-" + $value.prepublishPluginRegistryArtifactRunId + "-" +
                  $value.prepublishPluginRegistryArtifactRunAttempt)) |
              if . then $value else error("invalid prerelease plugin registry tuple") end
            ' <<< "$PREPUBLISH_PLUGIN_REGISTRY_JSON"
          )" || {
            echo "Prerelease companion registry must be one closed immutable JSON tuple." >&2
            exit 1
          }
          if [[ "$required_count" -gt 0 && -z "${normalized// }" ]]; then
            echo "The selected provider requires a complete immutable companion registry tuple." >&2
            exit 1
          fi
          echo "json=$normalized" >> "$GITHUB_OUTPUT"

      - name: Verify provided prerelease plugin registry upload
        if: steps.provided_registry.outputs.json != ''
        env:
          ARTIFACT_DIGEST: ${{ fromJSON(steps.provided_registry.outputs.json || '{}').prepublishPluginRegistryArtifactDigest || '' }}
          ARTIFACT_ID: ${{ fromJSON(steps.provided_registry.outputs.json || '{}').prepublishPluginRegistryArtifactId || '' }}
          ARTIFACT_NAME: ${{ fromJSON(steps.provided_registry.outputs.json || '{}').prepublishPluginRegistryArtifactName || '' }}
          ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(steps.provided_registry.outputs.json || '{}').prepublishPluginRegistryArtifactRunAttempt || '' }}
          ARTIFACT_RUN_ID: ${{ fromJSON(steps.provided_registry.outputs.json || '{}').prepublishPluginRegistryArtifactRunId || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash workflow/scripts/docker/shared-image-artifact.sh \
            verify-upload "Prerelease plugin registry" \
            "$ARTIFACT_ID" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" \
            "$ARTIFACT_RUN_ID" "$ARTIFACT_RUN_ATTEMPT"

      - name: Ensure pnpm store cache directory exists
        run: mkdir -p "$(pnpm store path --silent)"

      - name: Install workflow validation dependencies
        if: inputs.candidate_artifact_name != ''
        working-directory: workflow
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Build candidate artifact once
        if: inputs.candidate_artifact_name == ''
        env:
          OUTPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare
          PROVIDER: ${{ inputs.provider }}
        run: |
          bash workflow/scripts/github/run-openclaw-cross-os-release-checks.sh \
            --prepare-only \
            --provider "$PROVIDER" \
            --source-dir source \
            --output-dir "${OUTPUT_DIR}"

      - name: Pack source-built prerelease companion registry
        id: source_prepublish_plugin_registry
        if: inputs.candidate_artifact_name == '' && steps.provider_requirements.outputs.json != '[]'
        env:
          OUTPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare
          REQUIRED_PACKAGES_JSON: ${{ steps.provider_requirements.outputs.json }}
        run: |
          set -euo pipefail
          result="$(
            node workflow/scripts/prepublish-plugin-registry-artifact.mjs create \
              --repo-root source \
              --artifact-dir "$OUTPUT_DIR/plugins" \
              --source-sha "$(git -C source rev-parse HEAD)" \
              --candidate-version "$(node -p "require('./source/package.json').version")" \
              --required-packages-json "$REQUIRED_PACKAGES_JSON"
          )"
          echo "manifest_sha256=$(jq -er '.manifestSha256' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Download provided candidate artifact
        if: inputs.candidate_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/input
          run-id: ${{ inputs.candidate_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve provided candidate package
        if: inputs.candidate_artifact_name != ''
        env:
          INPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/input
          OUTPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/package
          INPUT_CANDIDATE_FILE_NAME: ${{ inputs.candidate_file_name }}
          INPUT_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          INPUT_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          INPUT_CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          CANDIDATE_JSON: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/candidate.json
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir workflow exec node --import tsx scripts/resolve-openclaw-package-candidate.mts \
            --source artifact \
            --artifact-dir "$INPUT_DIR" \
            --package-sha256 "$INPUT_CANDIDATE_SHA256" \
            --output-dir "$OUTPUT_DIR" \
            --output-name "$INPUT_CANDIDATE_FILE_NAME" \
            --metadata "$OUTPUT_DIR/package-candidate.json"
          actual_sha256="$(
            jq -er '.sha256 | select(type == "string" and test("^[a-f0-9]{64}$"))' \
              "$OUTPUT_DIR/package-candidate.json"
          )"
          actual_source_sha="$(
            jq -er '.packageSourceSha | select(type == "string" and test("^[a-f0-9]{40}$"))' \
              "$OUTPUT_DIR/package-candidate.json"
          )"
          actual_version="$(
            jq -er '.version | select(type == "string" and length > 0)' \
              "$OUTPUT_DIR/package-candidate.json"
          )"
          [[ "$actual_sha256" == "$INPUT_CANDIDATE_SHA256" &&
            "$actual_source_sha" == "$INPUT_CANDIDATE_SOURCE_SHA" &&
            "$actual_version" == "$INPUT_CANDIDATE_VERSION" ]] || {
            echo "Resolved candidate package identity differs from the declared exact tuple." >&2
            exit 1
          }
          export ACTUAL_SHA256="$actual_sha256"
          export ACTUAL_SOURCE_SHA="$actual_source_sha"
          export ACTUAL_VERSION="$actual_version"
          node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(
            process.env.CANDIDATE_JSON,
            `${JSON.stringify(
              {
                candidateFileName: process.env.INPUT_CANDIDATE_FILE_NAME,
                candidateSha256: process.env.ACTUAL_SHA256,
                candidateVersion: process.env.ACTUAL_VERSION,
                sourceSha: process.env.ACTUAL_SOURCE_SHA,
              },
              null,
              2,
            )}\n`,
          );
          NODE

      - name: Resolve baseline package spec
        if: ${{ inputs.mode != 'fresh' }}
        id: baseline
        env:
          INPUT_PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_PREVIOUS_VERSION}" ]]; then
            echo "value=openclaw@${INPUT_PREVIOUS_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASELINE_VERSION="$(npm view openclaw@latest version)"
          echo "value=openclaw@${BASELINE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack baseline artifact
        if: ${{ inputs.mode != 'fresh' }}
        env:
          BASELINE_SPEC: ${{ steps.baseline.outputs.value }}
          OUTPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/baseline
        run: |
          mkdir -p "${OUTPUT_DIR}"
          timeout --preserve-status 300s npm pack --ignore-scripts --json "${BASELINE_SPEC}" --pack-destination "${OUTPUT_DIR}" > "${OUTPUT_DIR}/pack.json"

      - name: Capture candidate metadata
        id: candidate_metadata
        env:
          CANDIDATE_JSON: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/candidate.json
          PACKAGE_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/package
        run: |
          node <<'NODE' >>"$GITHUB_OUTPUT"
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const payload = JSON.parse(fs.readFileSync(process.env.CANDIDATE_JSON, "utf8"));
          const fileName =
            typeof payload.candidateFileName === "string" ? payload.candidateFileName.trim() : "";
          const version =
            typeof payload.candidateVersion === "string" ? payload.candidateVersion.trim() : "";
          const sourceSha = typeof payload.sourceSha === "string" ? payload.sourceSha.trim() : "";
          if (
            !fileName.endsWith(".tgz") ||
            fileName.includes("\0") ||
            fileName !== path.basename(fileName) ||
            fileName !== path.win32.basename(fileName)
          ) {
            throw new Error("Candidate manifest file name must be a local .tgz filename.");
          }
          if (!version) {
            throw new Error("Candidate manifest version is missing.");
          }
          if (!/^[0-9a-f]{40}$/u.test(sourceSha)) {
            throw new Error("Candidate manifest source SHA must be a lowercase full commit SHA.");
          }
          const tarball = path.join(process.env.PACKAGE_DIR, fileName);
          const sha256 = crypto.createHash("sha256").update(fs.readFileSync(tarball)).digest("hex");
          const declaredSha256 =
            typeof payload.candidateSha256 === "string" ? payload.candidateSha256.trim() : "";
          if (declaredSha256 && declaredSha256 !== sha256) {
            throw new Error("Candidate manifest SHA-256 differs from the candidate tarball.");
          }
          process.stdout.write(`file_name=${fileName}\n`);
          process.stdout.write(`sha256=${sha256}\n`);
          process.stdout.write(`version=${version}\n`);
          process.stdout.write(`source_sha=${sourceSha}\n`);
          NODE

      - name: Capture baseline metadata
        if: ${{ inputs.mode != 'fresh' }}
        id: baseline_metadata
        working-directory: workflow
        env:
          BASELINE_PACK_JSON: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/baseline/pack.json
        run: |
          node --import tsx --input-type=module <<'NODE' >>"$GITHUB_OUTPUT"
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { resolveNpmJsonEntries } from "./scripts/lib/npm-json-output.mts";
          function resolveTarballFileName(value, label) {
            const fileName = typeof value === "string" ? value.trim() : "";
            if (
              !fileName.endsWith(".tgz") ||
              fileName.includes("\0") ||
              fileName !== path.basename(fileName) ||
              fileName !== path.win32.basename(fileName)
            ) {
              throw new Error(`${label} must be a local .tgz filename.`);
            }
            return fileName;
          }
          const payload = JSON.parse(fs.readFileSync(process.env.BASELINE_PACK_JSON, "utf8"));
          const entry = resolveNpmJsonEntries(payload).at(-1);
          const fileName = resolveTarballFileName(entry?.filename, "Baseline npm pack filename");
          const sha256 = crypto
            .createHash("sha256")
            .update(fs.readFileSync(path.join(path.dirname(process.env.BASELINE_PACK_JSON), fileName)))
            .digest("hex");
          process.stdout.write(`file_name=${fileName}\n`);
          process.stdout.write(`sha256=${sha256}\n`);
          NODE

      - name: Upload candidate artifact
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-cross-os-release-checks-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/package/${{ steps.candidate_metadata.outputs.file_name }}
          if-no-files-found: error

      - name: Upload source-built prerelease companion registry
        id: upload_prepublish_plugin_registry
        if: inputs.candidate_artifact_name == '' && steps.provider_requirements.outputs.json != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-cross-os-prepublish-plugin-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/plugins/
          if-no-files-found: error

      - name: Upload baseline artifact
        if: ${{ inputs.mode != 'fresh' }}
        id: upload_baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-cross-os-release-checks-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/prepare/baseline/${{ steps.baseline_metadata.outputs.file_name }}
          if-no-files-found: error

      - name: Prepare prerelease plugin registry identity
        id: registry_identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_prepublish_plugin_registry.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload_prepublish_plugin_registry.outputs.artifact-id }}
          MANIFEST_SHA256: ${{ steps.source_prepublish_plugin_registry.outputs.manifest_sha256 }}
          PROVIDED_JSON: ${{ steps.provided_registry.outputs.json }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "json=$PROVIDED_JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -cnr \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg id "$ARTIFACT_ID" \
            --arg manifest "$MANIFEST_SHA256" \
            --arg name "openclaw-cross-os-prepublish-plugin-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run "$GITHUB_RUN_ID" \
            '{
              prepublishPluginRegistryArtifactName: $name,
              prepublishPluginRegistryArtifactId: $id,
              prepublishPluginRegistryArtifactDigest: $digest,
              prepublishPluginRegistryArtifactRunId: $run,
              prepublishPluginRegistryArtifactRunAttempt: $attempt,
              prepublishPluginRegistryManifestSha256: $manifest
            } | "json=\(.)"' >> "$GITHUB_OUTPUT"

      - name: Verify prepared artifact uploads
        env:
          CANDIDATE_DIGEST: ${{ steps.upload_candidate.outputs.artifact-digest }}
          CANDIDATE_ID: ${{ steps.upload_candidate.outputs.artifact-id }}
          BASELINE_DIGEST: ${{ steps.upload_baseline.outputs.artifact-digest }}
          BASELINE_ID: ${{ steps.upload_baseline.outputs.artifact-id }}
          GENERATED_REGISTRY: ${{ steps.upload_prepublish_plugin_registry.outputs.artifact-id != '' }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_JSON: ${{ steps.registry_identity.outputs.json }}
        run: |
          set -euo pipefail
          bash workflow/scripts/docker/shared-image-artifact.sh \
            verify-upload "Candidate" \
            "$CANDIDATE_ID" \
            "openclaw-cross-os-release-checks-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$CANDIDATE_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          if [[ -n "$BASELINE_ID" ]]; then
            bash workflow/scripts/docker/shared-image-artifact.sh \
              verify-upload "Baseline" \
              "$BASELINE_ID" \
              "openclaw-cross-os-release-checks-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "$BASELINE_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          fi
          if [[ "$GENERATED_REGISTRY" == "true" ]]; then
            bash workflow/scripts/docker/shared-image-artifact.sh \
              verify-upload "Prerelease plugin registry" \
              "$(jq -r '.prepublishPluginRegistryArtifactId' <<< "$REGISTRY_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactName' <<< "$REGISTRY_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactDigest' <<< "$REGISTRY_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactRunId' <<< "$REGISTRY_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactRunAttempt' <<< "$REGISTRY_JSON")"
          fi

      - name: Resolve runner matrix
        id: matrix
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SUITE_FILTER: ${{ inputs.suite_filter }}
          INPUT_UBUNTU_RUNNER: ${{ inputs.ubuntu_runner }}
          INPUT_WINDOWS_RUNNER: ${{ inputs.windows_runner }}
          INPUT_MACOS_RUNNER: ${{ inputs.macos_runner }}
          VAR_UBUNTU_RUNNER: ${{ vars.OPENCLAW_RELEASE_CHECKS_UBUNTU_RUNNER }}
          VAR_WINDOWS_RUNNER: ${{ vars.OPENCLAW_RELEASE_CHECKS_WINDOWS_RUNNER }}
          VAR_MACOS_RUNNER: ${{ vars.OPENCLAW_RELEASE_CHECKS_MACOS_RUNNER }}
        run: |
          MATRIX_JSON="$(bash workflow/scripts/github/run-openclaw-cross-os-release-checks.sh \
            --resolve-matrix \
            --ref "${INPUT_REF}" \
            --mode "${INPUT_MODE}" \
            --suite-filter "${INPUT_SUITE_FILTER}" \
            --ubuntu-runner "${INPUT_UBUNTU_RUNNER}" \
            --windows-runner "${INPUT_WINDOWS_RUNNER}" \
            --macos-runner "${INPUT_MACOS_RUNNER}")"
          echo "value=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  cross_os_release_checks:
    name: "${{ matrix.display_name }} / ${{ matrix.suite_label }}"
    needs: prepare
    continue-on-error: ${{ inputs.advisory }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.OPENCLAW_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.workflow_ref }}
          path: workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: ./workflow/.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-file: workflow/package.json
          lockfile-path: workflow/pnpm-lock.yaml
          cache-mode: off

      - name: Download candidate artifact
        id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/candidate
          run-id: ${{ needs.prepare.outputs.candidate_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Retry candidate artifact download
        if: ${{ steps.download_candidate.outcome == 'failure' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/candidate
          run-id: ${{ needs.prepare.outputs.candidate_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download baseline artifact
        if: ${{ matrix.suite == 'packaged-upgrade' }}
        id: download_baseline
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.baseline_artifact_id }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/baseline
          run-id: ${{ needs.prepare.outputs.baseline_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Retry baseline artifact download
        if: ${{ matrix.suite == 'packaged-upgrade' && steps.download_baseline.outcome == 'failure' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.baseline_artifact_id }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/baseline
          run-id: ${{ needs.prepare.outputs.baseline_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download prerelease plugin registry artifact
        if: needs.prepare.outputs.prepublish_plugin_registry_json != ''
        id: download_prepublish_plugin_registry
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ fromJSON(needs.prepare.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactId || '' }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/plugins
          run-id: ${{ fromJSON(needs.prepare.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunId || '' }}
          github-token: ${{ github.token }}

      - name: Retry prerelease plugin registry artifact download
        if: needs.prepare.outputs.prepublish_plugin_registry_json != '' && steps.download_prepublish_plugin_registry.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ fromJSON(needs.prepare.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactId || '' }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/plugins
          run-id: ${{ fromJSON(needs.prepare.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunId || '' }}
          github-token: ${{ github.token }}

      - name: Verify release-check inputs
        shell: bash
        env:
          CANDIDATE_TGZ: ${{ runner.temp }}/openclaw-cross-os-release-checks/candidate/${{ needs.prepare.outputs.candidate_file_name }}
          EXPECTED_CANDIDATE_SHA256: ${{ needs.prepare.outputs.candidate_sha256 }}
          BASELINE_TGZ: ${{ runner.temp }}/openclaw-cross-os-release-checks/baseline/${{ needs.prepare.outputs.baseline_file_name }}
          EXPECTED_BASELINE_SHA256: ${{ needs.prepare.outputs.baseline_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/${{ matrix.artifact_name }}-${{ matrix.suite }}
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p "${OUTPUT_DIR}"
          if [[ ! -f "${CANDIDATE_TGZ}" ]]; then
            echo "::error::candidate artifact missing: ${CANDIDATE_TGZ}"
            exit 1
          fi
          actual_sha256="$(
            node -e '
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              process.stdout.write(
                crypto.createHash("sha256").update(fs.readFileSync(process.env.CANDIDATE_TGZ)).digest("hex"),
              );
            '
          )"
          if [[ ! "$EXPECTED_CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ||
                "$actual_sha256" != "$EXPECTED_CANDIDATE_SHA256" ]]; then
            echo "::error::candidate artifact SHA-256 does not match the prepared package identity"
            exit 1
          fi
          if [[ "${SUITE}" == "packaged-upgrade" ]] && [[ ! -f "${BASELINE_TGZ}" ]]; then
            echo "::error::baseline artifact missing: ${BASELINE_TGZ}"
            exit 1
          fi
          if [[ "${SUITE}" == "packaged-upgrade" ]]; then
            actual_baseline_sha256="$(
              node -e '
                const crypto = require("node:crypto");
                const fs = require("node:fs");
                process.stdout.write(
                  crypto.createHash("sha256").update(fs.readFileSync(process.env.BASELINE_TGZ)).digest("hex"),
                );
              '
            )"
            if [[ ! "$EXPECTED_BASELINE_SHA256" =~ ^[a-f0-9]{64}$ ||
                  "$actual_baseline_sha256" != "$EXPECTED_BASELINE_SHA256" ]]; then
              echo "::error::baseline artifact SHA-256 does not match the prepared package identity"
              exit 1
            fi
          fi
      - name: Run cross-OS release checks
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENCLAW_DISCORD_SMOKE_BOT_TOKEN: ${{ secrets.OPENCLAW_DISCORD_SMOKE_BOT_TOKEN }}
          OPENCLAW_DISCORD_SMOKE_GUILD_ID: ${{ secrets.OPENCLAW_DISCORD_SMOKE_GUILD_ID }}
          OPENCLAW_DISCORD_SMOKE_CHANNEL_ID: ${{ secrets.OPENCLAW_DISCORD_SMOKE_CHANNEL_ID }}
          OPENCLAW_RELEASE_CHECK_OS: ${{ matrix.os_id }}
          OPENCLAW_RELEASE_CHECK_RUNNER: ${{ matrix.runner }}
          CANDIDATE_TGZ: ${{ runner.temp }}/openclaw-cross-os-release-checks/candidate/${{ needs.prepare.outputs.candidate_file_name }}
          CANDIDATE_VERSION: ${{ needs.prepare.outputs.candidate_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BASELINE_SPEC: ${{ needs.prepare.outputs.baseline_spec }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          BASELINE_TGZ: ${{ runner.temp }}/openclaw-cross-os-release-checks/baseline/${{ needs.prepare.outputs.baseline_file_name }}
          PROVIDER: ${{ inputs.provider }}
          MODE: ${{ matrix.lane }}
          SUITE: ${{ matrix.suite }}
          REF: ${{ inputs.ref }}
          OUTPUT_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/${{ matrix.artifact_name }}-${{ matrix.suite }}
          PLUGIN_REGISTRY_JSON: ${{ needs.prepare.outputs.prepublish_plugin_registry_json }}
          PLUGIN_REGISTRY_DIR: ${{ runner.temp }}/openclaw-cross-os-release-checks/plugins
          REQUIRED_COMPANION_PACKAGES_JSON: ${{ needs.prepare.outputs.required_companion_packages_json }}
        run: |
          PLUGIN_ARGS=()
          if [[ -n "$PLUGIN_REGISTRY_JSON" ]]; then
            PLUGIN_ARGS+=(
              --plugin-registry-dir "$PLUGIN_REGISTRY_DIR"
              --plugin-registry-manifest-sha256 \
                "$(jq -r '.prepublishPluginRegistryManifestSha256' <<< "$PLUGIN_REGISTRY_JSON")"
            )
          fi
          DISCORD_ARGS=()
          if [[ -n "${OPENCLAW_DISCORD_SMOKE_BOT_TOKEN}" ]] && [[ -n "${OPENCLAW_DISCORD_SMOKE_GUILD_ID}" ]] && [[ -n "${OPENCLAW_DISCORD_SMOKE_CHANNEL_ID}" ]]; then
            DISCORD_ARGS+=(--run-discord-roundtrip true)
          fi
          run_cross_os_release_checks() {
            bash workflow/scripts/github/run-openclaw-cross-os-release-checks.sh \
              --candidate-tgz "${CANDIDATE_TGZ}" \
              --candidate-version "${CANDIDATE_VERSION}" \
              --source-sha "${SOURCE_SHA}" \
              --baseline-spec "${BASELINE_SPEC}" \
              --previous-version "${PREVIOUS_VERSION}" \
              --baseline-tgz "${BASELINE_TGZ}" \
              --provider "${PROVIDER}" \
              --mode "${MODE}" \
              --suite "${SUITE}" \
              --ref "${REF}" \
              "${PLUGIN_ARGS[@]}" \
              "${DISCORD_ARGS[@]}" \
              --output-dir "${OUTPUT_DIR}"
          }

          if run_cross_os_release_checks; then
            exit 0
          else
            status=$?
          fi

          dashboard_log="${OUTPUT_DIR}/logs/${MODE}-dashboard.log"
          if [[ "${OPENCLAW_RELEASE_CHECK_OS}" != "windows" ||
                "$status" -ne 127 ||
                ! -f "${dashboard_log}" ||
                -f "${OUTPUT_DIR}/summary.json" ]] ||
            ! grep -q 'attempt=.*url=http://127.0.0.1:' "${dashboard_log}"; then
            exit "$status"
          fi

          echo "::warning::retrying Windows release checks after the outer process exited 127 after the dashboard probe and before summary generation"
          run_cross_os_release_checks

      - name: Summarize release checks
        if: always()
        shell: bash
        env:
          SUMMARY_PATH: ${{ runner.temp }}/openclaw-cross-os-release-checks/${{ matrix.artifact_name }}-${{ matrix.suite }}/summary.md
        run: |
          if [[ -f "${SUMMARY_PATH}" ]]; then
            cat "${SUMMARY_PATH}" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p "$(dirname "${SUMMARY_PATH}")"
            echo "No summary generated." | tee "${SUMMARY_PATH}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release-check artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-cross-os-release-checks-${{ matrix.artifact_name }}-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/openclaw-cross-os-release-checks/${{ matrix.artifact_name }}-${{ matrix.suite }}
          if-no-files-found: error
