name: Temporary upstream merge check

on:
  push:
    branches:
      - fix/a2a-prompt-prefix-caching
    paths:
      - .github/workflows/temporary-upstream-merge-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a2a-prompt-prefix-caching
          fetch-depth: 0
      - name: Check merge with current upstream main
        shell: bash
        run: |
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream main
          if git merge --no-commit --no-ff upstream/main; then
            echo "MERGE_CLEAN"
            git merge --abort || true
          else
            echo "CONFLICT_FILES_BEGIN"
            git diff --name-only --diff-filter=U
            echo "CONFLICT_FILES_END"
            exit 1
          fi
