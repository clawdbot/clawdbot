# Task-only baseline proof. Remove this workflow and apps/macos/Proofs/ScreenScrollIntent before landing.
name: Screen scroll intent proof

on:
  push:
    branches: [steipete/fix-screen-scroll-intent-20260902]

permissions:
  contents: read

concurrency:
  group: screen-scroll-intent-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: 2bb2f63a435f03902b49b65c2411776837a62c46
    steps:
      - name: Checkout exact proof revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require disposable host and Xcode 26.6
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          PROOF_EVIDENCE="$RUNNER_TEMP/screen-scroll-evidence"
          printf 'PROOF_PACKAGE=%s\nPROOF_EVIDENCE=%s\n' \
            "$RUNNER_TEMP/screen-scroll-intent" "$PROOF_EVIDENCE" >> "$GITHUB_ENV"
          for xcode_app in /Applications/Xcode_26.6.app /Applications/Xcode-26.6.0.app; do
            if [[ -d "$xcode_app/Contents/Developer" ]]; then
              sudo xcode-select -s "$xcode_app/Contents/Developer"
              break
            fi
          done
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          [[ "$xcode_version" == 26.6* ]]
          mkdir -p "$PROOF_EVIDENCE"
          xcodebuild -version | tee "$PROOF_EVIDENCE/toolchain.txt"
          swift --version | tee -a "$PROOF_EVIDENCE/toolchain.txt"

      - name: Prepare exact baseline and locked dependency fixture
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" -- \
            apps/macos/Sources/OpenClaw/ComputerScreenActionExecutor.swift \
            apps/macos/Package.swift apps/macos/Package.resolved
          git rev-parse HEAD > "$PROOF_EVIDENCE/proof-sha.txt"
          printf '%s\n' "$BASE_SHA" > "$PROOF_EVIDENCE/baseline-sha.txt"
          cp -R apps/macos/Proofs/ScreenScrollIntent "$PROOF_PACKAGE"
          mkdir -p "$PROOF_PACKAGE/Sources/OpenClaw"
          cp apps/macos/Sources/OpenClaw/ComputerScreenActionExecutor.swift \
            "$PROOF_PACKAGE/Sources/OpenClaw/ComputerScreenActionExecutor.swift"
          cp apps/macos/Tests/OpenClawIPCTests/ComputerScreenScrollIntentTests.swift \
            "$PROOF_PACKAGE/Tests/ScreenScrollIntentProofTests/ComputerScreenScrollIntentTests.swift"
          cp apps/macos/Package.resolved "$PROOF_PACKAGE/Package.resolved"
          shasum -a 256 apps/macos/Sources/OpenClaw/ComputerScreenActionExecutor.swift \
            apps/macos/Tests/OpenClawIPCTests/ComputerScreenScrollIntentTests.swift \
            apps/macos/Package.resolved > "$PROOF_EVIDENCE/inputs.sha256"

      - name: Resolve and verify every dependency against the OpenClaw lock
        run: |
          set -euo pipefail
          swift package --package-path "$PROOF_PACKAGE" resolve 2>&1 | tee "$PROOF_EVIDENCE/resolve.log"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          package = pathlib.Path(os.environ["PROOF_PACKAGE"])
          original = json.loads(pathlib.Path("apps/macos/Package.resolved").read_text())
          resolved = json.loads((package / "Package.resolved").read_text())
          locked = {pin["identity"]: pin for pin in original["pins"]}
          actual = {pin["identity"]: pin for pin in resolved["pins"]}
          required = {"peekaboo", "axorcist", "commander", "swift-log", "swift-algorithms", "swift-numerics"}
          assert set(actual) == required, f"Unexpected dependency closure: {set(actual)}"
          for identity, pin in actual.items():
              assert pin == locked[identity], f"Dependency drift: {identity}"
          checkouts = {
              checkout.name: subprocess.check_output(
                  ["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True).strip()
              for checkout in (package / ".build" / "checkouts").iterdir()
              if checkout.is_dir()
          }
          assert len(checkouts) == len(required), f"Unexpected checkouts: {checkouts}"
          assert set(checkouts.values()) == {pin["state"]["revision"] for pin in actual.values()}, "Checkout drift"
          assert actual["peekaboo"]["state"]["revision"] == "8d5e638e6ac9e93fae7d8dcb2ac0a0f01f3d49ec"
          assert actual["axorcist"]["state"]["revision"] == "bab3f2228bac0ce3a34786b8395b65bb36242221"
          evidence = pathlib.Path(os.environ["PROOF_EVIDENCE"])
          (evidence / "checkouts.json").write_text(json.dumps(checkouts, indent=2) + "\n")
          print("All six resolved dependencies and checkouts match OpenClaw's locked graph.")
          PY
          cp "$PROOF_PACKAGE/Package.resolved" "$PROOF_EVIDENCE/Package.resolved"

      - name: Build only the dependency fixture in debug
        run: |
          set -euo pipefail
          swift build --package-path "$PROOF_PACKAGE" --build-system native \
            --build-tests -Xswiftc -enable-testing 2>&1 | tee "$PROOF_EVIDENCE/build.log"

      # A compiler/runner failure is not red proof: the verification step requires
      # the marker emitted only after the real service throws snapshotStale before input.
      - name: Capture real-service red baseline
        id: service_red
        continue-on-error: true
        run: |
          set -euo pipefail
          swift test --package-path "$PROOF_PACKAGE" --build-system native \
            --skip-build --no-parallel --filter 'ScreenScrollServiceProofTests/legacy global request dispatches ticks' \
            2>&1 | tee "$PROOF_EVIDENCE/service-red.log"

      - name: Capture actual caller source-contract red
        id: caller_red
        continue-on-error: true
        run: |
          set -euo pipefail
          swift test --package-path "$PROOF_PACKAGE" --build-system native \
            --skip-build --no-parallel --filter ComputerScreenScrollIntentTests \
            2>&1 | tee "$PROOF_EVIDENCE/caller-red.log"

      - name: Run foreground and background contract diagnostics
        run: |
          set -euo pipefail
          swift test --package-path "$PROOF_PACKAGE" --build-system native \
            --skip-build --no-parallel \
            --filter 'ScreenScrollServiceProofTests/(foreground global request dispatches ticks|background requires snapshot and target even with synth only policy)' \
            2>&1 | tee "$PROOF_EVIDENCE/contracts-green.log"
          grep -F 'SCREEN_SCROLL_FOREGROUND_CHECKED:' "$PROOF_EVIDENCE/contracts-green.log"
          grep -F 'SCREEN_SCROLL_BACKGROUND_CHECKED:' "$PROOF_EVIDENCE/contracts-green.log"

      - name: Verify both reds failed for the intended reasons
        env:
          SERVICE_OUTCOME: ${{ steps.service_red.outcome }}
          CALLER_OUTCOME: ${{ steps.caller_red.outcome }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_OUTCOME" == failure && "$CALLER_OUTCOME" == failure ]]
          grep -F 'SCREEN_SCROLL_SERVICE_RED: snapshotStale; emittedTicks=0; pointerMoves=0' "$PROOF_EVIDENCE/service-red.log"
          grep -F 'SCREEN_SCROLL_FOREGROUND_REQUIRED:' "$PROOF_EVIDENCE/caller-red.log"
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          Baseline real service refused the old request with snapshotStale before synthetic input.
          The actual caller source guard failed on the missing explicit foreground argument.
          Foreground service diagnostics dispatched three bounded downward ticks without moving the pointer.
          Four explicit background requests with missing snapshot or target were refused despite synthOnly policy.
          This is service-contract and caller-source proof, not executor or visible wheel-delivery proof.
          EOF

      - name: Preserve task-scoped proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screen-scroll-intent-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screen-scroll-evidence
          if-no-files-found: warn
          retention-days: 7
