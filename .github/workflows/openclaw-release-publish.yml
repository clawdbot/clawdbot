name: OpenClaw Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v2026.5.1-alpha.1 or v2026.5.1-beta.1
        required: true
        type: string
      preflight_run_id:
        description: Successful OpenClaw NPM Release preflight run id, required for OpenClaw npm or all-publishable plugin publication
        required: false
        type: string
      plugin_sdk_api_acknowledgement:
        description: 8-character digest from the Plugin SDK API diff report when the release changes the SDK
        required: false
        default: ""
        type: string
      full_release_validation_run_id:
        description: Successful Full Release Validation run id for this tag/SHA, required for OpenClaw npm or all-publishable plugin publication
        required: false
        type: string
      full_release_validation_run_attempt:
        description: Exact Full Release Validation run attempt; when omitted, the current attempt is resolved once before publish
        required: false
        type: string
      release_evidence_mode:
        description: Publication evidence contract
        required: true
        default: full-release-validation
        type: choice
        options:
          - full-release-validation
          - authorized-beta-focused-v1
      focused_release_evidence_run_id:
        description: Successful Authorized Beta Focused Validation run id
        required: false
        type: string
      focused_release_evidence_run_attempt:
        description: Exact Authorized Beta Focused Validation run attempt
        required: false
        type: string
      windows_node_tag:
        description: Optional exact openclaw-windows-node release tag to attach Windows assets after publication
        required: false
        type: string
      windows_node_installer_digests:
        description: Optional candidate-approved installer digest map; supply with windows_node_tag
        required: false
        type: string
      npm_telegram_run_id:
        description: Optional successful NPM Telegram Beta E2E run id to include in final release evidence
        required: false
        type: string
      openclaw_npm_resume_run_id:
        description: Successful original OpenClaw NPM Release run id when resuming an already-published package
        required: false
        type: string
      npm_dist_tag:
        description: npm dist-tag for the OpenClaw package
        required: true
        default: beta
        type: choice
        options:
          - alpha
          - beta
          - latest
          - extended-stable
      plugin_publish_scope:
        description: Plugin publish scope to run before OpenClaw publish
        required: true
        default: all-publishable
        type: choice
        options:
          - selected
          - all-publishable
      plugins:
        description: Comma-separated plugin package names when plugin_publish_scope=selected
        required: false
        type: string
      publish_openclaw_npm:
        description: Publish the OpenClaw npm package after plugin npm succeeds; ClawHub may still run
        required: true
        default: true
        type: boolean
      publish_docker_only:
        description: Publish Docker only after independently verifying an already-published beta, stable, or extended-stable npm package
        required: true
        default: false
        type: boolean
      release_profile:
        description: Release coverage profile used for release evidence summaries; default reads it from the validation manifest
        required: false
        default: from-validation
        type: choice
        options:
          - from-validation
          - beta
          - stable
          - full
      wait_for_clawhub:
        description: Wait for and auto-approve ClawHub staging; public verification follows terminal parent success
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  attestations: read
  contents: write

concurrency:
  group: openclaw-release-publish-${{ inputs.npm_dist_tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  resolve_release_target:
    name: Resolve release target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.manifest.outputs.sha || steps.ref.outputs.sha }}
      preflight_artifact_name: ${{ steps.preflight_artifact.outputs.name }}
      preflight_artifact_run_id: ${{ steps.preflight_artifact.outputs.run_id }}
      preflight_tarball_sha256: ${{ steps.manifest.outputs.tarball_sha256 }}
      full_release_validation_run_attempt: ${{ steps.full_run.outputs.attempt }}
      focused_release_evidence_run_attempt: ${{ steps.focused_run.outputs.attempt }}
      focused_release_evidence_workflow_full_ref: ${{ steps.focused_run.outputs.workflow_full_ref }}
      focused_release_evidence_workflow_sha: ${{ steps.focused_run.outputs.workflow_sha }}
      prepared_docker_run_id: ${{ steps.full_manifest.outputs.prepared_docker_run_id }}
      prepared_docker_run_attempt: ${{ steps.full_manifest.outputs.prepared_docker_run_attempt }}
      prepared_docker_artifact_name: ${{ steps.full_manifest.outputs.prepared_docker_artifact_name }}
      prepared_docker_manifest_sha256: ${{ steps.full_manifest.outputs.prepared_docker_manifest_sha256 }}
      coverage_policy: ${{ steps.full_manifest.outputs.coverage_policy }}
      android_pin_version: ${{ steps.ref.outputs.android_pin_version }}
      android_pin_matches: ${{ steps.ref.outputs.android_pin_matches }}
      android_release_note: ${{ steps.ref.outputs.android_release_note }}
    steps:
      - name: Validate inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ inputs.full_release_validation_run_attempt }}
          RELEASE_EVIDENCE_MODE: ${{ inputs.release_evidence_mode }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ inputs.focused_release_evidence_run_attempt }}
          OPENCLAW_NPM_RESUME_RUN_ID: ${{ inputs.openclaw_npm_resume_run_id }}
          PUBLISH_OPENCLAW_NPM: ${{ inputs.publish_openclaw_npm && 'true' || 'false' }}
          PUBLISH_DOCKER_ONLY: ${{ inputs.publish_docker_only && 'true' || 'false' }}
          PLUGIN_PUBLISH_SCOPE: ${{ inputs.plugin_publish_scope }}
          PLUGINS: ${{ inputs.plugins }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_EVIDENCE_MODE="${RELEASE_EVIDENCE_MODE:-full-release-validation}"
          FOCUSED_RELEASE_EVIDENCE_RUN_ID="${FOCUSED_RELEASE_EVIDENCE_RUN_ID:-}"
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT="${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT:-}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-(alpha|beta)\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" == *"-alpha."* && "${RELEASE_NPM_DIST_TAG}" != "alpha" ]]; then
            echo "Alpha prerelease tags must publish OpenClaw to npm dist-tag alpha." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" == *"-beta."* && "${RELEASE_NPM_DIST_TAG}" != "beta" ]]; then
            echo "Beta prerelease tags must publish OpenClaw to npm dist-tag beta." >&2
            exit 1
          fi
          release_evidence_required=false
          if [[ "${PUBLISH_OPENCLAW_NPM}" == "true" || "${PUBLISH_DOCKER_ONLY}" == "true" || "${PLUGIN_PUBLISH_SCOPE}" == "all-publishable" ]]; then
            release_evidence_required=true
          fi
          release_evidence_supplied=false
          if [[ -n "${PREFLIGHT_RUN_ID//[[:space:]]/}" || -n "${FULL_RELEASE_VALIDATION_RUN_ID//[[:space:]]/}" || -n "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT//[[:space:]]/}" || -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ID//[[:space:]]/}" || -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT//[[:space:]]/}" ]]; then
            release_evidence_supplied=true
          fi
          if [[ "${release_evidence_required}" == "true" || "${release_evidence_supplied}" == "true" ]]; then
            if [[ -z "${PREFLIGHT_RUN_ID//[[:space:]]/}" ]]; then
              echo "OpenClaw npm and all-publishable plugin publication require preflight_run_id; supplied release evidence must also be complete." >&2
              exit 1
            fi
            if [[ "${RELEASE_EVIDENCE_MODE}" == "full-release-validation" ]]; then
              if [[ -z "${FULL_RELEASE_VALIDATION_RUN_ID//[[:space:]]/}" ]]; then
                echo "OpenClaw npm and all-publishable plugin publication require full_release_validation_run_id; supplied release evidence must also be complete." >&2
                exit 1
              fi
              if [[ -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ID//[[:space:]]/}" || -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT//[[:space:]]/}" ]]; then
                echo "Full release validation evidence mode must not include focused evidence inputs." >&2
                exit 1
              fi
            elif [[ "${RELEASE_EVIDENCE_MODE}" == "authorized-beta-focused-v1" ]]; then
              if [[ "${RELEASE_TAG}" != "v2026.8.1-beta.3" || "${RELEASE_NPM_DIST_TAG}" != "beta" ]]; then
                echo "authorized-beta-focused-v1 is restricted to v2026.8.1-beta.3 on the beta dist-tag." >&2
                exit 1
              fi
              if [[ -n "${FULL_RELEASE_VALIDATION_RUN_ID//[[:space:]]/}" || -n "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT//[[:space:]]/}" ]]; then
                echo "authorized-beta-focused-v1 must not include full release validation inputs." >&2
                exit 1
              fi
              if [[ -z "${FOCUSED_RELEASE_EVIDENCE_RUN_ID//[[:space:]]/}" || -z "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT//[[:space:]]/}" ]]; then
                echo "authorized-beta-focused-v1 requires the exact focused evidence run id and attempt." >&2
                exit 1
              fi
            else
              echo "Unsupported release_evidence_mode: ${RELEASE_EVIDENCE_MODE}" >&2
              exit 1
            fi
          fi
          if [[ -n "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}" && -z "${FULL_RELEASE_VALIDATION_RUN_ID}" ]]; then
            echo "full_release_validation_run_attempt requires full_release_validation_run_id." >&2
            exit 1
          fi
          if [[ -n "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}" && ! "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "full_release_validation_run_attempt must be a positive integer." >&2
            exit 1
          fi
          if [[ -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}" && -z "${FOCUSED_RELEASE_EVIDENCE_RUN_ID}" ]]; then
            echo "focused_release_evidence_run_attempt requires focused_release_evidence_run_id." >&2
            exit 1
          fi
          if [[ -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}" && ! "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "focused_release_evidence_run_attempt must be a positive integer." >&2
            exit 1
          fi
          if [[ -n "${OPENCLAW_NPM_RESUME_RUN_ID}" && ! "${OPENCLAW_NPM_RESUME_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "openclaw_npm_resume_run_id must be a positive GitHub Actions run id." >&2
            exit 1
          fi
          if [[ -n "${OPENCLAW_NPM_RESUME_RUN_ID}" && "${PUBLISH_OPENCLAW_NPM}" != "true" ]]; then
            echo "openclaw_npm_resume_run_id requires publish_openclaw_npm=true." >&2
            exit 1
          fi
          if [[ "${PUBLISH_DOCKER_ONLY}" == "true" ]]; then
            if [[ "${PUBLISH_OPENCLAW_NPM}" == "true" ]]; then
              echo "publish_docker_only requires publish_openclaw_npm=false." >&2
              exit 1
            fi
            if [[ "${RELEASE_NPM_DIST_TAG}" != "beta" && "${RELEASE_NPM_DIST_TAG}" != "extended-stable" && "${RELEASE_NPM_DIST_TAG}" != "latest" ]]; then
              echo "publish_docker_only supports already-published beta, stable, or extended-stable releases only." >&2
              exit 1
            fi
          fi
          # Before checkout, admit latest only for the regular stable train (patches 1-32).
          if [[ "${PUBLISH_DOCKER_ONLY}" == "true" && "${RELEASE_NPM_DIST_TAG}" == "latest" && ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[0-2])(-[1-9][0-9]*)?$ ]]; then
            echo "Docker-only latest recovery requires a regular stable release tag." >&2
            exit 1
          fi
          if [[ "${RELEASE_NPM_DIST_TAG}" == "extended-stable" && "${PUBLISH_OPENCLAW_NPM}" == "true" ]]; then
            echo "Extended-stable core npm publication stays on the canonical extended-stable release flow; use publish_docker_only=true only after its registry readback." >&2
            exit 1
          fi
          tideclaw_alpha_publish=false
          if [[ "${RELEASE_TAG}" == *"-alpha."* && "${RELEASE_NPM_DIST_TAG}" == "alpha" && "${WORKFLOW_REF}" =~ ^refs/heads/tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            tideclaw_alpha_publish=true
          fi
          sha_pinned_release_publish=false
          if [[ "${WORKFLOW_REF}" =~ ^refs/tags/release-publish/([a-f0-9]{12})-[1-9][0-9]*$ ]]; then
            if [[ "${WORKFLOW_SHA:0:12}" != "${BASH_REMATCH[1]}" ]]; then
              echo "SHA-pinned release publish tag does not match workflow SHA ${WORKFLOW_SHA}." >&2
              exit 1
            fi
            workflow_tag="${WORKFLOW_REF#refs/tags/}"
            remote_workflow_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${workflow_tag}" \
                --jq '.object | select(.type == "commit") | .sha | select(test("^[a-f0-9]{40}$"))'
            )"
            if [[ "${remote_workflow_sha}" != "${WORKFLOW_SHA}" ]]; then
              echo "SHA-pinned release publish tag does not resolve to workflow SHA ${WORKFLOW_SHA}." >&2
              exit 1
            fi
            sha_pinned_release_publish=true
          fi
          # Docker-only recovery dispatches no publishing children and may use main.
          if [[ "${tideclaw_alpha_publish}" != "true" && "${sha_pinned_release_publish}" != "true" && ! ( "${PUBLISH_DOCKER_ONLY}" == "true" && "${WORKFLOW_REF}" == "refs/heads/main" ) ]]; then
            publish_tag="release-publish/${WORKFLOW_SHA:0:12}-$(date +%s)"
            echo "Publishing children requires the parent to run from a protected release-publish tag (or a matching Tideclaw alpha branch), so parent approval and child provenance use the same ref." >&2
            echo "Mint the tooling tag: git tag ${publish_tag} ${WORKFLOW_SHA} && git push origin refs/tags/${publish_tag}" >&2
            echo "Then dispatch: gh workflow run openclaw-release-publish.yml --ref ${publish_tag} (with the same release inputs)." >&2
            exit 1
          fi
          if [[ "${PUBLISH_OPENCLAW_NPM}" == "true" && "${PLUGIN_PUBLISH_SCOPE}" != "all-publishable" ]]; then
            echo "publish_openclaw_npm=true requires plugin_publish_scope=all-publishable so every publishable official plugin is released with OpenClaw." >&2
            exit 1
          fi
          if [[ "${PLUGIN_PUBLISH_SCOPE}" == "selected" && -z "${PLUGINS//[[:space:]]/}" ]]; then
            echo "plugin_publish_scope=selected requires plugins." >&2
            exit 1
          fi
          if [[ "${PLUGIN_PUBLISH_SCOPE}" == "all-publishable" && -n "${PLUGINS//[[:space:]]/}" ]]; then
            echo "plugin_publish_scope=all-publishable must not include plugins." >&2
            exit 1
          fi
          case "$RELEASE_PROFILE" in
            from-validation|beta|stable|full) ;;
            *)
              echo "release_profile must be one of: from-validation, beta, stable, full" >&2
              exit 1
              ;;
          esac

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            package.json
            apps/android/version.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve checked-out release ref
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_OPENCLAW_NPM: ${{ inputs.publish_openclaw_npm && 'true' || 'false' }}
          PUBLISH_DOCKER_ONLY: ${{ inputs.publish_docker_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          # The pin comes from the release checkout and is echoed into GITHUB_OUTPUT;
          # only an exact YYYY.M.PATCH string may pass so it cannot inject output records.
          android_pin_version="$(jq -r '.version // empty' apps/android/version.json)"
          if [[ ! "${android_pin_version}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]{1,3}$ ]]; then
            echo "apps/android/version.json must pin an exact YYYY.M.PATCH Android version, got: ${android_pin_version@Q}" >&2
            exit 1
          fi
          android_pin_matches=false
          android_release_note=""
          if [[ "${android_pin_version}" == "${release_version%%-*}" ]]; then
            android_pin_matches=true
          elif [[ "${PUBLISH_OPENCLAW_NPM}" == "true" && "${PUBLISH_DOCKER_ONLY}" != "true" && "${RELEASE_TAG}" != *"-alpha."* && "${RELEASE_TAG}" != *"-beta."* ]]; then
            android_release_note="- Android APK: skipped — apps/android/version.json is ${android_pin_version}, release train is ${release_version%%-*}; run the shared mobile cutter (scripts/mobile-release-version.ts --prepare) before the next tag."
            echo "${android_release_note}" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "android_pin_version=${android_pin_version}"
            echo "android_pin_matches=${android_pin_matches}"
            echo "android_release_note=${android_release_note}"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact release and trusted tooling ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # SDK and focused evidence need complete history, not every repository ref.
          git fetch --no-tags --filter=blob:none --unshallow origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" "${WORKFLOW_SHA}"

      - name: Checkout trusted release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-validation-tooling
          fetch-depth: 1
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve full release validation run
        id: full_run
        if: ${{ inputs.release_evidence_mode == 'full-release-validation' && (inputs.publish_openclaw_npm || inputs.plugin_publish_scope == 'all-publishable' || inputs.preflight_run_id != '' || inputs.full_release_validation_run_id != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ inputs.full_release_validation_run_attempt }}
        run: |
          set -euo pipefail
          run_file="${RUNNER_TEMP}/full-release-validation-run.json"
          run_endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${FULL_RELEASE_VALIDATION_RUN_ID}"
          if [[ -n "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}" ]]; then
            run_endpoint+="/attempts/${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}"
          fi
          gh api "$run_endpoint" > "$run_file"
          run_attempt="$(jq -r '.run_attempt // ""' "$run_file")"
          if [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "Full Release Validation run ${FULL_RELEASE_VALIDATION_RUN_ID} has invalid attempt: ${run_attempt:-<missing>}." >&2
            exit 1
          fi
          if [[ -n "${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}" && "$run_attempt" != "$FULL_RELEASE_VALIDATION_RUN_ATTEMPT" ]]; then
            echo "Full Release Validation run attempt mismatch: expected ${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}, got ${run_attempt}." >&2
            exit 1
          fi
          echo "attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Download full release validation manifest
        if: ${{ inputs.release_evidence_mode == 'full-release-validation' && (inputs.publish_openclaw_npm || inputs.plugin_publish_scope == 'all-publishable' || inputs.preflight_run_id != '' || inputs.full_release_validation_run_id != '') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-release-validation-${{ inputs.full_release_validation_run_id }}-${{ steps.full_run.outputs.attempt }}
          path: ${{ runner.temp }}/full-release-validation-manifest
          repository: ${{ github.repository }}
          run-id: ${{ inputs.full_release_validation_run_id }}
          github-token: ${{ github.token }}

      - name: Validate full release validation manifest
        id: full_manifest
        if: ${{ inputs.release_evidence_mode == 'full-release-validation' && (inputs.publish_openclaw_npm || inputs.plugin_publish_scope == 'all-publishable' || inputs.preflight_run_id != '' || inputs.full_release_validation_run_id != '') }}
        env:
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ steps.full_run.outputs.attempt }}
          GH_TOKEN: ${{ github.token }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
          EXPECTED_RELEASE_PROFILE: ${{ inputs.release_profile }}
          EXPECTED_WORKFLOW_BRANCH: ${{ github.ref_name }}
          TRUSTED_WORKFLOW_FULL_REF: ${{ github.ref }}
          TRUSTED_WORKFLOW_REF: ${{ github.ref_name }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_JSON_FILE: ${{ runner.temp }}/full-release-validation-run.json
          VALIDATOR_FILE: ${{ github.workspace }}/.release-validation-tooling/scripts/validate-full-release-validation-evidence.mjs
          STRICT_VALIDATOR_FILE: ${{ github.workspace }}/.release-validation-tooling/scripts/release-ci-summary.mjs
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/full-release-validation-manifest/full-release-validation-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "Full release validation manifest is missing." >&2
            ls -la "${RUNNER_TEMP}/full-release-validation-manifest" >&2 || true
            exit 1
          fi
          trusted_main_ref="refs/remotes/origin/main"
          if [[ "${TRUSTED_WORKFLOW_FULL_REF}" =~ ^refs/tags/release-publish/[a-f0-9]{12}-[1-9][0-9]*$ ]]; then
            trusted_publisher_ref="refs/tags/${TRUSTED_WORKFLOW_REF}"
            git fetch --no-tags origin \
              "+${TRUSTED_WORKFLOW_FULL_REF}:${trusted_publisher_ref}"
            if [[ "$(git rev-parse "${trusted_publisher_ref}^{commit}")" != "${GITHUB_SHA}" ]]; then
              echo "Trusted release-publish tag moved after workflow dispatch." >&2
              exit 1
            fi
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:${trusted_main_ref}"
          TRUSTED_MAIN_REF="${trusted_main_ref}" \
            MANIFEST_FILE="$manifest" \
            node "$VALIDATOR_FILE" < "$RUN_JSON_FILE"
          node "$STRICT_VALIDATOR_FILE" \
            --validate-run "$FULL_RELEASE_VALIDATION_RUN_ID" \
            --trusted-workflow-ref "$TRUSTED_WORKFLOW_REF" \
            --trusted-workflow-full-ref "$TRUSTED_WORKFLOW_FULL_REF" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --json \
            --verifier-source-sha "$GITHUB_SHA" \
            --verifier-source-file "$STRICT_VALIDATOR_FILE" >/dev/null

          workflow_name="$(jq -r '.workflowName // ""' "$manifest")"
          target_sha="$(jq -r '.targetSha // ""' "$manifest")"
          release_profile="$(jq -r '.releaseProfile // ""' "$manifest")"
          rerun_group="$(jq -r '.rerunGroup // ""' "$manifest")"
          run_release_soak="$(jq -r '.runReleaseSoak // ""' "$manifest")"
          performance_blocking="$(jq -r '.controls.performanceBlocking // false' "$manifest")"
          if [[ "$workflow_name" != "Full Release Validation" ]]; then
            echo "Full release validation manifest workflow mismatch: $workflow_name" >&2
            exit 1
          fi
          if [[ "$target_sha" != "$EXPECTED_SHA" ]]; then
            echo "Full release validation target SHA mismatch: expected $EXPECTED_SHA, got $target_sha" >&2
            exit 1
          fi
          if [[ "$EXPECTED_RELEASE_PROFILE" != "from-validation" && "$release_profile" != "$EXPECTED_RELEASE_PROFILE" ]]; then
            echo "Full release validation profile mismatch: expected $EXPECTED_RELEASE_PROFILE, got $release_profile" >&2
            exit 1
          fi
          if [[ "$rerun_group" != "all" ]]; then
            echo "Full release validation must run rerun_group=all before npm publish; got $rerun_group" >&2
            exit 1
          fi
          if [[ "$release_profile" != "beta" && "$performance_blocking" != "true" ]]; then
            echo "Full release validation manifest does not record blocking product performance evidence." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != *"-alpha."* && "$RELEASE_TAG" != *"-beta."* && "$run_release_soak" != "true" ]]; then
            echo "Stable releases require Full Release Validation with runReleaseSoak=true." >&2
            exit 1
          fi
          echo "release_profile=$release_profile" >> "$GITHUB_OUTPUT"
          echo "coverage_policy=$(jq -r '.validationInputs.coveragePolicy // ""' "$manifest")" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { preparedDockerEvidenceFromFullRelease } from './.release-validation-tooling/scripts/docker-release-artifacts.mjs';
          const env = process.env;
          const prepared = env.RELEASE_TAG.includes('-alpha.') ? null : preparedDockerEvidenceFromFullRelease({ manifest: JSON.parse(readFileSync(`${env.RUNNER_TEMP}/full-release-validation-manifest/full-release-validation-manifest.json`, 'utf8')), sourceSha: env.EXPECTED_SHA, runId: env.FULL_RELEASE_VALIDATION_RUN_ID, runAttempt: env.FULL_RELEASE_VALIDATION_RUN_ATTEMPT });
          if (prepared) {
            appendFileSync(env.GITHUB_OUTPUT, `prepared_docker_run_id=${prepared.preparedRunId}\nprepared_docker_run_attempt=${prepared.preparedRunAttempt}\nprepared_docker_artifact_name=${prepared.preparedArtifactName}\nprepared_docker_manifest_sha256=${prepared.preparedManifestSha256}\n`);
          }
          NODE

      - name: Download OpenClaw npm preflight manifest
        id: preflight_artifact
        if: ${{ inputs.publish_openclaw_npm || inputs.plugin_publish_scope == 'all-publishable' || inputs.preflight_run_id != '' || inputs.full_release_validation_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ steps.full_run.outputs.attempt }}
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          preferred_name="openclaw-npm-preflight-${RELEASE_TAG}"
          preflight_dir="${RUNNER_TEMP}/openclaw-npm-preflight-manifest"
          rm -rf "${preflight_dir}"
          mkdir -p "${preflight_dir}"

          download_named_artifact() {
            local artifact_name="$1"
            local artifact_dir="${2:-$preflight_dir}"
            for attempt in 1 2 3; do
              if gh run download "${PREFLIGHT_RUN_ID}" \
                --repo "${GITHUB_REPOSITORY}" \
                --name "${artifact_name}" \
                --dir "${artifact_dir}"; then
                return 0
              fi
              if [[ "$attempt" != "3" ]]; then
                echo "::warning::Artifact download for ${artifact_name} failed on attempt ${attempt}; retrying."
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          full_release_preflight=false
          if [[ "$PREFLIGHT_RUN_ID" == "$FULL_RELEASE_VALIDATION_RUN_ID" ]]; then
            full_manifest="${RUNNER_TEMP}/full-release-validation-manifest/full-release-validation-manifest.json"
            resolution="$(node "${GITHUB_WORKSPACE}/.release-validation-tooling/scripts/npm-preflight-tooling-identity.mjs" \
              --resolve-full-release-manifest "$full_manifest" \
              --repository "$GITHUB_REPOSITORY" --run-id "$FULL_RELEASE_VALIDATION_RUN_ID" \
              --run-attempt "$FULL_RELEASE_VALIDATION_RUN_ATTEMPT" --source-sha "$EXPECTED_SHA" \
              --workflow-sha "$(jq -r .workflowSha "$full_manifest")" --output-dir "$preflight_dir")"
            PREFLIGHT_RUN_ID="$(jq -r .producer.runId <<<"$resolution")"
            preflight_run="$(jq -c .run <<<"$resolution")"
            resolved_name="$(jq -r .artifact.name <<<"$resolution")"
            full_release_preflight=true
          elif download_named_artifact "${preferred_name}"; then
            resolved_name="${preferred_name}"
          else
            echo "::warning::${preferred_name} not found; checking run artifacts for a single compatible preflight artifact."
            mapfile -t matches < <(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.expired != true) | .name' |
              grep '^openclaw-npm-preflight-' || true)
            if [[ "${#matches[@]}" != "1" ]]; then
              echo "Expected ${preferred_name}, or exactly one openclaw-npm-preflight-* fallback artifact in run ${PREFLIGHT_RUN_ID}." >&2
              printf 'Available preflight candidates:\n' >&2
              printf -- '- %s\n' "${matches[@]:-<none>}" >&2
              exit 1
            fi
            resolved_name="${matches[0]}"
            download_named_artifact "${resolved_name}"
          fi
          echo "name=${resolved_name}" >> "$GITHUB_OUTPUT"

          if [[ "$full_release_preflight" != "true" ]]; then
            preflight_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
          fi
          preflight_attempt="$(jq -r '.run_attempt // ""' <<<"$preflight_run")"
          if [[ ! "$preflight_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "OpenClaw npm preflight run has an invalid attempt: ${preflight_attempt:-<missing>}." >&2
            exit 1
          fi
          preflight_head_sha="$(jq -r '.head_sha // ""' <<<"$preflight_run")"
          preflight_head_branch="$(jq -r '.head_branch // ""' <<<"$preflight_run")"
          preflight_conclusion="$(jq -r '.conclusion // ""' <<<"$preflight_run")"
          preflight_event="$(jq -r '.event // ""' <<<"$preflight_run")"
          preflight_path="$(jq -r '.path // "" | split("@")[0]' <<<"$preflight_run")"
          if [[ ! "$preflight_head_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "OpenClaw npm preflight run must have an exact head SHA." >&2
            exit 1
          fi
          extended_stable_preflight=false
          expected_extended_stable_branch=""
          if [[ "$RELEASE_TAG" =~ ^v([0-9]{4})\.([1-9][0-9]*)\. ]]; then
            expected_extended_stable_branch="extended-stable/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.33"
          fi
          if [[ "$full_release_preflight" != "true" && "$RELEASE_NPM_DIST_TAG" == "extended-stable" && "$preflight_head_branch" == "$expected_extended_stable_branch" ]]; then
            extended_stable_preflight=true
          fi
          active_branch_preflight=false
          if [[ "$preflight_head_branch" != release-publish/* && "refs/heads/${preflight_head_branch}" == "$GITHUB_REF" ]]; then
            active_branch_preflight=true
          fi
          protected_release_publish_preflight=false
          if [[ "$preflight_head_branch" == release-publish/* ]]; then
            producer_tooling="${GITHUB_WORKSPACE}/.release-validation-tooling/scripts"
            node "${producer_tooling}/npm-preflight-tooling-identity.mjs" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow-ref "$preflight_head_branch" \
              --workflow-full-ref "refs/tags/${preflight_head_branch}" \
              --workflow-sha "$preflight_head_sha" \
              --publisher-sha "$WORKFLOW_SHA"
            protected_release_publish_preflight=true
          fi
          if [[ "$preflight_head_branch" != "main" && "$active_branch_preflight" != "true" && "$extended_stable_preflight" != "true" && "$protected_release_publish_preflight" != "true" && "$full_release_preflight" != "true" ]]; then
            echo "OpenClaw npm preflight run must come from main, the active protected release branch, or a verified protected release-publish tag." >&2
            exit 1
          fi
          if [[ "$preflight_conclusion" != "success" || "$(jq -r '.status' <<<"$preflight_run")" != "completed" || "$preflight_event" != "workflow_dispatch" || ( "$preflight_path" != ".github/workflows/openclaw-npm-release.yml" && "$full_release_preflight" != "true" ) ]]; then
            echo "OpenClaw npm preflight evidence requires a successful NPM Release or exact Full Release Validation dispatch." >&2
            exit 1
          fi
          echo "head_sha=${preflight_head_sha}" >> "$GITHUB_OUTPUT"
          echo "head_branch=${preflight_head_branch}" >> "$GITHUB_OUTPUT"
          echo "run_id=${PREFLIGHT_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "run_attempt=${preflight_attempt}" >> "$GITHUB_OUTPUT"
          echo "workflow_path=${preflight_path}" >> "$GITHUB_OUTPUT"
          sdk_evidence_dir="${RUNNER_TEMP}/openclaw-plugin-sdk-api-evidence"
          rm -rf "$sdk_evidence_dir"
          mkdir -p "$sdk_evidence_dir"
          download_named_artifact \
            "plugin-sdk-api-release-diff-${PREFLIGHT_RUN_ID}-${preflight_attempt}" \
            "$sdk_evidence_dir"

      - name: Validate OpenClaw npm preflight manifest
        id: manifest
        if: ${{ inputs.publish_openclaw_npm || inputs.plugin_publish_scope == 'all-publishable' || inputs.preflight_run_id != '' || inputs.full_release_validation_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_WORKFLOW_PATH: ${{ steps.preflight_artifact.outputs.workflow_path }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
          PLUGIN_SDK_API_ACKNOWLEDGEMENT: ${{ inputs.plugin_sdk_api_acknowledgement }}
          PLUGIN_SDK_API_VALIDATOR: ${{ github.workspace }}/.release-validation-tooling/scripts/plugin-sdk-api-release-evidence.mjs
          PREFLIGHT_WORKFLOW_SHA: ${{ steps.preflight_artifact.outputs.head_sha }}
          PREFLIGHT_WORKFLOW_BRANCH: ${{ steps.preflight_artifact.outputs.head_branch }}
          PREFLIGHT_RUN_ID: ${{ steps.preflight_artifact.outputs.run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ steps.preflight_artifact.outputs.run_attempt }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ steps.full_run.outputs.attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          preflight_dir="${RUNNER_TEMP}/openclaw-npm-preflight-manifest"
          manifest="${preflight_dir}/preflight-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "OpenClaw npm preflight manifest is missing." >&2
            ls -la "$preflight_dir" >&2 || true
            exit 1
          fi
          producer_full_ref="refs/heads/${PREFLIGHT_WORKFLOW_BRANCH}"
          if [[ "$PREFLIGHT_WORKFLOW_BRANCH" == release-publish/* ]]; then
            producer_full_ref="refs/tags/${PREFLIGHT_WORKFLOW_BRANCH}"
          fi
          qualification_args=(--workflow-path "$PREFLIGHT_WORKFLOW_PATH")
          if [[ "$PREFLIGHT_WORKFLOW_PATH" == ".github/workflows/full-release-validation.yml" || "$PREFLIGHT_WORKFLOW_PATH" == ".github/workflows/full-release-artifacts.yml" ]]; then
            qualification_args+=(--full-release-manifest "${RUNNER_TEMP}/full-release-validation-manifest/full-release-validation-manifest.json"
              --full-release-run-id "$FULL_RELEASE_VALIDATION_RUN_ID" --full-release-run-attempt "$FULL_RELEASE_VALIDATION_RUN_ATTEMPT")
          fi
          node "${GITHUB_WORKSPACE}/.release-validation-tooling/scripts/npm-preflight-tooling-identity.mjs" \
            "${qualification_args[@]}" \
            --manifest "$manifest" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-full-ref "$producer_full_ref" \
            --workflow-sha "$PREFLIGHT_WORKFLOW_SHA" \
            --run-id "$PREFLIGHT_RUN_ID" \
            --run-attempt "$PREFLIGHT_RUN_ATTEMPT"
          release_tag="$(jq -r '.releaseTag // ""' "$manifest")"
          release_sha="$(jq -r '.releaseSha // ""' "$manifest")"
          tarball_name="$(jq -r '.tarballName // ""' "$manifest")"
          tarball_sha256="$(jq -r '.tarballSha256 // ""' "$manifest")"
          if [[ "$release_tag" != "$RELEASE_TAG" ]]; then
            echo "Preflight manifest tag mismatch: expected $RELEASE_TAG, got $release_tag" >&2
            exit 1
          fi
          if [[ "$release_sha" != "$EXPECTED_SHA" ]]; then
            echo "Preflight manifest SHA mismatch: expected $EXPECTED_SHA, got $release_sha" >&2
            exit 1
          fi
          node "${GITHUB_WORKSPACE}/.release-validation-tooling/scripts/openclaw-npm-extended-stable-release.mjs" verify-preflight-channel < "$manifest"
          immutable_sdk_evidence="${RUNNER_TEMP}/openclaw-plugin-sdk-api-evidence/plugin-sdk-api-release-evidence.json"
          if [[ ! -f "$immutable_sdk_evidence" ]]; then
            echo "Immutable Plugin SDK API evidence artifact is missing." >&2
            exit 1
          fi
          if ! cmp -s <(jq -S '.pluginSdkApi' "$manifest") <(jq -S '.' "$immutable_sdk_evidence"); then
            echo "Preflight manifest Plugin SDK API evidence does not match its immutable artifact." >&2
            exit 1
          fi
          current_selector_version="$(npm view "openclaw@${RELEASE_NPM_DIST_TAG}" version)"
          current_selector_ref="v${current_selector_version}"
          if ! git rev-parse --verify "${current_selector_ref}^{commit}" >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=10s 120s git fetch --no-tags origin \
              "refs/tags/${current_selector_ref}:refs/tags/${current_selector_ref}"
          fi
          current_selector_sha="$(git rev-parse "${current_selector_ref}^{commit}")"
          extended_stable_preflight=false
          expected_extended_stable_branch=""
          if [[ "$RELEASE_TAG" =~ ^v([0-9]{4})\.([1-9][0-9]*)\. ]]; then
            expected_extended_stable_branch="extended-stable/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.33"
          fi
          if [[ "$PREFLIGHT_WORKFLOW_PATH" == ".github/workflows/openclaw-npm-release.yml" && "$RELEASE_NPM_DIST_TAG" == "extended-stable" && "$PREFLIGHT_WORKFLOW_BRANCH" == "$expected_extended_stable_branch" && "$PREFLIGHT_WORKFLOW_SHA" == "$EXPECTED_SHA" ]]; then
            extended_stable_preflight=true
          fi
          if [[ "$extended_stable_preflight" != "true" ]] && ! git merge-base --is-ancestor "$PREFLIGHT_WORKFLOW_SHA" "$WORKFLOW_SHA"; then
            echo "OpenClaw npm preflight tooling is not on the trusted publish workflow lineage." >&2
            exit 1
          fi
          node "$PLUGIN_SDK_API_VALIDATOR" \
            --manifest "$manifest" \
            --npm-dist-tag "$RELEASE_NPM_DIST_TAG" \
            --head "$EXPECTED_SHA" \
            --acknowledge "$PLUGIN_SDK_API_ACKNOWLEDGEMENT" \
            --current-selector-ref "$current_selector_ref" \
            --current-selector-sha "$current_selector_sha" \
            --target-ref "$RELEASE_TAG" \
            --workflow-sha "$PREFLIGHT_WORKFLOW_SHA"
          if [[ -z "$tarball_name" || ! -f "${preflight_dir}/${tarball_name}" ]]; then
            echo "Preflight manifest tarball is missing: $tarball_name" >&2
            exit 1
          fi
          actual_tarball_sha256="$(sha256sum "${preflight_dir}/${tarball_name}" | awk '{print $1}')"
          if [[ "$actual_tarball_sha256" != "$tarball_sha256" ]]; then
            echo "Preflight manifest tarball digest mismatch." >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$tarball_sha256" >> "$GITHUB_OUTPUT"

      - name: Resolve focused release evidence run
        id: focused_run
        if: ${{ inputs.release_evidence_mode == 'authorized-beta-focused-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ inputs.focused_release_evidence_run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FOCUSED_RELEASE_EVIDENCE_RUN_ID}")"
          if ! jq -e \
            --arg run_id "${FOCUSED_RELEASE_EVIDENCE_RUN_ID}" \
            --arg attempt "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}" \
            '.id == ($run_id | tonumber) and .run_attempt == ($attempt | tonumber) and
             .name == "Authorized Beta Focused Validation" and
             .path == ".github/workflows/authorized-beta-focused-validation.yml" and
             .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' \
            <<<"${run_json}" >/dev/null; then
            echo "Focused evidence producer must be the exact successful authorized workflow run and attempt." >&2
            exit 1
          fi
          producer_ref="$(jq -r '.head_branch // empty' <<<"${run_json}")"
          producer_sha="$(jq -r '.head_sha // empty' <<<"${run_json}")"
          if [[ ! "${producer_ref}" =~ ^release-publish/([a-f0-9]{12})-[1-9][0-9]*$ ]]; then
            echo "Focused evidence producer must use a protected release-publish tag." >&2
            exit 1
          fi
          producer_prefix="${BASH_REMATCH[1]}"
          if [[ ! "${producer_sha}" =~ ^[a-f0-9]{40}$ || "${producer_sha:0:12}" != "${producer_prefix}" ]]; then
            echo "Focused evidence producer tag does not match its workflow SHA." >&2
            exit 1
          fi
          remote_producer_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${producer_ref}" \
              --jq '.object | select(.type == "commit") | .sha'
          )"
          if [[ "${remote_producer_sha}" != "${producer_sha}" ]]; then
            echo "Focused evidence producer tag is missing, moved, or annotated." >&2
            exit 1
          fi
          producer_workflow_path=".github/workflows/authorized-beta-focused-validation.yml"
          producer_policy_path="scripts/authorized-beta-focused-policy.json"
          for trusted_path in "${producer_workflow_path}" "${producer_policy_path}"; do
            producer_blob="$(git rev-parse "${producer_sha}:${trusted_path}")"
            consumer_blob="$(git rev-parse "${WORKFLOW_SHA}:${trusted_path}")"
            if [[ "${producer_blob}" != "${consumer_blob}" ]]; then
              echo "Focused evidence producer does not match the trusted ${trusted_path}." >&2
              exit 1
            fi
          done
          historical_tooling_sha="$(
            git show "${WORKFLOW_SHA}:${producer_policy_path}" |
              jq -er '.historicalToolingSha | select(type == "string" and test("^[a-f0-9]{40}$"))'
          )"
          if ! git merge-base --is-ancestor "${historical_tooling_sha}" "${producer_sha}"; then
            echo "Focused evidence producer is not descended from the fixed authorized tooling." >&2
            exit 1
          fi
          {
            echo "attempt=${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}"
            echo "workflow_full_ref=refs/tags/${producer_ref}"
            echo "workflow_sha=${producer_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Download focused release evidence
        if: ${{ inputs.release_evidence_mode == 'authorized-beta-focused-v1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: authorized-beta-focused-v1-${{ inputs.focused_release_evidence_run_id }}-${{ steps.focused_run.outputs.attempt }}
          path: ${{ runner.temp }}/authorized-beta-focused-evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.focused_release_evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Verify focused release evidence
        if: ${{ inputs.release_evidence_mode == 'authorized-beta-focused-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ steps.focused_run.outputs.attempt }}
          PRODUCER_WORKFLOW_FULL_REF: ${{ steps.focused_run.outputs.workflow_full_ref }}
          PRODUCER_WORKFLOW_SHA: ${{ steps.focused_run.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/authorized-beta-focused-evidence/evidence.json"
          gh attestation verify "${evidence}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/authorized-beta-focused-validation.yml" \
            --signer-digest "${PRODUCER_WORKFLOW_SHA}" \
            --source-digest "${PRODUCER_WORKFLOW_SHA}" \
            --source-ref "${PRODUCER_WORKFLOW_FULL_REF}" \
            --deny-self-hosted-runners
          tooling_dir="${GITHUB_WORKSPACE}/.release-validation-tooling/scripts"
          node "${tooling_dir}/verify-authorized-beta-focused-candidate.mjs" \
            --repository-root . \
            --validator "${tooling_dir}/validate-authorized-beta-focused-evidence.mts" \
            --policy "${tooling_dir}/authorized-beta-focused-policy.json" \
            --artifact "${evidence}" \
            --producer-run-id "${FOCUSED_RELEASE_EVIDENCE_RUN_ID}" \
            --producer-run-attempt "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}" \
            --producer-workflow-full-ref "${PRODUCER_WORKFLOW_FULL_REF}" \
            --producer-workflow-sha "${PRODUCER_WORKFLOW_SHA}"

      - name: Validate release tag is reachable from a trusted release branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            '+refs/heads/release/*:refs/remotes/origin/release/*' \
            '+refs/heads/extended-stable/*:refs/remotes/origin/extended-stable/*'
          if git merge-base --is-ancestor HEAD origin/main; then
            exit 0
          fi
          while IFS= read -r release_ref; do
            if git merge-base --is-ancestor HEAD "${release_ref}"; then
              exit 0
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/release)
          while IFS= read -r release_ref; do
            if git merge-base --is-ancestor HEAD "${release_ref}"; then
              exit 0
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/extended-stable)
          if [[ "${RELEASE_TAG}" == *"-alpha."* ]]; then
            if [[ ! "${WORKFLOW_REF_NAME}" =~ ^tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
              echo "Alpha publish tags must be dispatched from tideclaw/alpha/YYYY-MM-DD-HHMMZ." >&2
              exit 1
            fi
            git fetch --no-tags origin "+refs/heads/${WORKFLOW_REF_NAME}:refs/remotes/origin/${WORKFLOW_REF_NAME}"
            if git merge-base --is-ancestor HEAD "refs/remotes/origin/${WORKFLOW_REF_NAME}"; then
              exit 0
            fi
          fi
          echo "Release tag must point to a commit reachable from main, release/*, extended-stable/*, or the matching Tideclaw alpha branch for alpha prereleases." >&2
          exit 1

      - name: Summarize release target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ steps.manifest.outputs.sha || steps.ref.outputs.sha }}
          RELEASE_PROFILE: ${{ inputs.release_evidence_mode == 'authorized-beta-focused-v1' && 'beta' || (steps.full_manifest.outputs.release_profile || inputs.release_profile) }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
        run: |
          {
            echo "### Release target"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- SHA: \`${TARGET_SHA}\`"
            echo "- Release profile: \`${RELEASE_PROFILE}\`"
            if [[ -n "${FULL_RELEASE_VALIDATION_RUN_ID// }" ]]; then
              echo "- Full release validation: \`${FULL_RELEASE_VALIDATION_RUN_ID}\`"
            fi
            if [[ -n "${FOCUSED_RELEASE_EVIDENCE_RUN_ID// }" ]]; then
              echo "- Authorized focused validation: \`${FOCUSED_RELEASE_EVIDENCE_RUN_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  record_docker_only_scope:
    needs: resolve_release_target
    if: inputs.publish_docker_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record absence of ClawHub dispatch in Docker-only recovery
        env:
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/openclaw-release-children"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          env = os.environ
          record = {
              "schemaVersion": 1, "repository": env["GITHUB_REPOSITORY"],
              "parentRunId": env["GITHUB_RUN_ID"], "parentRunAttempt": env["GITHUB_RUN_ATTEMPT"],
              "parentWorkflow": ".github/workflows/openclaw-release-publish.yml",
              "toolingRef": env["GITHUB_REF_NAME"], "toolingFullRef": env["GITHUB_REF"],
              "toolingSha": env["GITHUB_WORKFLOW_SHA"], "candidateSha": env["TARGET_SHA"],
              "normalClawHubRunId": None, "normalClawHubRunAttempt": None,
          }
          (Path(env["RUNNER_TEMP"]) / "openclaw-release-children" / "dispatch.json").write_text(json.dumps(record) + "\n")
          PYTHON
      - name: Upload exact release child dispatch record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-release-children-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-release-children/dispatch.json
          if-no-files-found: error
          retention-days: 30

  qualify_android_native:
    name: Qualify native Android release source
    needs: [resolve_release_target]
    if: ${{ !inputs.publish_docker_only && inputs.publish_openclaw_npm && !contains(inputs.tag, '-alpha.') && !contains(inputs.tag, '-beta.') && needs.resolve_release_target.outputs.android_pin_matches == 'true' && needs.resolve_release_target.outputs.coverage_policy == 'npm-stable-v1' }}
    # Native failure blocks its approval receipt, while core publication proceeds.
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      qualified: ${{ steps.proof.outputs.qualified }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
      workflow_ref: ${{ steps.dispatch.outputs.workflow_ref }}
    steps:
      - name: Checkout trusted native qualification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-harness
          sparse-checkout: scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Android approval consumer capability
        working-directory: .release-harness
        env:
          EXPECTED_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        run: |
          set -euo pipefail
          # Frozen tags execute their own Android approval consumer. This gate
          # belongs to native qualification and must never block npm publication.
          git fetch --no-tags --depth=1 origin "${EXPECTED_SHA}"
          if ! git cat-file -e "${EXPECTED_SHA}:scripts/android-native-ci.mjs"; then
            echo "The frozen Android publisher cannot consume native-CI-bound approval. Use a compatible Android publication workflow for this source." >&2
            exit 1
          fi

      - name: Dispatch and await exact-source native CI
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FULL_REF: ${{ github.ref }}
          PARENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.release-harness/scripts/lib/release-publish-children.sh"
          CHILD_WORKFLOW_REF="$(resolve_child_workflow_ref "${WORKFLOW_FULL_REF}")"
          dispatch_id="release-native-android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_SHA}"
          run_id="$(dispatch_workflow ci.yml \
            -f target_ref="${TARGET_SHA}" \
            -f historical_target_tag="${RELEASE_TAG}" \
            -f include_android=true \
            -f release_scope=full \
            -f dispatch_id="${dispatch_id}")"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "workflow_ref=${CHILD_WORKFLOW_REF}" >> "${GITHUB_OUTPUT}"
          wait_for_run ci.yml "${run_id}" "${PARENT_WORKFLOW_SHA}" "" false

      - name: Verify exact native CI qualification
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CI_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          NATIVE_CI_WORKFLOW_REF: ${{ steps.dispatch.outputs.workflow_ref }}
          NATIVE_CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { verifyAndroidNativeCi } from './.release-harness/scripts/android-native-ci.mjs';
          const env = process.env;
          verifyAndroidNativeCi({
            version: 3, repository: env.GITHUB_REPOSITORY,
            parentRunId: env.GITHUB_RUN_ID, parentRunAttempt: Number(env.GITHUB_RUN_ATTEMPT),
            parentWorkflowSha: env.NATIVE_CI_WORKFLOW_SHA, targetSha: env.TARGET_SHA,
            nativeCi: { runId: env.NATIVE_CI_RUN_ID, runAttempt: 1, workflowRef: env.NATIVE_CI_WORKFLOW_REF },
          });
          NODE
          echo "qualified=true" >> "${GITHUB_OUTPUT}"

      - name: Record blocked native qualification
        if: ${{ failure() }}
        run: |
          echo "::warning::Android native qualification failed; no Android approval will be issued. Core publication remains independent."
          echo "- Android APK: blocked by native qualification; inspect this job and its linked CI run." >> "${GITHUB_STEP_SUMMARY}"

  publish_android:
    name: Approve and dispatch qualified Android
    needs: [resolve_release_target, publish, qualify_android_native]
    if: ${{ always() && !cancelled() && !inputs.publish_docker_only && inputs.publish_openclaw_npm && !contains(inputs.tag, '-alpha.') && !contains(inputs.tag, '-beta.') && needs.resolve_release_target.outputs.android_pin_matches == 'true' && needs.resolve_release_target.result == 'success' && needs.publish.result == 'success' && (needs.resolve_release_target.outputs.coverage_policy != 'npm-stable-v1' || needs.qualify_android_native.outputs.qualified == 'true') }}
    continue-on-error: true
    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Android approval tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-harness
          sparse-checkout: scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Write Android release approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COVERAGE_POLICY: ${{ needs.resolve_release_target.outputs.coverage_policy }}
          NATIVE_CI_RUN_ID: ${{ needs.qualify_android_native.outputs.run_id }}
          NATIVE_CI_WORKFLOW_REF: ${{ needs.qualify_android_native.outputs.workflow_ref }}
          RELEASE_PUBLISH_BRANCH: ${{ github.ref_name }}
          RELEASE_PUBLISH_FULL_REF: ${{ github.ref }}
          RELEASE_PUBLISH_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_PUBLISH_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        run: |
          set -euo pipefail
          approval_dir="${RUNNER_TEMP}/android-release-approval"
          mkdir -p "${approval_dir}"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { verifyAndroidNativeCi } from './.release-harness/scripts/android-native-ci.mjs';

          const nativeCi = process.env.RELEASE_COVERAGE_POLICY === "npm-stable-v1"
            ? { runId: process.env.NATIVE_CI_RUN_ID, runAttempt: 1, workflowRef: process.env.NATIVE_CI_WORKFLOW_REF }
            : undefined;
          const approval = {
            version: nativeCi ? 3 : 2,
            repository: process.env.GITHUB_REPOSITORY,
            workflow: "OpenClaw Release Publish",
            parentRunId: process.env.RELEASE_PUBLISH_RUN_ID,
            parentRunAttempt: Number(process.env.RELEASE_PUBLISH_RUN_ATTEMPT),
            workflowBranch: process.env.RELEASE_PUBLISH_BRANCH,
            workflowFullRef: process.env.RELEASE_PUBLISH_FULL_REF,
            parentWorkflowSha: process.env.RELEASE_PUBLISH_WORKFLOW_SHA,
            releaseTag: process.env.RELEASE_TAG,
            targetSha: process.env.TARGET_SHA,
            ...(nativeCi ? { nativeCi } : {}),
          };
          // Core publication may outlive the earlier native qualification.
          verifyAndroidNativeCi(approval);
          writeFileSync(
            join(process.env.RUNNER_TEMP, "android-release-approval", "approval.json"),
            `${JSON.stringify(approval, null, 2)}\n`,
          );
          NODE

      - name: Attest Android release approval
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/android-release-approval/approval.json

      - name: Upload Android release approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-approval-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release-approval/approval.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch qualified Android publication
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_WORKFLOW_BRANCH: ${{ github.ref_name }}
          PARENT_WORKFLOW_FULL_REF: ${{ github.ref }}
          PARENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        working-directory: .release-harness
        run: |
          set -euo pipefail
          source scripts/lib/release-publish-children.sh
          verify_release_tag_target
          promote_android_release_asset

      - name: Record blocked native publication
        if: ${{ failure() }}
        run: |
          echo "::warning::Android approval or dispatch failed; inspect the native publication job. Core publication remains independent."
          echo "- Android APK: approval or dispatch failed; inspect Android Release runs before retrying." >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish plugins, then OpenClaw
    needs: [resolve_release_target]
    if: ${{ !inputs.publish_docker_only }}
    env:
      # Artifact bytes may belong to an FRV child; the input run still authorizes npm dispatch.
      PREFLIGHT_ARTIFACT_RUN_ID: ${{ needs.resolve_release_target.outputs.preflight_artifact_run_id }}
      ANDROID_RELEASE_NOTE: ${{ needs.resolve_release_target.outputs.android_release_note }}
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm-release
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_release_target.outputs.sha }}
          fetch-depth: ${{ inputs.release_evidence_mode == 'authorized-beta-focused-v1' && 0 || 1 }}
          persist-credentials: false

      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-harness
          fetch-depth: 1
          persist-credentials: false

      - name: Download full release validation manifest
        if: ${{ inputs.publish_openclaw_npm && inputs.release_evidence_mode == 'full-release-validation' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-release-validation-${{ inputs.full_release_validation_run_id }}-${{ needs.resolve_release_target.outputs.full_release_validation_run_attempt }}
          path: ${{ runner.temp }}/full-release-validation-manifest
          repository: ${{ github.repository }}
          run-id: ${{ inputs.full_release_validation_run_id }}
          github-token: ${{ github.token }}

      - name: Download focused release evidence
        if: ${{ inputs.publish_openclaw_npm && inputs.release_evidence_mode == 'authorized-beta-focused-v1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: authorized-beta-focused-v1-${{ inputs.focused_release_evidence_run_id }}-${{ needs.resolve_release_target.outputs.focused_release_evidence_run_attempt }}
          path: ${{ runner.temp }}/authorized-beta-focused-evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.focused_release_evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Verify focused release evidence after approval
        if: ${{ inputs.publish_openclaw_npm && inputs.release_evidence_mode == 'authorized-beta-focused-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.focused_release_evidence_run_attempt }}
          PRODUCER_WORKFLOW_FULL_REF: ${{ needs.resolve_release_target.outputs.focused_release_evidence_workflow_full_ref }}
          PRODUCER_WORKFLOW_SHA: ${{ needs.resolve_release_target.outputs.focused_release_evidence_workflow_sha }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/authorized-beta-focused-evidence/evidence.json"
          gh attestation verify "${evidence}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/authorized-beta-focused-validation.yml" \
            --signer-digest "${PRODUCER_WORKFLOW_SHA}" \
            --source-digest "${PRODUCER_WORKFLOW_SHA}" \
            --source-ref "${PRODUCER_WORKFLOW_FULL_REF}" \
            --deny-self-hosted-runners
          node .release-harness/scripts/verify-authorized-beta-focused-candidate.mjs \
            --repository-root . \
            --validator .release-harness/scripts/validate-authorized-beta-focused-evidence.mts \
            --policy .release-harness/scripts/authorized-beta-focused-policy.json \
            --artifact "${evidence}" \
            --producer-run-id "${FOCUSED_RELEASE_EVIDENCE_RUN_ID}" \
            --producer-run-attempt "${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}" \
            --producer-workflow-full-ref "${PRODUCER_WORKFLOW_FULL_REF}" \
            --producer-workflow-sha "${PRODUCER_WORKFLOW_SHA}"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-deps: "false"
          install-bun: "false"

      - name: Install trusted release tooling dependencies
        env:
          CI: "true"
        run: |
          set -euo pipefail
          install_args=(
            install
            --frozen-lockfile
            --prefer-offline
            --config.engine-strict=false
            --config.enable-pre-post-scripts=true
            --config.side-effects-cache=true
          )
          # Corepack selects packageManager before pnpm processes its arguments.
          (cd .release-harness && { pnpm "${install_args[@]}" || pnpm "${install_args[@]}"; })
          # Node resolves --import tsx from the process cwd. Point that root at
          # the trusted harness install instead of the frozen target checkout.
          ln -s .release-harness/node_modules node_modules

      - name: Resolve ClawHub release plan
        id: clawhub_plan
        env:
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          PARENT_WORKFLOW_BRANCH: ${{ github.ref_name }}
          PARENT_WORKFLOW_FULL_REF: ${{ github.ref }}
          PARENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLUGIN_PUBLISH_SCOPE: ${{ inputs.plugin_publish_scope }}
          PLUGINS: ${{ inputs.plugins }}
          WORKFLOW_FULL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.release-harness/scripts/lib/release-publish-children.sh"

          # Regular publication binds every child to the exact parent revision.
          # Tideclaw retains its validated branch child and main bootstrap split.
          CHILD_WORKFLOW_REF="$(
            resolve_child_workflow_ref "${WORKFLOW_FULL_REF}"
          )"
          if [[ "${WORKFLOW_FULL_REF}" == refs/heads/tideclaw/alpha/* ]]; then
            BOOTSTRAP_WORKFLOW_REF="main"
            bootstrap_workflow_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha | select(test("^[a-f0-9]{40}$"))'
            )"
          else
            BOOTSTRAP_WORKFLOW_REF="${CHILD_WORKFLOW_REF}"
            bootstrap_workflow_sha="${GITHUB_SHA}"
          fi
          echo "child_workflow_ref=${CHILD_WORKFLOW_REF}" >> "${GITHUB_OUTPUT}"

          plan_path="${RUNNER_TEMP}/openclaw-release-clawhub-plan.json"
          plan_args=(
            --bootstrap-workflow-ref "${BOOTSTRAP_WORKFLOW_REF}"
            --bootstrap-workflow-sha "${bootstrap_workflow_sha}"
            --release-tag "${RELEASE_TAG}"
            --release-sha "${TARGET_SHA}"
            --release-publish-branch "${PARENT_WORKFLOW_BRANCH}"
            --release-publish-full-ref "${PARENT_WORKFLOW_FULL_REF}"
            --release-publish-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --release-publish-run-id "${GITHUB_RUN_ID}"
            --plugin-publish-scope "${PLUGIN_PUBLISH_SCOPE}"
          )
          if [[ -n "${PLUGINS// }" ]]; then
            plan_args+=(--plugins "${PLUGINS}")
          fi

          CLAWHUB_REGISTRY="${CLAWHUB_REGISTRY:-https://clawhub.ai}" \
            node --import tsx \
              "${GITHUB_WORKSPACE}/.release-harness/scripts/openclaw-release-clawhub-plan.ts" \
              "${plan_args[@]}" > "${plan_path}"
          cat "${plan_path}"
          jq -r '.warnings[]? | "- Warning: \(.)"' "${plan_path}" >> "$GITHUB_STEP_SUMMARY"

          bootstrap_should_dispatch="$(
            jq -er '.bootstrap.shouldDispatch | select(type == "boolean") | tostring' "${plan_path}"
          )"
          echo "bootstrap_should_dispatch=${bootstrap_should_dispatch}" >> "${GITHUB_OUTPUT}"
          if [[ "${bootstrap_should_dispatch}" != "true" ]]; then
            exit 0
          fi

          jq -e \
            --arg bootstrap_ref "${BOOTSTRAP_WORKFLOW_REF}" \
            --arg branch "${PARENT_WORKFLOW_BRANCH}" \
            --arg bootstrap_workflow_sha "${bootstrap_workflow_sha}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${TARGET_SHA}" \
            '.bootstrapWorkflowSha == $bootstrap_workflow_sha and
             .bootstrap.ref == $bootstrap_ref and
             .bootstrap.inputs.ref == $target and
             .bootstrap.inputs.bootstrap_workflow_sha == $bootstrap_workflow_sha and
             .bootstrap.inputs.release_tag == $tag and
             .bootstrap.inputs.release_publish_branch == $branch and
             .bootstrap.inputs.release_publish_run_attempt == $attempt and
             .bootstrap.inputs.release_publish_run_id == $run_id' \
            "${plan_path}" >/dev/null

          approval_dir="${RUNNER_TEMP}/clawhub-bootstrap-approval"
          mkdir -p "${approval_dir}"
          PLAN_PATH="${plan_path}" APPROVAL_PATH="${approval_dir}/approval.json" \
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const plan = JSON.parse(readFileSync(process.env.PLAN_PATH, "utf8"));
          const packages = [...plan.bootstrap.packages].toSorted((a, b) =>
            a < b ? -1 : a > b ? 1 : 0,
          );
          const approval = {
            version: 2,
            kind: "clawhub-bootstrap",
            repository: process.env.GITHUB_REPOSITORY,
            workflow: "OpenClaw Release Publish",
            parentRunId: process.env.GITHUB_RUN_ID,
            parentRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowBranch: process.env.PARENT_WORKFLOW_BRANCH,
            parentWorkflowSha: process.env.GITHUB_SHA,
            bootstrapWorkflowSha: plan.bootstrapWorkflowSha,
            releaseTag: process.env.RELEASE_TAG,
            targetSha: process.env.TARGET_SHA,
            packages,
          };
          writeFileSync(process.env.APPROVAL_PATH, `${JSON.stringify(approval, null, 2)}\n`);
          NODE

      - name: Attest ClawHub bootstrap approval
        if: ${{ steps.clawhub_plan.outputs.bootstrap_should_dispatch == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/clawhub-bootstrap-approval/approval.json

      - name: Upload ClawHub bootstrap approval
        if: ${{ steps.clawhub_plan.outputs.bootstrap_should_dispatch == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clawhub-bootstrap-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clawhub-bootstrap-approval/approval.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub release notes
        if: ${{ inputs.publish_openclaw_npm }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
        run: |
          # Fail-before-mutation gate: prove the canonical release body renders
          # within GitHub's limits before any publish-side dispatch runs. The
          # publish sequence re-renders the same body from the same tag SHA.
          changelog_file="${RUNNER_TEMP}/CHANGELOG.md"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          git show "${TARGET_SHA}:CHANGELOG.md" > "${changelog_file}"
          node --import tsx scripts/render-github-release-notes.mts \
            --changelog "${changelog_file}" \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output "${notes_file}"

      - name: Dispatch publish workflows
        id: children
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
          CHILD_WORKFLOW_REF: ${{ steps.clawhub_plan.outputs.child_workflow_ref }}
          PARENT_WORKFLOW_SHA: ${{ github.sha }}
          PARENT_WORKFLOW_BRANCH: ${{ github.ref_name }}
          PARENT_WORKFLOW_FULL_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.full_release_validation_run_attempt }}
          RELEASE_EVIDENCE_MODE: ${{ inputs.release_evidence_mode }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.focused_release_evidence_run_attempt }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          PLUGIN_SDK_API_ACKNOWLEDGEMENT: ${{ inputs.plugin_sdk_api_acknowledgement }}
          PLUGIN_PUBLISH_SCOPE: ${{ inputs.plugin_publish_scope }}
          PLUGINS: ${{ inputs.plugins }}
          PUBLISH_OPENCLAW_NPM: ${{ inputs.publish_openclaw_npm && 'true' || 'false' }}
          WAIT_FOR_CLAWHUB: ${{ inputs.wait_for_clawhub && 'true' || 'false' }}
          PREFLIGHT_ARTIFACT_NAME: ${{ needs.resolve_release_target.outputs.preflight_artifact_name }}
          NPM_TELEGRAM_RUN_ID: ${{ inputs.npm_telegram_run_id }}
          OPENCLAW_NPM_RESUME_RUN_ID: ${{ inputs.openclaw_npm_resume_run_id }}
          POSTPUBLISH_EVIDENCE_DIR: ${{ runner.temp }}/openclaw-release-postpublish-evidence
          FULL_RELEASE_VALIDATION_MANIFEST_DIR: ${{ runner.temp }}/full-release-validation-manifest
          FOCUSED_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/authorized-beta-focused-evidence
          CLAWHUB_PLAN_PATH: ${{ runner.temp }}/openclaw-release-clawhub-plan.json
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.release-harness/scripts/lib/release-publish-children.sh"
          bootstrap_summary_ref="$(jq -er '.bootstrap.ref | select(type == "string" and length > 0)' "${CLAWHUB_PLAN_PATH}")"
          bootstrap_summary_sha="$(jq -er '.bootstrapWorkflowSha | select(test("^[a-f0-9]{40}$"))' "${CLAWHUB_PLAN_PATH}")"
          {
            echo "### Publish sequence"
            echo
            echo "- Workflow ref: \`${CHILD_WORKFLOW_REF}\`"
            echo "- Normal ClawHub workflow ref: release tag \`${RELEASE_TAG}\`"
            echo "- ClawHub bootstrap workflow ref: \`${bootstrap_summary_ref}\` at \`${bootstrap_summary_sha}\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Release SHA: \`${TARGET_SHA}\`"
            echo "- Release approval: this workflow job"
            echo "- Plugin npm and ClawHub publish: dispatched in parallel"
            if [[ "${PUBLISH_OPENCLAW_NPM}" == "true" ]]; then
              echo "- OpenClaw npm publish: starts after plugin npm succeeds"
            else
              echo "- OpenClaw npm publish: skipped by input"
            fi
            if is_android_release && [[ "${PUBLISH_OPENCLAW_NPM}" == "true" ]]; then
              echo "${ANDROID_RELEASE_NOTE:-- Android APK: a separate native job qualifies the source before approval and dispatch; core publication does not wait for native qualification}"
            fi
            if is_stable_release && [[ "${PUBLISH_OPENCLAW_NPM}" == "true" ]]; then
              echo "- Windows Hub promotion: optional detached child after GitHub publication"
            fi
            if [[ "${WAIT_FOR_CLAWHUB}" == "true" ]]; then
              echo "- Workflow completion waits for ClawHub"
            else
              echo "- Workflow does not wait for ClawHub; monitor its run separately"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          prepared_release_notes_file="${RUNNER_TEMP}/release-notes-prepublish.md"
          prepared_release_notes_metadata_file="${RUNNER_TEMP}/release-notes-prepublish.json"
          verify_release_tag_target
          if [[ "${PUBLISH_OPENCLAW_NPM}" == "true" ]]; then
            render_github_release_notes \
              "${prepared_release_notes_file}" \
              "" \
              "${prepared_release_notes_metadata_file}"
            guard_existing_public_release
          fi
          resolve_openclaw_npm_publish_state
          resolve_clawhub_release_plan

          bootstrap_workflow_sha=""
          if [[ "$(jq -r '.bootstrap.shouldDispatch' "${clawhub_plan_path}")" == "true" ]]; then
            bootstrap_workflow_sha="$(verify_bootstrap_workflow_sha)"
          fi

          npm_args=(-f publish_scope="${PLUGIN_PUBLISH_SCOPE}" -f ref="${TARGET_SHA}" -f release_publish_run_id="${GITHUB_RUN_ID}" -f release_publish_run_attempt="${GITHUB_RUN_ATTEMPT}" -f release_publish_branch="${PARENT_WORKFLOW_BRANCH}" -f release_publish_full_ref="${PARENT_WORKFLOW_FULL_REF}")
          if [[ -n "${PLUGINS}" ]]; then
            npm_args+=(-f plugins="${PLUGINS}")
          fi

          plugin_npm_run_id="$(dispatch_workflow plugin-npm-release.yml "${npm_args[@]}")"
          plugin_clawhub_run_id=""
          if [[ "$(jq -r '.normal.shouldDispatch' "${clawhub_plan_path}")" == "true" ]]; then
            clawhub_dispatch_args=()
            append_clawhub_dispatch_args normal
            plugin_clawhub_run_id="$(dispatch_workflow_at_ref \
              "$(jq -r '.normal.ref' "${clawhub_plan_path}")" \
              "${PARENT_WORKFLOW_SHA}" \
              "$(jq -r '.normal.workflow' "${clawhub_plan_path}")" \
              "${clawhub_dispatch_args[@]}")"
          else
            echo "- plugin-clawhub-release.yml: no normal OIDC candidates" >> "$GITHUB_STEP_SUMMARY"
          fi
          plugin_clawhub_bootstrap_run_id=""
          if [[ "$(jq -r '.bootstrap.shouldDispatch' "${clawhub_plan_path}")" == "true" ]]; then
            clawhub_dispatch_args=()
            append_clawhub_dispatch_args bootstrap
            plugin_clawhub_bootstrap_run_id="$(dispatch_workflow_at_ref \
              "$(jq -r '.bootstrap.ref' "${clawhub_plan_path}")" \
              "${bootstrap_workflow_sha}" \
              "$(jq -r '.bootstrap.workflow' "${clawhub_plan_path}")" \
              "${clawhub_dispatch_args[@]}")"
          else
            echo "- plugin-clawhub-new.yml: no bootstrap candidates" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "- Plugin npm run ID: \`${plugin_npm_run_id}\`"
            echo "- Plugin ClawHub run ID: \`${plugin_clawhub_run_id:-none}\`"
            echo "- Plugin ClawHub bootstrap run ID: \`${plugin_clawhub_bootstrap_run_id:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "plugin_npm_run_id=${plugin_npm_run_id}"
            echo "plugin_clawhub_run_id=${plugin_clawhub_run_id}"
            echo "plugin_clawhub_bootstrap_run_id=${plugin_clawhub_bootstrap_run_id}"
            echo "bootstrap_workflow_sha=${bootstrap_workflow_sha}"
            echo "openclaw_npm_already_published=${openclaw_npm_already_published}"
            echo "openclaw_npm_expected_workflow_ref=${openclaw_npm_expected_workflow_ref}"
            echo "openclaw_npm_expected_workflow_sha=${openclaw_npm_expected_workflow_sha}"
          } >> "$GITHUB_OUTPUT"
          NORMAL_CLAWHUB_RUN_ID="$plugin_clawhub_run_id" node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const env = process.env;
          const dir = join(env.RUNNER_TEMP, 'openclaw-release-children');
          mkdirSync(dir);
          writeFileSync(join(dir, 'dispatch.json'), JSON.stringify({
            schemaVersion: 1, repository: env.GITHUB_REPOSITORY,
            parentRunId: env.GITHUB_RUN_ID, parentRunAttempt: env.GITHUB_RUN_ATTEMPT,
            parentWorkflow: '.github/workflows/openclaw-release-publish.yml',
            toolingRef: env.GITHUB_REF_NAME, toolingFullRef: env.GITHUB_REF,
            toolingSha: env.GITHUB_WORKFLOW_SHA, candidateSha: env.TARGET_SHA,
            normalClawHubRunId: env.NORMAL_CLAWHUB_RUN_ID || null,
            normalClawHubRunAttempt: env.NORMAL_CLAWHUB_RUN_ID ? '1' : null,
          }) + '\n', { flag: 'wx' });
          NODE

      - name: Upload exact release child dispatch record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-release-children-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-release-children/dispatch.json
          if-no-files-found: error
          retention-days: 30

      - name: Start core npm publication
        id: core_start
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
          CHILD_WORKFLOW_REF: ${{ steps.clawhub_plan.outputs.child_workflow_ref }}
          PARENT_WORKFLOW_SHA: ${{ github.sha }}
          PARENT_WORKFLOW_BRANCH: ${{ github.ref_name }}
          PARENT_WORKFLOW_FULL_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.full_release_validation_run_attempt }}
          RELEASE_EVIDENCE_MODE: ${{ inputs.release_evidence_mode }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.focused_release_evidence_run_attempt }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          PLUGIN_SDK_API_ACKNOWLEDGEMENT: ${{ inputs.plugin_sdk_api_acknowledgement }}
          PUBLISH_OPENCLAW_NPM: ${{ inputs.publish_openclaw_npm && 'true' || 'false' }}
          CHILD_PLUGIN_NPM_RUN_ID: ${{ steps.children.outputs.plugin_npm_run_id }}
          CHILD_PLUGIN_CLAWHUB_RUN_ID: ${{ steps.children.outputs.plugin_clawhub_run_id }}
          CHILD_PLUGIN_CLAWHUB_BOOTSTRAP_RUN_ID: ${{ steps.children.outputs.plugin_clawhub_bootstrap_run_id }}
          CHILD_OPENCLAW_NPM_ALREADY_PUBLISHED: ${{ steps.children.outputs.openclaw_npm_already_published }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.release-harness/scripts/lib/release-publish-children.sh"
          plugin_npm_run_id="${CHILD_PLUGIN_NPM_RUN_ID}"
          verify_release_tag_target
          if ! wait_for_run plugin-npm-release.yml "${plugin_npm_run_id}" "${PARENT_WORKFLOW_SHA}"; then
            echo "Plugin npm publish failed; cancelling dispatched ClawHub child workflows." >&2
            for child_run_id in "${CHILD_PLUGIN_CLAWHUB_RUN_ID}" "${CHILD_PLUGIN_CLAWHUB_BOOTSTRAP_RUN_ID}"; do
              if [[ -n "${child_run_id}" ]]; then
                gh run cancel --repo "$GITHUB_REPOSITORY" "${child_run_id}" >/dev/null 2>&1 || true
              fi
            done
            exit 1
          fi
          echo "plugin_npm_completed=true" >> "$GITHUB_OUTPUT"

          if [[ "${PUBLISH_OPENCLAW_NPM}" != "true" ]]; then
            echo "- OpenClaw npm publish: skipped by input" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          prepared_release_notes_file="${RUNNER_TEMP}/release-notes-prepublish.md"
          create_or_update_github_release
          if [[ "${CHILD_OPENCLAW_NPM_ALREADY_PUBLISHED}" == "true" ]]; then
            echo "- OpenClaw npm publish: already on npm; resuming postpublish stages" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          evidence_args=(-f release_evidence_mode="${RELEASE_EVIDENCE_MODE}")
          if [[ "${RELEASE_EVIDENCE_MODE}" == "authorized-beta-focused-v1" ]]; then
            evidence_args+=(
              -f focused_release_evidence_run_id="${FOCUSED_RELEASE_EVIDENCE_RUN_ID}"
              -f focused_release_evidence_run_attempt="${FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT}"
            )
          else
            evidence_args+=(
              -f full_release_validation_run_id="${FULL_RELEASE_VALIDATION_RUN_ID}"
              -f full_release_validation_run_attempt="${FULL_RELEASE_VALIDATION_RUN_ATTEMPT}"
            )
          fi
          openclaw_npm_run_id="$(dispatch_workflow openclaw-npm-release.yml \
            -f tag="${RELEASE_TAG}" \
            -f preflight_only=false \
            -f preflight_run_id="${PREFLIGHT_RUN_ID}" \
            -f release_publish_run_id="${GITHUB_RUN_ID}" \
            -f release_publish_run_attempt="${GITHUB_RUN_ATTEMPT}" \
            -f release_publish_branch="${PARENT_WORKFLOW_BRANCH}" \
            -f release_publish_full_ref="${PARENT_WORKFLOW_FULL_REF}" \
            -f plugin_sdk_api_acknowledgement="${PLUGIN_SDK_API_ACKNOWLEDGEMENT}" \
            -f npm_dist_tag="${RELEASE_NPM_DIST_TAG}" \
            "${evidence_args[@]}")"
          echo "openclaw_npm_run_id=${openclaw_npm_run_id}" >> "$GITHUB_OUTPUT"
          echo "- OpenClaw npm run ID: \`${openclaw_npm_run_id}\`" >> "$GITHUB_STEP_SUMMARY"
          # Pass the child environment gate before waiting for ClawHub receipts;
          # the remote publisher can advance without a cross-step watcher.
          if ! wait_for_run openclaw-npm-release.yml "${openclaw_npm_run_id}" "${PARENT_WORKFLOW_SHA}" publish_openclaw_npm true npm-release; then
            gh run cancel --repo "$GITHUB_REPOSITORY" "${openclaw_npm_run_id}" >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Authorize exact ClawHub package transactions
        id: clawhub_authorization
        if: steps.children.outputs.plugin_clawhub_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          WAIT_FOR_CLAWHUB: ${{ inputs.wait_for_clawhub && 'true' || 'false' }}
        run: |
          node .release-harness/scripts/clawhub-parent-authorization.mjs authorize \
            --child-run '${{ steps.children.outputs.plugin_clawhub_run_id }}' \
            --plan "$RUNNER_TEMP/openclaw-release-clawhub-plan.json" \
            --output "$RUNNER_TEMP/clawhub-parent-authorization/authorization.json"

      - name: Upload immutable ClawHub parent authorization
        id: clawhub_receipt
        if: steps.children.outputs.plugin_clawhub_run_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.clawhub_authorization.outputs.artifact_name }}
          path: ${{ runner.temp }}/clawhub-parent-authorization/authorization.json
          if-no-files-found: error
          retention-days: 30

      - name: Complete publish workflows
        if: ${{ always() && !cancelled() && steps.core_start.outputs.plugin_npm_completed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
          CHILD_WORKFLOW_REF: ${{ steps.clawhub_plan.outputs.child_workflow_ref }}
          PARENT_WORKFLOW_SHA: ${{ github.sha }}
          PARENT_WORKFLOW_BRANCH: ${{ github.ref_name }}
          PARENT_WORKFLOW_FULL_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ID: ${{ inputs.full_release_validation_run_id }}
          FULL_RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.full_release_validation_run_attempt }}
          RELEASE_EVIDENCE_MODE: ${{ inputs.release_evidence_mode }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.focused_release_evidence_run_id }}
          FOCUSED_RELEASE_EVIDENCE_RUN_ATTEMPT: ${{ needs.resolve_release_target.outputs.focused_release_evidence_run_attempt }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          PLUGIN_SDK_API_ACKNOWLEDGEMENT: ${{ inputs.plugin_sdk_api_acknowledgement }}
          PLUGIN_PUBLISH_SCOPE: ${{ inputs.plugin_publish_scope }}
          PLUGINS: ${{ inputs.plugins }}
          PUBLISH_OPENCLAW_NPM: ${{ inputs.publish_openclaw_npm && 'true' || 'false' }}
          WAIT_FOR_CLAWHUB: ${{ inputs.wait_for_clawhub && 'true' || 'false' }}
          PREFLIGHT_ARTIFACT_NAME: ${{ needs.resolve_release_target.outputs.preflight_artifact_name }}
          NPM_TELEGRAM_RUN_ID: ${{ inputs.npm_telegram_run_id }}
          OPENCLAW_NPM_RESUME_RUN_ID: ${{ inputs.openclaw_npm_resume_run_id }}
          POSTPUBLISH_EVIDENCE_DIR: ${{ runner.temp }}/openclaw-release-postpublish-evidence
          FULL_RELEASE_VALIDATION_MANIFEST_DIR: ${{ runner.temp }}/full-release-validation-manifest
          FOCUSED_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/authorized-beta-focused-evidence
          CLAWHUB_PLAN_PATH: ${{ runner.temp }}/openclaw-release-clawhub-plan.json
          CHILD_PLUGIN_NPM_RUN_ID: ${{ steps.children.outputs.plugin_npm_run_id }}
          CHILD_PLUGIN_CLAWHUB_RUN_ID: ${{ steps.children.outputs.plugin_clawhub_run_id }}
          CHILD_PLUGIN_CLAWHUB_BOOTSTRAP_RUN_ID: ${{ steps.children.outputs.plugin_clawhub_bootstrap_run_id }}
          CHILD_BOOTSTRAP_WORKFLOW_SHA: ${{ steps.children.outputs.bootstrap_workflow_sha }}
          CHILD_OPENCLAW_NPM_ALREADY_PUBLISHED: ${{ steps.children.outputs.openclaw_npm_already_published }}
          CHILD_OPENCLAW_NPM_EXPECTED_WORKFLOW_REF: ${{ steps.children.outputs.openclaw_npm_expected_workflow_ref }}
          CHILD_OPENCLAW_NPM_EXPECTED_WORKFLOW_SHA: ${{ steps.children.outputs.openclaw_npm_expected_workflow_sha }}
          CHILD_OPENCLAW_NPM_RUN_ID: ${{ steps.core_start.outputs.openclaw_npm_run_id }}
          CORE_START_OUTCOME: ${{ steps.core_start.outcome }}
          CLAWHUB_AUTHORIZATION_OUTCOME: ${{ steps.clawhub_authorization.outcome }}
          CLAWHUB_RECEIPT_OUTCOME: ${{ steps.clawhub_receipt.outcome }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.release-harness/scripts/lib/release-publish-children.sh"
          plugin_npm_run_id="${CHILD_PLUGIN_NPM_RUN_ID}"
          plugin_clawhub_run_id="${CHILD_PLUGIN_CLAWHUB_RUN_ID}"
          plugin_clawhub_bootstrap_run_id="${CHILD_PLUGIN_CLAWHUB_BOOTSTRAP_RUN_ID}"
          bootstrap_workflow_sha="${CHILD_BOOTSTRAP_WORKFLOW_SHA}"
          openclaw_npm_already_published="${CHILD_OPENCLAW_NPM_ALREADY_PUBLISHED}"
          openclaw_npm_expected_workflow_ref="${CHILD_OPENCLAW_NPM_EXPECTED_WORKFLOW_REF}"
          openclaw_npm_expected_workflow_sha="${CHILD_OPENCLAW_NPM_EXPECTED_WORKFLOW_SHA}"
          openclaw_npm_run_id="${CHILD_OPENCLAW_NPM_RUN_ID}"
          plugin_clawhub_bootstrap_completed="false"
          resolve_clawhub_release_plan
          failed=0
          clawhub_failed=0
          clawhub_authorized=true
          release_target_current=true
          if ! (verify_release_tag_target); then
            failed=1
            release_target_current=false
          fi
          if [[ "${CORE_START_OUTCOME}" != "success" ]]; then
            failed=1
          fi
          if [[ -n "${plugin_clawhub_run_id}" && ( "${CLAWHUB_AUTHORIZATION_OUTCOME}" != "success" || "${CLAWHUB_RECEIPT_OUTCOME}" != "success" ) ]]; then
            failed=1
            clawhub_failed=1
            clawhub_authorized=false
            echo "ClawHub authorization did not complete; collecting the already-started core publication." >&2
          fi

          clawhub_result=""
          clawhub_pid=""
          clawhub_bootstrap_result=""
          clawhub_bootstrap_pid=""
          approve_clawhub=true
          if [[ "${failed}" != "0" ]]; then
            approve_clawhub=false
            for child_run_id in "${plugin_clawhub_run_id}" "${plugin_clawhub_bootstrap_run_id}"; do
              if [[ -n "${child_run_id}" ]]; then
                gh run cancel --repo "$GITHUB_REPOSITORY" "${child_run_id}" >/dev/null 2>&1 || true
                clawhub_failed=1
              fi
            done
          fi
          if [[ "${WAIT_FOR_CLAWHUB}" == "true" ]]; then
            if [[ -n "${plugin_clawhub_run_id}" ]]; then
              clawhub_result="$RUNNER_TEMP/clawhub-result.txt"
              wait_run_pid=""
              wait_for_run_background plugin-clawhub-release.yml "${plugin_clawhub_run_id}" "${PARENT_WORKFLOW_SHA}" "${clawhub_result}" "${approve_clawhub}"
              clawhub_pid="${wait_run_pid}"
            fi
            if [[ -n "${plugin_clawhub_bootstrap_run_id}" ]]; then
              clawhub_bootstrap_result="$RUNNER_TEMP/clawhub-bootstrap-result.txt"
              wait_run_pid=""
              wait_for_run_background plugin-clawhub-new.yml "${plugin_clawhub_bootstrap_run_id}" "${bootstrap_workflow_sha}" "${clawhub_bootstrap_result}" "${approve_clawhub}"
              clawhub_bootstrap_pid="${wait_run_pid}"
            fi
          elif [[ "${failed}" == "0" ]]; then
            # Detached mode deliberately leaves protected ClawHub approvals to
            # the operator monitoring the linked child runs. Polling for those
            # gates here would put plugin fan-out back on the core release path.
            if [[ -n "${plugin_clawhub_run_id}" ]]; then
              echo "- plugin-clawhub-release.yml: detached; approval and publish not awaited (${plugin_clawhub_run_id})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- plugin-clawhub-release.yml: no normal OIDC publish to await" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ -n "${plugin_clawhub_bootstrap_run_id}" ]]; then
              echo "- plugin-clawhub-new.yml: detached; approvals and bootstrap not awaited (${plugin_clawhub_bootstrap_run_id})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- plugin-clawhub-new.yml: no bootstrap publish to await" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          openclaw_result=""
          openclaw_pid=""
          if [[ -n "${openclaw_npm_run_id}" ]]; then
            openclaw_result="$RUNNER_TEMP/openclaw-npm-result.txt"
            wait_run_pid=""
            # The start step owns approval. Collection must never retry a
            # failed or ambiguous approval mutation after another step failed.
            wait_for_run_background openclaw-npm-release.yml "${openclaw_npm_run_id}" "${PARENT_WORKFLOW_SHA}" "${openclaw_result}" false
            openclaw_pid="${wait_run_pid}"
          fi

          # Native qualification and APK dispatch belong to separate jobs.
          android_release_note="${ANDROID_RELEASE_NOTE:-}"
          if is_android_release && [[ -z "${android_release_note}" ]]; then
            android_release_note="- Android APK: monitor the native qualification and publication jobs at https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          openclaw_failed=0
          if [[ -n "${openclaw_pid}" ]] && { ! wait "${openclaw_pid}" || [[ ! -f "${openclaw_result}" || "$(cat "${openclaw_result}")" != "success" ]]; }; then
            failed=1
            openclaw_failed=1
          fi

          if [[ -n "${clawhub_pid}" ]] && { ! wait "${clawhub_pid}" || [[ ! -f "${clawhub_result}" || "$(cat "${clawhub_result}")" != "success" ]]; }; then
            failed=1
            clawhub_failed=1
          fi
          if [[ -n "${clawhub_bootstrap_pid}" ]]; then
            if wait "${clawhub_bootstrap_pid}" && [[ -f "${clawhub_bootstrap_result}" && "$(cat "${clawhub_bootstrap_result}")" == "success" ]]; then
              plugin_clawhub_bootstrap_completed=true
            else
              failed=1
              clawhub_failed=1
            fi
          fi

          if [[ "${release_target_current}" == "true" && ( ( -n "${openclaw_npm_run_id}" && "${openclaw_failed}" == "0" ) || "${openclaw_npm_already_published}" == "true" ) ]]; then
            verify_published_release
            upload_dependency_evidence_release_asset
            upload_release_evidence_assets
            append_release_proof_to_github_release
            if [[ "${failed}" == "0" ]]; then
              echo "- GitHub release: kept draft until required publication checks complete" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- GitHub release: left as draft because a required publish child failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

      - name: Upload postpublish evidence
        if: ${{ always() && inputs.publish_openclaw_npm }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-release-postpublish-evidence-${{ inputs.tag }}
          path: ${{ runner.temp }}/openclaw-release-postpublish-evidence
          if-no-files-found: error

  verify_core_npm_registry:
    name: Verify already-published core npm package
    needs: [resolve_release_target]
    if: ${{ inputs.publish_docker_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify exact npm and selector readback matches preflight bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          EXPECTED_TARBALL_SHA256: ${{ needs.resolve_release_target.outputs.preflight_tarball_sha256 }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          exact_version="$(npm view "openclaw@${version}" version)"
          selector_version="$(npm view "openclaw@${RELEASE_NPM_DIST_TAG}" version)"
          if [[ "${exact_version}" != "${version}" || "${selector_version}" != "${version}" ]]; then
            echo "npm exact-version or ${RELEASE_NPM_DIST_TAG} selector readback does not match ${version}." >&2
            exit 1
          fi
          tarball_url="$(npm view "openclaw@${version}" dist.tarball)"
          tarball_path="${RUNNER_TEMP}/openclaw-${version}.tgz"
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 --retry-max-time 180 \
            -o "${tarball_path}" "${tarball_url}"
          actual_tarball_sha256="$(sha256sum "${tarball_path}" | awk '{print $1}')"
          if [[ -z "${EXPECTED_TARBALL_SHA256}" || "${actual_tarball_sha256}" != "${EXPECTED_TARBALL_SHA256}" ]]; then
            echo "Published npm tarball does not match the release preflight artifact." >&2
            exit 1
          fi

  publish_docker:
    name: Publish Docker images
    needs: [resolve_release_target, publish, verify_core_npm_registry]
    if: ${{ always() && !contains(inputs.tag, '-alpha.') && ((inputs.publish_openclaw_npm && needs.publish.result == 'success') || (inputs.publish_docker_only && needs.verify_core_npm_registry.result == 'success')) }}
    uses: ./.github/workflows/docker-release.yml
    with:
      tag: ${{ inputs.tag }}
      release_sha: ${{ needs.resolve_release_target.outputs.sha }}
      prepared_run_id: ${{ needs.resolve_release_target.outputs.prepared_docker_run_id }}
      prepared_run_attempt: ${{ needs.resolve_release_target.outputs.prepared_docker_run_attempt }}
      prepared_artifact_name: ${{ needs.resolve_release_target.outputs.prepared_docker_artifact_name }}
      prepared_manifest_sha256: ${{ needs.resolve_release_target.outputs.prepared_docker_manifest_sha256 }}
      focused_release_evidence_run_id: ${{ inputs.release_evidence_mode == 'authorized-beta-focused-v1' && inputs.focused_release_evidence_run_id || '' }}
      focused_release_evidence_run_attempt: ${{ needs.resolve_release_target.outputs.focused_release_evidence_run_attempt }}
      focused_release_evidence_workflow_full_ref: ${{ needs.resolve_release_target.outputs.focused_release_evidence_workflow_full_ref }}
      focused_release_evidence_workflow_sha: ${{ needs.resolve_release_target.outputs.focused_release_evidence_workflow_sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write

  publish_vcr:
    name: Mirror Docker images to Vercel Container Registry
    needs: [publish_docker]
    if: ${{ always() && needs.publish_docker.result == 'success' }}
    uses: ./.github/workflows/vercel-container-registry-publish.yml
    with:
      advisory: true
      include_browser: ${{ needs.publish_docker.outputs.include_browser == 'true' }}
      source_digests: ${{ needs.publish_docker.outputs.vcr_source_digests }}
      version: ${{ needs.publish_docker.outputs.version }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    permissions:
      contents: read

  finalize_github_release:
    name: Finalize GitHub release
    # Apps attach independently after npm and Gateway Docker evidence is complete.
    needs: [publish, publish_docker]
    if: ${{ always() && inputs.publish_openclaw_npm && needs.publish.result == 'success' && (needs.publish_docker.result == 'success' || (contains(inputs.tag, '-alpha.') && needs.publish_docker.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_prerelease=false
          if [[ "${RELEASE_TAG}" == *"-alpha."* || "${RELEASE_TAG}" == *"-beta."* ]]; then
            expected_prerelease=true
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          release_json="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease)"
          if [[ "$(printf '%s' "${release_json}" | jq -r '.isDraft')" != "false" ]] || \
            [[ "$(printf '%s' "${release_json}" | jq -r '.isPrerelease')" != "${expected_prerelease}" ]]; then
            echo "Published GitHub release state does not match the requested draft/prerelease classification." >&2
            exit 1
          fi

  publish_windows:
    name: Dispatch Windows assets after publication
    needs: [resolve_release_target, finalize_github_release]
    if: ${{ !cancelled() && needs.finalize_github_release.result == 'success' && (inputs.windows_node_tag != '' || inputs.windows_node_installer_digests != '') && !contains(inputs.tag, '-alpha.') && !contains(inputs.tag, '-beta.') }}
    # App failures are reported by their own workflow; neither npm nor the
    # published GitHub release depends on native asset availability.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted Windows dispatch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch detached Windows promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.sha }}
          WINDOWS_NODE_TAG: ${{ inputs.windows_node_tag }}
          WINDOWS_NODE_INSTALLER_DIGESTS: ${{ inputs.windows_node_installer_digests }}
        run: |
          set -euo pipefail
          source scripts/lib/release-publish-children.sh
          jq -n --arg tag "$RELEASE_TAG" --arg source "$WINDOWS_NODE_TAG" \
            --arg digests "$WINDOWS_NODE_INSTALLER_DIGESTS" \
            '{tag: $tag, sourceTag: $source, installerDigests: $digests, state: "dispatch-failed"}' \
            > "$RUNNER_TEMP/windows-dispatch.json"
          verify_release_tag_target
          CHILD_WORKFLOW_REF="$(resolve_child_workflow_ref "${GITHUB_REF}")"
          promote_windows_release_assets
          jq --arg runId "${windows_node_run_id}" '. + {state: "dispatched", childRunId: $runId}' \
            "$RUNNER_TEMP/windows-dispatch.json" > "$RUNNER_TEMP/windows-dispatch.next.json"
          mv "$RUNNER_TEMP/windows-dispatch.next.json" "$RUNNER_TEMP/windows-dispatch.json"

      - name: Record failed Windows dispatch
        if: ${{ failure() }}
        run: |
          echo "::warning::Windows promotion could not be dispatched; npm and GitHub publication remain complete. Use Windows Node Release for recovery."
          echo "- Windows Hub: dispatch failed; inspect this job before manual recovery." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows dispatch evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-dispatch.json
          if-no-files-found: warn
