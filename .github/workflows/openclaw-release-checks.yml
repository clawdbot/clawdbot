  summary:
    name: Verify release checks
    needs:
      - resolve_target
      - prepare_release_package
      - install_smoke_release_checks
      - cross_os_release_checks
      - live_repo_e2e_release_checks
      - docker_e2e_release_checks
      - package_acceptance_release_checks
      - qa_lab_parity_lane_release_checks
      - maturity_scorecard_release_checks
      - qa_lab_parity_report_release_checks
      - qa_lab_runtime_parity_release_checks
      - runtime_tool_coverage_release_checks
      - qa_live_release_checks
      - qa_live_buzz_release_checks
      - qa_live_telegram_release_checks
      - qa_live_discord_release_checks
      - qa_live_whatsapp_release_checks
      - qa_live_slack_release_checks
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout trusted release artifact resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted-release-check-artifacts
          sparse-checkout: scripts/github/resolve-release-check-artifacts.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Resolve advisory evidence artifacts
        id: resolve_advisory_evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_LAB_PARITY_LANE_RELEASE_CHECKS_RESULT: ${{ needs.qa_lab_parity_lane_release_checks.result }}
          QA_LAB_PARITY_REPORT_RELEASE_CHECKS_RESULT: ${{ needs.qa_lab_parity_report_release_checks.result }}
          QA_LAB_RUNTIME_PARITY_RELEASE_CHECKS_RESULT: ${{ needs.qa_lab_runtime_parity_release_checks.result }}
          QA_LIVE_DISCORD_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_discord_release_checks.result }}
          QA_LIVE_WHATSAPP_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_whatsapp_release_checks.result }}
          QA_LIVE_SLACK_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_slack_release_checks.result }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
        run: |
          set -euo pipefail
          selection_file=".artifacts/release-check-selection/advisory-evidence.json"
          args=(
            resolve
            --repository "$GITHUB_REPOSITORY"
            --run-id "$GITHUB_RUN_ID"
            --consumer-attempt "$GITHUB_RUN_ATTEMPT"
            --target-sha "$RELEASE_CHECK_TARGET_SHA"
          )
          if [[ "$QA_LAB_PARITY_LANE_RELEASE_CHECKS_RESULT" != "skipped" ]]; then
            args+=(
              --pair "qa_lab_parity_lane_release_checks|candidate|release-check-status-qa-parity-candidate-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-parity-candidate-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
              --pair "qa_lab_parity_lane_release_checks|baseline|release-check-status-qa-parity-baseline-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-parity-baseline-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          if [[ "$QA_LAB_PARITY_REPORT_RELEASE_CHECKS_RESULT" != "skipped" ]]; then
            args+=(
              --pair "qa_lab_parity_report_release_checks||release-check-status-qa-parity-report-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-parity-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          if [[ "$QA_LAB_RUNTIME_PARITY_RELEASE_CHECKS_RESULT" != "skipped" ]]; then
            args+=(
              --pair "qa_lab_runtime_parity_release_checks||release-check-status-qa-runtime-parity-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-runtime-parity-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          if [[ "$QA_LIVE_DISCORD_RELEASE_CHECKS_RESULT" != "skipped" ]]; then
            args+=(
              --pair "qa_live_discord_release_checks||release-check-status-qa-live-discord-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-live-discord-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          if [[ "$QA_LIVE_WHATSAPP_RELEASE_CHECKS_RESULT" != "skipped" ]]; then
            args+=(
              --pair "qa_live_whatsapp_release_checks||release-check-status-qa-live-whatsapp-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-live-whatsapp-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          if [[ "$QA_LIVE_SLACK_RELEASE_CHECKS_RESULT" != "skipped" ]]; then
            args+=(
              --pair "qa_live_slack_release_checks||release-check-status-qa-live-slack-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-live-slack-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          args+=(
            --selection-file "$selection_file"
            --github-output "$GITHUB_OUTPUT"
          )
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh "${args[@]}"

      - name: Download advisory status artifacts
        id: download_advisory_statuses
        if: steps.resolve_advisory_evidence.outcome == 'success' && steps.resolve_advisory_evidence.outputs.status_ids != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_advisory_evidence.outputs.status_ids }}
          path: .artifacts/release-check-status
          merge-multiple: true

      - name: Validate advisory status artifacts
        id: validate_advisory_statuses
        if: steps.resolve_advisory_evidence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release-check-status
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh validate \
            --selection-file "${{ steps.resolve_advisory_evidence.outputs.selection_file }}" \
            --status-dir .artifacts/release-check-status \
            --validated-file .artifacts/release-check-selection/advisory-evidence-validated.json

      - name: Verify release check results
        shell: bash
        env:
          RESOLVE_ADVISORY_EVIDENCE_OUTCOME: ${{ steps.resolve_advisory_evidence.outcome }}
          VALIDATE_ADVISORY_STATUSES_OUTCOME: ${{ steps.validate_advisory_statuses.outcome }}
          RESOLVE_TARGET_RESULT: ${{ needs.resolve_target.result }}
          PREPARE_RELEASE_PACKAGE_RESULT: ${{ needs.prepare_release_package.result }}
          INSTALL_SMOKE_RELEASE_CHECKS_RESULT: ${{ needs.install_smoke_release_checks.result }}
          CROSS_OS_RELEASE_CHECKS_RESULT: ${{ needs.cross_os_release_checks.result }}
          LIVE_REPO_E2E_RELEASE_CHECKS_RESULT: ${{ needs.live_repo_e2e_release_checks.result }}
          DOCKER_E2E_RELEASE_CHECKS_RESULT: ${{ needs.docker_e2e_release_checks.result }}
          PACKAGE_ACCEPTANCE_RELEASE_CHECKS_RESULT: ${{ needs.package_acceptance_release_checks.result }}
          QA_LAB_PARITY_LANE_RELEASE_CHECKS_RESULT: ${{ needs.qa_lab_parity_lane_release_checks.result }}
          MATURITY_SCORECARD_RELEASE_CHECKS_RESULT: ${{ needs.maturity_scorecard_release_checks.result }}
          QA_LAB_PARITY_REPORT_RELEASE_CHECKS_RESULT: ${{ needs.qa_lab_parity_report_release_checks.result }}
          QA_LAB_RUNTIME_PARITY_RELEASE_CHECKS_RESULT: ${{ needs.qa_lab_runtime_parity_release_checks.result }}
          RUNTIME_TOOL_COVERAGE_RELEASE_CHECKS_RESULT: ${{ needs.runtime_tool_coverage_release_checks.result }}
          QA_LIVE_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_release_checks.result }}
          QA_LIVE_BUZZ_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_buzz_release_checks.result }}
          QA_LIVE_TELEGRAM_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_telegram_release_checks.outputs.conclusion || needs.qa_live_telegram_release_checks.result }}
          QA_LIVE_TELEGRAM_SELECTED: ${{ needs.resolve_target.outputs.qa_live_scheduled == 'true' && needs.resolve_target.outputs.qa_live_telegram_enabled == 'true' }}
          QA_LIVE_TELEGRAM_IDENTITY_VERIFIED: ${{ needs.qa_live_telegram_release_checks.outputs.identity_verified }}
          QA_LIVE_DISCORD_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_discord_release_checks.result }}
          QA_LIVE_WHATSAPP_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_whatsapp_release_checks.result }}
          QA_LIVE_SLACK_RELEASE_CHECKS_RESULT: ${{ needs.qa_live_slack_release_checks.result }}
          RELEASE_CHECK_RUN_ID: ${{ github.run_id }}
          RELEASE_CHECK_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          RELEASE_PHASE: ${{ needs.resolve_target.outputs.phase }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          failed=0
          release_check_items=("resolve_target=${RESOLVE_TARGET_RESULT}")
          if [[ "$RELEASE_PHASE" != "candidate" ]]; then
            release_check_items+=(
              "install_smoke_release_checks=${INSTALL_SMOKE_RELEASE_CHECKS_RESULT}"
              "live_repo_e2e_release_checks=${LIVE_REPO_E2E_RELEASE_CHECKS_RESULT}"
              "qa_lab_parity_lane_release_checks=${QA_LAB_PARITY_LANE_RELEASE_CHECKS_RESULT}"
              "maturity_scorecard_release_checks=${MATURITY_SCORECARD_RELEASE_CHECKS_RESULT}"
              "qa_lab_parity_report_release_checks=${QA_LAB_PARITY_REPORT_RELEASE_CHECKS_RESULT}"
              "qa_lab_runtime_parity_release_checks=${QA_LAB_RUNTIME_PARITY_RELEASE_CHECKS_RESULT}"
              "runtime_tool_coverage_release_checks=${RUNTIME_TOOL_COVERAGE_RELEASE_CHECKS_RESULT}"
              "qa_live_release_checks=${QA_LIVE_RELEASE_CHECKS_RESULT}"
              "qa_live_buzz_release_checks=${QA_LIVE_BUZZ_RELEASE_CHECKS_RESULT}"
              "qa_live_telegram_release_checks=${QA_LIVE_TELEGRAM_RELEASE_CHECKS_RESULT}"
              "qa_live_discord_release_checks=${QA_LIVE_DISCORD_RELEASE_CHECKS_RESULT}"
              "qa_live_whatsapp_release_checks=${QA_LIVE_WHATSAPP_RELEASE_CHECKS_RESULT}"
              "qa_live_slack_release_checks=${QA_LIVE_SLACK_RELEASE_CHECKS_RESULT}"
            )
          fi
          if [[ "$RELEASE_PHASE" != "independent" ]]; then
            release_check_items+=(
              "prepare_release_package=${PREPARE_RELEASE_PACKAGE_RESULT}"
              "cross_os_release_checks=${CROSS_OS_RELEASE_CHECKS_RESULT}"
              "docker_e2e_release_checks=${DOCKER_E2E_RELEASE_CHECKS_RESULT}"
              "package_acceptance_release_checks=${PACKAGE_ACCEPTANCE_RELEASE_CHECKS_RESULT}"
            )
          fi
          tideclaw_alpha=false
          if [[ "${WORKFLOW_REF}" =~ ^refs/heads/tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            tideclaw_alpha=true
          fi
          validated_status_file=".artifacts/release-check-selection/advisory-evidence-validated.json"
          if [[ "$RESOLVE_ADVISORY_EVIDENCE_OUTCOME" != "success" ||
                "$VALIDATE_ADVISORY_STATUSES_OUTCOME" != "success" ]]; then
            status_resolution_message="Advisory evidence resolution or validation failed for run ${RELEASE_CHECK_RUN_ID} through attempt ${RELEASE_CHECK_RUN_ATTEMPT}."
            if [[ "$tideclaw_alpha" == "true" ]]; then
              echo "::warning::${status_resolution_message} Tideclaw alpha treats non-package-safety release-check lanes as advisory."
            else
              echo "::error::${status_resolution_message}"
              failed=1
            fi
          fi
          validated_status() {
            local expected_job="$1"
            local expected_variant="$2"
            [[ -f "$validated_status_file" ]] || return 1
            jq -er \
              --arg job "$expected_job" \
              --arg variant "$expected_variant" \
              '
                [.[] | select(.job == $job and .variant == $variant)] as $matches |
                if ($matches | length) == 1 and
                   ($matches[0].status | type) == "string"
                then $matches[0].status
                else error("missing or duplicate validated status")
                end
              ' "$validated_status_file"
          }
          release_check_result() {
            local name="$1"
            local fallback="$2"
            # Skipped lanes produce no status variants; Bash 3 treats an empty
            # array expansion as unbound when nounset is enabled.
            if [[ "$fallback" == "skipped" ]]; then
              printf 'skipped\n'
              return
            fi
            local saw=0
            local saw_failure=0
            local saw_cancelled=0
            local saw_skipped=0
            local variants=("")
            if [[ "$name" == "qa_lab_parity_lane_release_checks" ]]; then
              variants=(candidate baseline)
            fi
            for variant in "${variants[@]}"; do
              if ! status="$(validated_status "$name" "$variant")"; then
                saw_failure=1
                continue
              fi
              saw=1
              case "$status" in
                success) ;;
                skipped) saw_skipped=1 ;;
                cancelled) saw_cancelled=1 ;;
                failure|"") saw_failure=1 ;;
                *) saw_failure=1 ;;
              esac
            done
            if [[ "$saw_failure" == "1" ]]; then
              printf 'failure\n'
            elif [[ "$saw_cancelled" == "1" ]]; then
              printf 'cancelled\n'
            elif [[ "$saw_skipped" == "1" ]]; then
              printf 'skipped\n'
            elif [[ "$fallback" != "success" && "$fallback" != "skipped" ]]; then
              printf '%s\n' "$fallback"
            elif [[ "$saw" == "1" ]]; then
              printf 'success\n'
            elif [[ "$fallback" == "success" ]]; then
              printf 'failure\n'
            else
              printf '%s\n' "$fallback"
            fi
          }
          advisory_status_override_allowed() {
            case "$1" in
              qa_lab_parity_lane_release_checks|qa_lab_parity_report_release_checks|qa_lab_runtime_parity_release_checks|qa_live_discord_release_checks|qa_live_whatsapp_release_checks|qa_live_slack_release_checks)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          for item in "${release_check_items[@]}"; do
            name="${item%%=*}"
            raw_result="${item#*=}"
            if advisory_status_override_allowed "$name"; then
              result="$(release_check_result "$name" "$raw_result")"
            else
              result="$raw_result"
            fi
            if [[ "$name" == "qa_live_telegram_release_checks" ]]; then
              # Only an identified child execution is advisory; dispatch provenance remains a gate.
              if [[ "$result" != "skipped" && "$QA_LIVE_TELEGRAM_IDENTITY_VERIFIED" != "true" ]]; then
                echo "::error::Telegram dispatch identity was not verified"
                failed=1
                continue
              fi
              if [[ "$result" != "success" && "$QA_LIVE_TELEGRAM_SELECTED" == "true" ]]; then
                echo "::warning::${name} ended with ${result}; Telegram release testing is best effort and does not block release validation."
              fi
              continue
            fi
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              if [[ "$tideclaw_alpha" == "true" ]]; then
                case "$name" in
                  resolve_target|prepare_release_package|install_smoke_release_checks|package_acceptance_release_checks) ;;
                  *)
                    echo "::warning::${name} ended with ${result}; Tideclaw alpha treats non-package-safety release-check lanes as advisory."
                    continue
                    ;;
                esac
              fi
              echo "::error::${name} ended with ${result}"
              failed=1
            fi
          done
          exit "$failed"
