      prepublish_plugin_registry_artifact_id: ${{ fromJSON(needs.prepare_release_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactId || '' }}
      prepublish_plugin_registry_artifact_digest: ${{ fromJSON(needs.prepare_release_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactDigest || '' }}
      prepublish_plugin_registry_artifact_run_id: ${{ fromJSON(needs.prepare_release_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunId || '' }}
      prepublish_plugin_registry_artifact_run_attempt: ${{ fromJSON(needs.prepare_release_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryArtifactRunAttempt || '' }}
      prepublish_plugin_registry_manifest_sha256: ${{ fromJSON(needs.prepare_release_package.outputs.prepublish_plugin_registry_json || '{}').prepublishPluginRegistryManifestSha256 || '' }}
      codex_plugin_spec: ${{ needs.resolve_target.outputs.codex_plugin_spec }}
      shared_image_artifact_namespace: release-docker
      shared_image_artifact_name: ${{ fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').imageArtifactName || '' }}
      shared_image_artifact_id: ${{ fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').imageArtifactId || '' }}
      shared_image_artifact_digest: ${{ fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').imageArtifactDigest || '' }}
      shared_image_artifact_run_id: ${{ fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').imageArtifactRunId || '' }}
      shared_image_artifact_run_attempt: ${{ fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').imageArtifactRunAttempt || '' }}
      shared_image_archive_sha256: ${{ fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').imageArchiveSha256 || '' }}
      shared_image_policy: no-push-artifact
    secrets: *live_e2e_release_secrets

  package_acceptance_release_checks:
    name: Run package acceptance
    needs: [resolve_target, prepare_release_package]
    if: needs.resolve_target.outputs.package_acceptance_scheduled == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/package-acceptance.yml
    with:
      advisory: false
      allow_frozen_target_scenario_omissions: ${{ inputs.allow_frozen_target_scenario_omissions }}
      workflow_ref: ${{ github.sha }}
      source: ${{ (needs.resolve_target.outputs.package_acceptance_package_spec != '' || needs.resolve_target.outputs.package_mode == 'published') && 'npm' || 'artifact' }}
      package_spec: ${{ needs.resolve_target.outputs.package_acceptance_package_spec || needs.resolve_target.outputs.release_package_spec || 'openclaw@beta' }}
      artifact_digest: ${{ needs.prepare_release_package.outputs.artifact_digest }}
      artifact_id: ${{ needs.prepare_release_package.outputs.artifact_id }}
      artifact_name: ${{ needs.prepare_release_package.outputs.artifact_name }}
      artifact_run_attempt: ${{ needs.prepare_release_package.outputs.artifact_run_attempt }}
      artifact_run_id: ${{ needs.prepare_release_package.outputs.artifact_run_id }}
      package_file_name: ${{ needs.prepare_release_package.outputs.package_file_name }}
      package_sha256: ${{ (needs.resolve_target.outputs.package_acceptance_package_spec == '' && needs.resolve_target.outputs.package_mode != 'published') && needs.prepare_release_package.outputs.package_sha256 || '' }}
      package_source_sha: ${{ needs.prepare_release_package.outputs.source_sha }}
      package_version: ${{ needs.prepare_release_package.outputs.package_version }}
      prepublish_plugin_registry_json: ${{ needs.resolve_target.outputs.package_acceptance_package_spec == '' && needs.prepare_release_package.outputs.prepublish_plugin_registry_json || '' }}
      suite_profile: custom
      docker_lanes: release-typed-onboarding doctor-switch update-channel-switch skill-install update-corrupt-plugin upgrade-survivor update-first-hop-compat published-upgrade-survivor root-managed-vps-upgrade update-restart-auth plugins-offline plugin-update plugin-binding-command-escape
      published_upgrade_survivor_baseline: ${{ needs.resolve_target.outputs.frozen_upgrade_baseline && format('openclaw@{0}', needs.resolve_target.outputs.frozen_upgrade_baseline) || 'openclaw@latest' }}
      published_upgrade_survivor_scenarios: ${{ needs.resolve_target.outputs.run_release_soak == 'true' && 'reported-issues' || '' }}
      telegram_mode: ${{ (needs.resolve_target.outputs.telegram_waiver != '' || needs.resolve_target.outputs.skip_package_telegram_e2e == 'true') && 'none' || 'mock-openai' }}
      telegram_advisory: true
      shared_image_artifact_namespace: release-package
      candidate_artifact_json: ${{ needs.resolve_target.outputs.package_acceptance_package_spec == '' && needs.resolve_target.outputs.candidate_artifact_json || '' }}
      shared_image_policy: no-push-artifact
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_API_KEY_OLD: ${{ secrets.ANTHROPIC_API_KEY_OLD }}
      ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
      BYTEPLUS_API_KEY: ${{ secrets.BYTEPLUS_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MODELSTUDIO_API_KEY: ${{ secrets.MODELSTUDIO_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENCLAW_LIVE_BROWSER_CDP_URL: ${{ secrets.OPENCLAW_LIVE_BROWSER_CDP_URL }}
      OPENCLAW_LIVE_SETUP_TOKEN: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN }}
      OPENCLAW_LIVE_SETUP_TOKEN_MODEL: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_MODEL }}
      OPENCLAW_LIVE_SETUP_TOKEN_PROFILE: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_PROFILE }}
      OPENCLAW_LIVE_SETUP_TOKEN_VALUE: ${{ secrets.OPENCLAW_LIVE_SETUP_TOKEN_VALUE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      VYDRA_API_KEY: ${{ secrets.VYDRA_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
      BYTEPLUS_ACCESS_KEY_ID: ${{ secrets.BYTEPLUS_ACCESS_KEY_ID }}
      BYTEPLUS_SECRET_ACCESS_KEY: ${{ secrets.BYTEPLUS_SECRET_ACCESS_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENCLAW_CODEX_AUTH_JSON: ${{ secrets.OPENCLAW_CODEX_AUTH_JSON }}
      OPENCLAW_CODEX_CONFIG_TOML: ${{ secrets.OPENCLAW_CODEX_CONFIG_TOML }}
      OPENCLAW_CLAUDE_JSON: ${{ secrets.OPENCLAW_CLAUDE_JSON }}
      OPENCLAW_CLAUDE_CREDENTIALS_JSON: ${{ secrets.OPENCLAW_CLAUDE_CREDENTIALS_JSON }}
      OPENCLAW_CLAUDE_SETTINGS_JSON: ${{ secrets.OPENCLAW_CLAUDE_SETTINGS_JSON }}
      OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON: ${{ secrets.OPENCLAW_CLAUDE_SETTINGS_LOCAL_JSON }}
      OPENCLAW_GEMINI_SETTINGS_JSON: ${{ secrets.OPENCLAW_GEMINI_SETTINGS_JSON }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
      OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}

  maturity_scorecard_release_checks:
    name: Render maturity scorecard release docs
    needs: [resolve_target]
    if: contains(fromJSON('["all","qa"]'), needs.resolve_target.outputs.rerun_group) && needs.resolve_target.outputs.run_maturity_scorecard == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/maturity-scorecard.yml
    with:
      ref: ${{ needs.resolve_target.outputs.ref }}
      expected_sha: ${{ needs.resolve_target.outputs.revision }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
      OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}

  qa_lab_parity_lane_release_checks:
    name: Run QA Lab parity lane (${{ matrix.lane }})
    needs: [resolve_target]
    if: needs.resolve_target.outputs.qa_parity_scheduled == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: candidate
            output_dir: openai-candidate
          - lane: baseline
            output_dir: anthropic-baseline
    env:
      QA_PARITY_CONCURRENCY: "1"
      OPENCLAW_QA_TRANSPORT_READY_TIMEOUT_MS: "180000"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENCLAW_LIVE_OPENAI_KEY: ""
      OPENCLAW_LIVE_ANTHROPIC_KEY: ""
      OPENCLAW_LIVE_GEMINI_KEY: ""
      OPENCLAW_LIVE_SETUP_TOKEN_VALUE: ""
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_target.outputs.revision }}
          fetch-depth: 1

      - name: Checkout trusted QA Anthropic mock tooling
        if: needs.resolve_target.outputs.trusted_qa_tooling_eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-qa-tooling-trusted
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          sparse-checkout: extensions/qa-lab/src/providers/mock-openai/mock-anthropic-wire.ts
          sparse-checkout-cone-mode: false
          submodules: false

      - name: Install trusted QA Anthropic mock tooling
        if: needs.resolve_target.outputs.trusted_qa_tooling_eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          trusted_checkout=.release-qa-tooling-trusted
          trap 'rm -rf -- "$trusted_checkout"' EXIT
          install -m 0644 \
            "$trusted_checkout/extensions/qa-lab/src/providers/mock-openai/mock-anthropic-wire.ts" \
            extensions/qa-lab/src/providers/mock-openai/mock-anthropic-wire.ts
          rm -rf -- "$trusted_checkout"
          trap - EXIT

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"

      - name: Build private QA runtime
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build qaRuntime

      - name: Run parity lane
        id: run_lane
        env:
          QA_PARITY_LANE: ${{ matrix.lane }}
          QA_PARITY_OUTPUT_DIR: ${{ matrix.output_dir }}
        run: |
          set -euo pipefail

          case "${QA_PARITY_LANE}" in
            candidate)
              model="${OPENCLAW_CI_OPENAI_MODEL}"
              alt_model="openai/gpt-5.6-luna-alt"
              ;;
            baseline)
              model="anthropic/claude-opus-4-8"
              alt_model="anthropic/claude-sonnet-4-6"
              ;;
            *)
              echo "Unknown QA parity lane: ${QA_PARITY_LANE}" >&2
              exit 1
              ;;
          esac

          pnpm openclaw qa suite \
            --provider-mode mock-openai \
            --parity-pack agentic \
            --concurrency "${QA_PARITY_CONCURRENCY}" \
            --model "${model}" \
            --alt-model "${alt_model}" \
            --output-dir ".artifacts/qa-e2e/${QA_PARITY_OUTPUT_DIR}"

      - name: Upload parity lane artifacts
        id: upload_parity_lane_artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qa-parity-${{ matrix.lane }}-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/qa-e2e/
          retention-days: 14
          if-no-files-found: error

      - name: Record advisory status
        if: always()
        shell: bash
        env:
          RELEASE_CHECK_JOB: qa_lab_parity_lane_release_checks
          RELEASE_CHECK_VARIANT: ${{ matrix.lane }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_CHECK_STEP_OUTCOMES: ${{ steps.run_lane.outcome }} ${{ steps.upload_parity_lane_artifacts.outcome }}
        run: &record_release_check_advisory_status |
          set -euo pipefail
          status="success"
          mark_status() {
            case "$1" in
              failure) status="failure" ;;
              cancelled)
                if [[ "$status" != "failure" ]]; then
                  status="cancelled"
                fi
                ;;
              success|skipped|"") ;;
              *) status="failure" ;;
            esac
          }
          mark_status "${JOB_STATUS:-}"
          for outcome in ${RELEASE_CHECK_STEP_OUTCOMES:-}; do
            mark_status "$outcome"
          done
          mkdir -p .artifacts/release-check-status
          status_name="$RELEASE_CHECK_JOB"
          if [[ -n "${RELEASE_CHECK_VARIANT:-}" ]]; then
            status_name="${status_name}-${RELEASE_CHECK_VARIANT}"
          fi
          status_path=".artifacts/release-check-status/${status_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          {
            printf 'run_id=%s\n' "${GITHUB_RUN_ID:?}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT:?}"
            printf 'target_sha=%s\n' "${RELEASE_CHECK_TARGET_SHA:?}"
            printf 'job=%s\n' "$RELEASE_CHECK_JOB"
            printf 'variant=%s\n' "${RELEASE_CHECK_VARIANT:-}"
            printf 'status=%s\n' "$status"
            printf 'job_status=%s\n' "${JOB_STATUS:-}"
            printf 'step_outcomes=%s\n' "${RELEASE_CHECK_STEP_OUTCOMES:-}"
          } > "$status_path"

      - name: Upload advisory status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-check-status-qa-parity-${{ matrix.lane }}-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-check-status/qa_lab_parity_lane_release_checks-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}.env
          retention-days: 14
          if-no-files-found: error

  qa_lab_parity_report_release_checks:
    name: Run QA Lab parity report
    needs: [resolve_target, qa_lab_parity_lane_release_checks]
    if: needs.resolve_target.outputs.qa_parity_scheduled == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_target.outputs.revision }}
          fetch-depth: 1

      - name: Checkout trusted release artifact resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted-release-check-artifacts
          sparse-checkout: scripts/github/resolve-release-check-artifacts.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"

      - name: Resolve parity lane artifacts
        id: resolve_parity_lane_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
        run: |
          set -euo pipefail
          selection_file=".artifacts/release-check-selection/parity-lanes.json"
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh resolve \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --consumer-attempt "$GITHUB_RUN_ATTEMPT" \
            --target-sha "$RELEASE_CHECK_TARGET_SHA" \
            --pair "qa_lab_parity_lane_release_checks|candidate|release-check-status-qa-parity-candidate-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-parity-candidate-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}" \
            --pair "qa_lab_parity_lane_release_checks|baseline|release-check-status-qa-parity-baseline-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-parity-baseline-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}" \
            --selection-file "$selection_file" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download parity lane statuses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_parity_lane_artifacts.outputs.status_ids }}
          path: .artifacts/release-check-status/
          merge-multiple: true

      - name: Download parity lane artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_parity_lane_artifacts.outputs.payload_ids }}
          path: .artifacts/qa-e2e/
          merge-multiple: true

      - name: Verify parity lane statuses
        shell: bash
        run: |
          set -euo pipefail
          validated_file=".artifacts/release-check-selection/parity-lanes-validated.json"
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh validate \
            --selection-file "${{ steps.resolve_parity_lane_artifacts.outputs.selection_file }}" \
            --status-dir .artifacts/release-check-status \
            --validated-file "$validated_file"
          jq -e 'length == 2 and all(.[]; .status == "success")' "$validated_file" >/dev/null

      - name: Build private QA runtime
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build qaRuntime

      - name: Generate parity report
        id: generate_report
        run: |
          pnpm openclaw qa parity-report \
            --repo-root . \
            --candidate-summary .artifacts/qa-e2e/openai-candidate/qa-suite-summary.json \
            --baseline-summary .artifacts/qa-e2e/anthropic-baseline/qa-suite-summary.json \
            --candidate-label "${OPENCLAW_CI_OPENAI_MODEL}" \
            --baseline-label anthropic/claude-opus-4-8 \
            --output-dir .artifacts/qa-e2e/parity

      - name: Upload parity artifacts
        id: upload_parity_artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qa-parity-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/qa-e2e/
          retention-days: 14
          if-no-files-found: error

      - name: Record advisory status
        if: always()
        shell: bash
        env:
          RELEASE_CHECK_JOB: qa_lab_parity_report_release_checks
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_CHECK_STEP_OUTCOMES: ${{ steps.generate_report.outcome }} ${{ steps.upload_parity_artifacts.outcome }}
        run: *record_release_check_advisory_status

      - name: Upload advisory status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-check-status-qa-parity-report-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-check-status/qa_lab_parity_report_release_checks-${{ github.run_id }}-${{ github.run_attempt }}.env
          retention-days: 14
          if-no-files-found: error

  qa_lab_runtime_pair_lane_release_checks:
    name: Run QA Lab runtime-pair lane (${{ matrix.lane }})
    needs: [resolve_target]
    if: needs.resolve_target.outputs.qa_parity_scheduled == 'true'
    continue-on-error: true
    runs-on: ${{ vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.resolve_target.outputs.run_release_soak == 'true' && '["core","soak"]' || '["core"]') }}
    permissions:
      contents: read
    env:
      QA_PARITY_CONCURRENCY: "1"
      OPENCLAW_QA_TRANSPORT_READY_TIMEOUT_MS: "180000"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENCLAW_LIVE_OPENAI_KEY: ""
      OPENCLAW_LIVE_ANTHROPIC_KEY: ""
      OPENCLAW_LIVE_GEMINI_KEY: ""
      OPENCLAW_LIVE_SETUP_TOKEN_VALUE: ""
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_target.outputs.revision }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"

      - name: Build private QA runtime
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build qaRuntime

      - name: Run runtime-pair lane
        id: candidate_runtime_pair
        continue-on-error: true
        env:
          RUNTIME_PAIR_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail

          output_dir="runtime-pair-${RUNTIME_PAIR_LANE}"
          runtime_pair_args=(
            --provider-mode mock-openai
            --concurrency "${QA_PARITY_CONCURRENCY}"
            --model "${OPENCLAW_CI_OPENAI_MODEL}"
            --alt-model "openai/gpt-5.6-luna-alt"
            --runtime-pair openclaw,codex
            --output-dir ".artifacts/qa-e2e/${output_dir}"
          )

          if pnpm openclaw qa suite --help | grep -Fq -- "--runtime-pair-lane"; then
            runtime_pair_args+=(--runtime-pair-lane "$RUNTIME_PAIR_LANE")
          elif [[ "$RUNTIME_PAIR_LANE" == "core" ]]; then
            # Legacy explicit-tier selection bypasses its provider eligibility
            # filter. live-only scenarios require a live provider, so the mock
            # core lane must select only the eligible standard tier.
            runtime_pair_args+=(--runtime-parity-tier standard)
          elif [[ "$RUNTIME_PAIR_LANE" == "soak" ]]; then
            runtime_pair_args+=(--runtime-parity-tier soak)
          else
            echo "Frozen candidate cannot select runtime-pair lane: $RUNTIME_PAIR_LANE" >&2
            exit 1
          fi

          pnpm openclaw qa suite "${runtime_pair_args[@]}"

      - name: Checkout trusted validator after candidate suite
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted-suite-validator
          fetch-depth: 1

      - name: Validate runtime-pair lane
        id: runtime_parity_validation
        if: always()
        env:
          CANDIDATE_SUITE_OUTCOME: ${{ steps.candidate_runtime_pair.outcome }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          RUNTIME_PAIR_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          output_dir="runtime-pair-${RUNTIME_PAIR_LANE}"
          summary=".artifacts/qa-e2e/${output_dir}/qa-suite-summary.json"
          validator_args=(
            --summary "$summary"
            --candidate-suite-outcome "$CANDIDATE_SUITE_OUTCOME"
            --target-sha "$RELEASE_CHECK_TARGET_SHA"
            --lane "$RUNTIME_PAIR_LANE"
          )
          if [[ "$CANDIDATE_SUITE_OUTCOME" != "success" ]]; then
            validator_args+=(--require-explicit-gap)
          fi
          node --import tsx trusted-suite-validator/scripts/validate-qa-runtime-pair-summary.mts "${validator_args[@]}"
          if [[ "$CANDIDATE_SUITE_OUTCOME" != "success" ]]; then
            echo "::notice::Trusted workflow validation accepted frozen-candidate runtime-pair evidence after its suite failed."
          fi

      - name: Run OpenClaw core restart proof
        id: runtime_core_restart
        if: matrix.lane == 'core' && steps.runtime_parity_validation.outcome == 'success'
        run: |
          # Restart recovery owns an OpenClaw Gateway lifecycle; it is release-critical
          # but cannot be compared against the Codex app-server runtime.
          pnpm openclaw qa suite \
            --provider-mode mock-openai \
            --concurrency "${QA_PARITY_CONCURRENCY}" \
            --model "${OPENCLAW_CI_OPENAI_MODEL}" \
            --alt-model "openai/gpt-5.6-luna-alt" \
            --scenario gateway-restart-inflight-run \
            --output-dir ".artifacts/qa-e2e/openclaw-core-restart"

      - name: Generate runtime-pair lane report
        id: candidate_runtime_parity_report
        if: always()
        continue-on-error: true
        env:
          RUNTIME_PAIR_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail

          output_dir="runtime-pair-${RUNTIME_PAIR_LANE}"
          summary=".artifacts/qa-e2e/${output_dir}/qa-suite-summary.json"
          if [[ "$RUNTIME_PAIR_LANE" == "soak" && ! -f "$summary" ]]; then
            echo "No soak runtime-pair summary was produced."
            exit 0
          fi
          report_dir=".artifacts/qa-e2e/${output_dir}-report"
          pnpm openclaw qa parity-report \
            --repo-root . \
            --runtime-axis \
            --summary "$summary" \
            --output-dir "$report_dir"

      - name: Checkout trusted validator after candidate report
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted-report-validator
          fetch-depth: 1

      - name: Validate runtime-pair lane report
        id: generate_runtime_parity_report
        if: always()
        env:
          CANDIDATE_REPORT_OUTCOME: ${{ steps.candidate_runtime_parity_report.outcome }}
          CANDIDATE_SUITE_OUTCOME: ${{ steps.candidate_runtime_pair.outcome }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          RUNTIME_PAIR_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          output_dir="runtime-pair-${RUNTIME_PAIR_LANE}"
          summary=".artifacts/qa-e2e/${output_dir}/qa-suite-summary.json"
          report_dir=".artifacts/qa-e2e/${output_dir}-report"
          validator_args=(
            --summary "$summary"
            --report-summary "$report_dir/qa-runtime-parity-summary.json"
            --report-markdown "$report_dir/qa-runtime-parity-report.md"
            --candidate-suite-outcome "$CANDIDATE_SUITE_OUTCOME"
            --target-sha "$RELEASE_CHECK_TARGET_SHA"
            --lane "$RUNTIME_PAIR_LANE"
          )
          if [[ "$CANDIDATE_REPORT_OUTCOME" != "success" ]]; then
            validator_args+=(--require-explicit-gap)
          fi
          node --import tsx trusted-report-validator/scripts/validate-qa-runtime-pair-summary.mts "${validator_args[@]}"
          if [[ "$CANDIDATE_REPORT_OUTCOME" != "success" ]]; then
            echo "::notice::Trusted workflow validation accepted the frozen-candidate runtime-pair report after its reporter failed."
          fi

      - name: Upload runtime-pair lane artifacts
        id: upload_runtime_parity_artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qa-runtime-pair-lane-${{ matrix.lane }}-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/qa-e2e/
          retention-days: 14
          if-no-files-found: error

      - name: Record runtime-pair lane status
        if: always()
        shell: bash
        env:
          RELEASE_CHECK_JOB: qa_lab_runtime_pair_lane_release_checks
          RELEASE_CHECK_VARIANT: ${{ matrix.lane }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_CHECK_STEP_OUTCOMES: ${{ steps.runtime_parity_validation.outcome }} ${{ steps.runtime_core_restart.outcome }} ${{ steps.generate_runtime_parity_report.outcome }} ${{ steps.upload_runtime_parity_artifacts.outcome }}
        run: *record_release_check_advisory_status

      - name: Upload runtime-pair lane status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-internal-status-qa-runtime-pair-lane-${{ matrix.lane }}-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-check-status/qa_lab_runtime_pair_lane_release_checks-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}.env
          retention-days: 14
          if-no-files-found: error

  qa_lab_runtime_parity_release_checks:
    name: Verify QA Lab runtime-pair lanes
    needs: [resolve_target, qa_lab_runtime_pair_lane_release_checks]
    if: always() && needs.resolve_target.outputs.qa_parity_scheduled == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted release artifact resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted-release-check-artifacts
          sparse-checkout: scripts/github/resolve-release-check-artifacts.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Resolve runtime-pair lane artifacts
        id: resolve_runtime_pair_artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          RUN_RELEASE_SOAK: ${{ needs.resolve_target.outputs.run_release_soak }}
        run: |
          set -euo pipefail
          selection_file=".artifacts/release-check-selection/runtime-pair-lanes.json"
          args=(
            resolve
            --repository "$GITHUB_REPOSITORY"
            --run-id "$GITHUB_RUN_ID"
            --consumer-attempt "$GITHUB_RUN_ATTEMPT"
            --target-sha "$RELEASE_CHECK_TARGET_SHA"
            --pair "qa_lab_runtime_pair_lane_release_checks|core|release-internal-status-qa-runtime-pair-lane-core-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-runtime-pair-lane-core-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            --selection-file "$selection_file"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$RUN_RELEASE_SOAK" == "true" ]]; then
            args+=(
              --pair "qa_lab_runtime_pair_lane_release_checks|soak|release-internal-status-qa-runtime-pair-lane-soak-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-runtime-pair-lane-soak-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}"
            )
          fi
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh "${args[@]}"

      - name: Download runtime-pair lane statuses
        id: download_runtime_pair_statuses
        if: always() && steps.resolve_runtime_pair_artifacts.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_runtime_pair_artifacts.outputs.status_ids }}
          path: .artifacts/release-check-status/
          merge-multiple: true

      - name: Download runtime-pair lane artifacts
        id: download_runtime_pair_artifacts
        if: always() && steps.resolve_runtime_pair_artifacts.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_runtime_pair_artifacts.outputs.payload_ids }}
          path: .artifacts/qa-e2e/
          merge-multiple: true

      - name: Verify runtime-pair lane statuses
        id: verify_runtime_parity_statuses
        if: always()
        shell: bash
        env:
          RUN_RELEASE_SOAK: ${{ needs.resolve_target.outputs.run_release_soak }}
        run: |
          set -euo pipefail
          validated_file=".artifacts/release-check-selection/runtime-pair-lanes-validated.json"
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh validate \
            --selection-file "${{ steps.resolve_runtime_pair_artifacts.outputs.selection_file }}" \
            --status-dir .artifacts/release-check-status \
            --validated-file "$validated_file"
          expected_count=1
          if [[ "$RUN_RELEASE_SOAK" == "true" ]]; then
            expected_count=2
          fi
          jq -e --argjson expected_count "$expected_count" \
            'length == $expected_count and all(.[]; .status == "success")' \
            "$validated_file" >/dev/null

      - name: Upload runtime parity artifacts
        id: upload_runtime_parity_artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qa-runtime-parity-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/qa-e2e/
          retention-days: 14
          if-no-files-found: error

      - name: Record advisory status
        if: always()
        shell: bash
        env:
          RELEASE_CHECK_JOB: qa_lab_runtime_parity_release_checks
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_CHECK_STEP_OUTCOMES: ${{ steps.resolve_runtime_pair_artifacts.outcome }} ${{ steps.download_runtime_pair_statuses.outcome }} ${{ steps.download_runtime_pair_artifacts.outcome }} ${{ steps.verify_runtime_parity_statuses.outcome }} ${{ steps.upload_runtime_parity_artifacts.outcome }}
        run: *record_release_check_advisory_status

      - name: Upload advisory status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-check-status-qa-runtime-parity-${{ needs.resolve_target.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-check-status/qa_lab_runtime_parity_release_checks-${{ github.run_id }}-${{ github.run_attempt }}.env
          retention-days: 14
          if-no-files-found: error

  runtime_tool_coverage_release_checks:
    name: Enforce QA Lab runtime tool coverage
    needs: [resolve_target, qa_lab_runtime_parity_release_checks]
    if: needs.resolve_target.outputs.qa_parity_scheduled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_target.outputs.revision }}
          fetch-depth: 1

      - name: Checkout trusted release artifact resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted-release-check-artifacts
          sparse-checkout: scripts/github/resolve-release-check-artifacts.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"

      - name: Resolve runtime parity artifacts
        id: resolve_runtime_parity_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHECK_TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
        run: |
          set -euo pipefail
          selection_file=".artifacts/release-check-selection/runtime-parity.json"
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh resolve \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --consumer-attempt "$GITHUB_RUN_ATTEMPT" \
            --target-sha "$RELEASE_CHECK_TARGET_SHA" \
            --pair "qa_lab_runtime_parity_release_checks||release-check-status-qa-runtime-parity-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}|release-qa-runtime-parity-${RELEASE_CHECK_TARGET_SHA}-${GITHUB_RUN_ID}" \
            --selection-file "$selection_file" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download runtime parity status
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_runtime_parity_artifacts.outputs.status_ids }}
          path: .artifacts/release-check-status/

      - name: Verify runtime parity producer status
        id: verify_runtime_parity_status
        shell: bash
        run: |
          set -euo pipefail
          validated_file=".artifacts/release-check-selection/runtime-parity-validated.json"
          bash trusted-release-check-artifacts/scripts/github/resolve-release-check-artifacts.sh validate \
            --selection-file "${{ steps.resolve_runtime_parity_artifacts.outputs.selection_file }}" \
            --status-dir .artifacts/release-check-status \
            --validated-file "$validated_file"
          status="$(jq -r 'if length == 1 then .[0].status else empty end' "$validated_file")"
          [[ -n "$status" ]] || {
            echo "Runtime parity producer status selection is incomplete." >&2
            exit 1
          }
          if [[ "$status" != "success" ]]; then
            echo "Runtime parity producer status is ${status:-missing}; skipping coverage artifact consumer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download runtime parity artifacts
        if: steps.verify_runtime_parity_status.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_runtime_parity_artifacts.outputs.payload_ids }}
          path: .artifacts/qa-e2e/

      - name: Enforce core runtime tool coverage
        if: steps.verify_runtime_parity_status.outputs.ready == 'true'
        run: |
          set -euo pipefail
          pnpm openclaw qa coverage \
            --repo-root . \
            --tools \
            --summary .artifacts/qa-e2e/runtime-pair-core/qa-suite-summary.json \
            --output .artifacts/qa-e2e/runtime-pair-core-report/qa-runtime-tool-coverage-report.md

      - name: Upload runtime tool coverage artifacts
        if: ${{ always() && steps.verify_runtime_parity_status.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-qa-runtime-tool-coverage-${{ needs.resolve_target.outputs.revision }}
          path: .artifacts/qa-e2e/runtime-pair-core-report/
          retention-days: 14
          if-no-files-found: error

  qa_live_release_checks:
    name: Run QA Live Matrix catalog
    needs: [resolve_target]
    if: needs.resolve_target.outputs.qa_live_scheduled == 'true' && needs.resolve_target.outputs.qa_live_matrix_enabled == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/qa-live-transports-convex.yml
    with:
      ref: ${{ needs.resolve_target.outputs.revision }}
      expected_sha: ${{ needs.resolve_target.outputs.revision }}
      lock_scope: matrix
      run_matrix: true
      fail_fast: ${{ fromJSON(needs.resolve_target.outputs.fail_fast) }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
      OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}

  qa_live_buzz_release_checks:
    name: Run QA Lab live Buzz lane
    needs: [resolve_target]
    if: needs.resolve_target.outputs.qa_live_scheduled == 'true' && needs.resolve_target.outputs.qa_live_buzz_enabled == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/qa-live-transports-convex.yml
    with:
      ref: ${{ needs.resolve_target.outputs.revision }}
      expected_sha: ${{ needs.resolve_target.outputs.revision }}
      lock_scope: buzz
      run_buzz: true
      buzz_scenario: channel-canary,channel-mention-gating
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
      OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}

  # The child owns Telegram evidence/status artifacts. Preserve its actual outcome
  # while release policy treats this pool-dependent test attempt as advisory.
  qa_live_telegram_release_checks:
    name: Run QA Lab live Telegram lane
    needs: [resolve_target]
    if: needs.resolve_target.outputs.qa_live_scheduled == 'true' && needs.resolve_target.outputs.qa_live_telegram_enabled == 'true'
    continue-on-error: true
    outputs:
      conclusion: ${{ steps.dispatch.outputs.conclusion || steps.dispatch.outcome }}
      identity_verified: ${{ steps.dispatch.outputs.identity_verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and await trusted Telegram QA
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_WORKFLOW_REF: ${{ github.ref_name }}
          PARENT_WORKFLOW_SHA: ${{ github.sha }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          TARGET_SHA: ${{ needs.resolve_target.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          workflow="openclaw-release-telegram-qa.yml"
          run_id=""
          run_name=""
          find_child_runs() {
            RUN_NAME="$run_name" gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -F event=workflow_dispatch \
              -F branch="$PARENT_WORKFLOW_REF" \
              -F per_page=100 \
              --jq '[.workflow_runs[] | select(.display_title == env.RUN_NAME) | {id, head_sha}]'
          }
          cancel_child() {
            if [[ -n "${run_id:-}" ]]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            fi
          }
          cancel_child_on_failure() {
            status="$?"
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              set +e
              if [[ -z "${run_id:-}" && -n "${run_name:-}" ]]; then
                # The nonce makes delayed discovery safe after an ambiguous dispatch response.
                for _ in $(seq 1 6); do
                  matches_json="$(find_child_runs 2>/dev/null)" || matches_json="[]"
                  if [[ "$(jq 'length' <<<"$matches_json" 2>/dev/null)" == "1" ]]; then
                    run_id="$(jq -r '.[0].id' <<<"$matches_json")"
                    break
                  fi
                  sleep 2
                done
              fi
              cancel_child
            fi
            exit "$status"
          }
          trap cancel_child_on_failure EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          dispatch_id="release-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"
          run_name="OpenClaw Release Telegram QA ${dispatch_id}"
          child_head_sha=""

          gh workflow run "$workflow" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$PARENT_WORKFLOW_REF" \
            -f dispatch_id="$dispatch_id" \
            -f expected_trusted_workflow_sha="$PARENT_WORKFLOW_SHA" \
            -f target_context_ref="$TARGET_CONTEXT_REF" \
            -f target_ref="$TARGET_SHA" \
            -f target_sha="$TARGET_SHA"

          for _ in $(seq 1 60); do
            matches_json="$(find_child_runs)"
            match_count="$(jq 'length' <<<"$matches_json")"
            if ((match_count > 1)); then
              echo "Multiple Telegram QA runs matched ${run_name}; refusing to guess." >&2
              exit 1
            fi
            if ((match_count == 1)); then
              run_id="$(jq -r '.[0].id' <<<"$matches_json")"
              child_head_sha="$(jq -r '.[0].head_sha' <<<"$matches_json")"
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not find exact dispatched Telegram QA run ${run_name}." >&2
            exit 1
          fi
          if [[ "$child_head_sha" != "$PARENT_WORKFLOW_SHA" ]]; then
            echo "Telegram QA used tooling SHA ${child_head_sha}, expected ${PARENT_WORKFLOW_SHA}." >&2
            cancel_child
            exit 1
          fi

          child_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "identity_verified=true" >> "$GITHUB_OUTPUT"
          echo "Dispatched trusted Telegram QA: ${child_url}"
          echo "child_url=${child_url}" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 1080); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r .status <<<"$run_json")"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(jq -r .conclusion <<<"$run_json")"
              echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
              if [[ "$conclusion" != "success" ]]; then
                echo "::warning::Trusted Telegram QA concluded ${conclusion}: ${child_url}" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out awaiting trusted Telegram QA: ${child_url}" >&2
          exit 1

      - name: Summarize Telegram attempt
        if: always()
        env:
          CHILD_URL: ${{ steps.dispatch.outputs.child_url }}
          CONCLUSION: ${{ steps.dispatch.outputs.conclusion || steps.dispatch.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Telegram release QA (advisory)"
            echo
            echo "- Telegram attempt: ${CONCLUSION}"
            [[ -z "$CHILD_URL" ]] || echo "- Child evidence: ${CHILD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::warning::Telegram attempt: ${CONCLUSION}; release testing is best effort."
          fi

  qa_live_discord_release_checks:
    name: Run QA Lab live Discord lane
    needs: [resolve_target]
    if: needs.resolve_target.outputs.qa_live_scheduled == 'true' && needs.resolve_target.outputs.qa_live_discord_enabled == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    environment: qa-live-shared
    env:
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_target.outputs.revision }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"

      - &release_qa_required_credentials_step
        name: Validate required QA credential env
        env:
          OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
          OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
        shell: bash
        run: |
          set -euo pipefail

          require_var() {
            local key="$1"
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required ${key}." >&2
              exit 1
            fi
          }

          require_var OPENCLAW_QA_CONVEX_SITE_URL
          require_var OPENCLAW_QA_CONVEX_SECRET_CI

      - name: Build private QA runtime
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build qaRuntime

      - name: Run Discord live lane
        id: run_lane
        shell: bash
        env:
          OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
          OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
          OPENCLAW_QA_REDACT_PUBLIC_METADATA: "1"
        run: |
