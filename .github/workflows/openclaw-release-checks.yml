name: OpenClaw Release Checks

run-name: ${{ inputs.dispatch_id != '' && format('OpenClaw Release Checks {0}', inputs.dispatch_id) || 'OpenClaw Release Checks' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or full commit SHA to validate
        required: true
        type: string
      target_context_ref:
        description: Optional canonical release branch or tag context for an exact-SHA target
        required: false
        default: ""
        type: string
      expected_sha:
        description: Optional full SHA that ref must resolve to
        required: false
        default: ""
        type: string
      provider:
        description: Provider lane for cross-OS onboarding and the end-to-end agent turn
        required: false
        default: openai
        type: choice
        options:
          - openai
          - anthropic
          - minimax
      mode:
        description: Which cross-OS release lanes to run
        required: false
        default: both
        type: choice
        options:
          - fresh
          - upgrade
          - both
      release_profile:
        description: Release coverage profile for live/Docker/provider breadth
        required: false
        default: stable
        type: choice
        options:
          - beta
          - stable
          - full
      run_release_soak:
        description: Run exhaustive live/Docker and upgrade-survivor soak lanes; forced on for release_profile=stable and full
        required: false
        default: false
        type: boolean
      fail_fast:
        description: Stop the Matrix QA lane after its first failed check or scenario
        required: false
        default: false
        type: boolean
      run_maturity_scorecard:
        description: Render advisory maturity scorecard release docs; default release checks rely on dedicated package, QA, live, and E2E gates
        required: false
        default: false
        type: boolean
      allow_unreleased_changelog:
        description: Allow explicitly opted-in current-tree packaging to use Unreleased notes
        required: false
        default: false
        type: boolean
      skip_package_telegram_e2e:
        description: Defer beta Package Acceptance Telegram E2E; automatic for all-group beta checks without release soak
        required: false
        default: false
        type: boolean
      telegram_waiver:
        description: Explicit owner-approved Telegram integration waiver for stable 2026.8.1 only
        required: false
        default: ""
        type: string
      allow_frozen_target_scenario_omissions:
        description: Allow trusted compatibility filtering for a canonical frozen release target
        required: false
        default: false
        type: boolean
      rerun_group:
        description: Release check group to run
        required: false
        default: all
        type: choice
        options:
          - all
          - install-smoke
          - cross-os
          - live-e2e
          - package
          - qa
          - qa-parity
          - qa-live
      phase:
        description: Release check phase to run
        required: false
        default: all
        type: choice
        options:
          - all
          - independent
          - candidate
      live_suite_filter:
        description: Optional exact live/E2E suite id, or comma-separated QA live lane ids (qa-live-matrix, qa-live-buzz, qa-live-telegram, qa-live-discord, qa-live-whatsapp, qa-live-slack); blank runs all selected live suites
        required: false
        default: ""
        type: string
      cross_os_suite_filter:
        description: Optional focused cross-OS suite filter, e.g. windows/packaged-upgrade or packaged-fresh
        required: false
        default: ""
        type: string
      release_package_spec:
        description: Optional published package spec for release checks; blank builds the selected SHA package artifact
        required: false
        default: ""
        type: string
      package_acceptance_package_spec:
        description: Optional published package spec for Package Acceptance; blank uses the prepared release artifact
        required: false
        default: ""
        type: string
      codex_plugin_spec:
        description: Optional Codex plugin install spec for live Docker package checks; blank derives from release_package_spec or packs the selected ref
        required: false
        default: ""
        type: string
      dispatch_id:
        description: Optional parent workflow dispatch identifier
        required: false
        default: ""
        type: string
      candidate_artifact_json:
        description: Immutable package and Docker image artifact tuple from Full Release Validation
        required: false
        default: ""
        type: string

concurrency:
  # Keep independent parent coverage independent through child admission too.
  group: openclaw-release-checks-${{ inputs.expected_sha || inputs.ref }}-${{ github.sha }}-${{ inputs.rerun_group }}-${{ inputs.phase }}-${{ inputs.release_profile == 'minimum' && 'beta' || inputs.release_profile }}-${{ inputs.run_release_soak || inputs.release_profile == 'stable' || inputs.release_profile == 'full' }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/tideclaw/alpha/') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  OPENCLAW_CI_OPENAI_MODEL: ${{ vars.OPENCLAW_CI_OPENAI_MODEL || 'openai/gpt-5.6-luna' }}

jobs:
  resolve_target:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.inputs.outputs.ref }}
      revision: ${{ steps.ref.outputs.sha }}
      provider: ${{ steps.inputs.outputs.provider }}
      mode: ${{ steps.inputs.outputs.mode }}
      release_profile: ${{ steps.inputs.outputs.release_profile }}
      run_release_soak: ${{ steps.inputs.outputs.run_release_soak }}
      phase: ${{ steps.inputs.outputs.phase }}
      qa_live_scheduled: ${{ steps.inputs.outputs.qa_live_scheduled }}
      release_check_groups_json: ${{ steps.inputs.outputs.release_check_groups_json }}
      package_required: ${{ steps.inputs.outputs.package_required }}
      docker_required: ${{ steps.inputs.outputs.docker_required }}
      install_smoke_scheduled: ${{ steps.inputs.outputs.install_smoke_scheduled }}
      frozen_upgrade_baseline: ${{ steps.frozen_upgrade_baseline.outputs.value }}
      fail_fast: ${{ steps.inputs.outputs.fail_fast }}
      run_maturity_scorecard: ${{ steps.inputs.outputs.run_maturity_scorecard }}
      allow_unreleased_changelog: ${{ steps.inputs.outputs.allow_unreleased_changelog }}
      skip_package_telegram_e2e: ${{ steps.inputs.outputs.skip_package_telegram_e2e }}
      telegram_waiver: ${{ steps.inputs.outputs.telegram_waiver }}
      trusted_qa_tooling_eligible: ${{ steps.trusted_qa_tooling.outputs.eligible }}
      rerun_group: ${{ steps.inputs.outputs.rerun_group }}
      live_suite_filter: ${{ steps.inputs.outputs.live_suite_filter }}
      repo_live_suite_filter: ${{ steps.inputs.outputs.repo_live_suite_filter }}
      cross_os_suite_filter: ${{ steps.inputs.outputs.cross_os_suite_filter }}
      qa_live_matrix_enabled: ${{ steps.inputs.outputs.qa_live_matrix_enabled }}
      qa_live_buzz_enabled: ${{ steps.inputs.outputs.qa_live_buzz_enabled }}
      qa_live_telegram_enabled: ${{ steps.inputs.outputs.qa_live_telegram_enabled }}
      qa_live_discord_enabled: ${{ steps.inputs.outputs.qa_live_discord_enabled }}
      qa_live_whatsapp_enabled: ${{ steps.inputs.outputs.qa_live_whatsapp_enabled }}
      qa_live_slack_enabled: ${{ steps.inputs.outputs.qa_live_slack_enabled }}
      package_mode: ${{ steps.inputs.outputs.package_mode }}
      candidate_artifact_json: ${{ steps.inputs.outputs.candidate_artifact_json }}
      release_package_spec: ${{ steps.inputs.outputs.release_package_spec }}
      package_acceptance_package_spec: ${{ steps.inputs.outputs.package_acceptance_package_spec }}
      codex_plugin_spec: ${{ steps.inputs.outputs.codex_plugin_spec }}
      cross_os_scheduled: ${{ steps.inputs.outputs.cross_os_scheduled }}
      live_e2e_scheduled: ${{ steps.inputs.outputs.live_e2e_scheduled }}
      package_acceptance_scheduled: ${{ steps.inputs.outputs.package_acceptance_scheduled }}
      qa_parity_scheduled: ${{ steps.inputs.outputs.qa_parity_scheduled }}
    steps:
      - name: Require trusted workflow ref for release checks
        env:
          RELEASE_REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tideclaw_alpha_check=false
          if [[ "${WORKFLOW_REF}" =~ ^refs/heads/tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            workflow_branch="${WORKFLOW_REF#refs/heads/}"
            if [[ "${RELEASE_REF}" == *"-alpha."* || "${RELEASE_REF}" =~ ^[0-9a-fA-F]{40}$ || "${RELEASE_REF}" == "${workflow_branch}" || "${RELEASE_REF}" == "refs/heads/${workflow_branch}" ]]; then
              tideclaw_alpha_check=true
            fi
          fi
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]] && [[ ! "${WORKFLOW_REF}" =~ ^refs/heads/release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]] && [[ ! "${WORKFLOW_REF}" =~ ^refs/heads/release-ci/[0-9a-f]{12}-[0-9]+$ ]] && [[ ! "${WORKFLOW_REF}" =~ ^refs/heads/extended-stable/[0-9]{4}\.([1-9]|1[0-2])\.33$ ]] && [[ "${tideclaw_alpha_check}" != "true" ]]; then
            echo "Release checks must be dispatched from main, release/YYYY.M.PATCH, extended-stable/YYYY.M.33, a Full Release Validation release-ci/<sha>-<timestamp> ref, or a Tideclaw alpha branch for alpha prereleases." >&2
            exit 1
          fi

      - name: Validate ref input
        env:
          RELEASE_REF: ${{ inputs.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_REF// }" ]] || [[ "${RELEASE_REF}" == -* ]]; then
            echo "Expected a branch, tag, or full commit SHA; got: ${RELEASE_REF}" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_SHA// }" ]] && [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected expected_sha to be a full commit SHA; got: ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Validate trusted QA tooling context
        id: trusted_qa_context
        if: inputs.target_context_ref != ''
        env:
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          normalized_context_ref="$TARGET_CONTEXT_REF"
          case "$normalized_context_ref" in
            refs/heads/*) normalized_context_ref="${normalized_context_ref#refs/heads/}" ;;
            refs/tags/*) normalized_context_ref="${normalized_context_ref#refs/tags/}" ;;
          esac
          if [[ "$normalized_context_ref" =~ ^(release/[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*(-[1-9][0-9]*)?|extended-stable/[0-9]{4}\.([1-9]|1[0-2])\.33)$ ]]; then
            context_kind=branch
            fetch_ref="refs/heads/${normalized_context_ref}"
          elif [[ "$normalized_context_ref" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*((-(alpha|beta)\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            context_kind=tag
            fetch_ref="refs/tags/${normalized_context_ref}"
          else
            echo "target_context_ref must be a canonical OpenClaw release branch or tag." >&2
            exit 1
          fi
          if [[ ! "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_context_ref requires ref to be a full 40-character commit SHA." >&2
            exit 1
          fi
          echo "normalized_ref=${normalized_context_ref}" >> "$GITHUB_OUTPUT"
          echo "context_kind=${context_kind}" >> "$GITHUB_OUTPUT"
          echo "fetch_ref=${fetch_ref}" >> "$GITHUB_OUTPUT"

      - name: Validate trusted QA tooling eligibility
        id: trusted_qa_tooling
        if: steps.trusted_qa_context.outputs.fetch_ref != ''
        env:
          CONTEXT_FETCH_REF: ${{ steps.trusted_qa_context.outputs.fetch_ref }}
          CONTEXT_KIND: ${{ steps.trusted_qa_context.outputs.context_kind }}
          CONTEXT_REF: ${{ steps.trusted_qa_context.outputs.normalized_ref }}
          TARGET_REF: ${{ inputs.ref }}
          TRUSTED_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          context_repo="$(mktemp -d)"
          trap 'rm -rf -- "$context_repo"' EXIT
          git init --bare --quiet "$context_repo"
          if ! GIT_TERMINAL_PROMPT=0 git -C "$context_repo" fetch --quiet --no-tags --filter=blob:none \
            "$TRUSTED_REPOSITORY_URL" "$CONTEXT_FETCH_REF"; then
            echo "Failed to fetch trusted QA tooling context ${CONTEXT_REF}." >&2
            exit 1
          fi
          context_sha="$(git -C "$context_repo" rev-parse --verify 'FETCH_HEAD^{commit}')"
          normalized_context_sha="$(printf '%s' "$context_sha" | tr '[:upper:]' '[:lower:]')"
          normalized_target_sha="$(printf '%s' "$TARGET_REF" | tr '[:upper:]' '[:lower:]')"
          case "$CONTEXT_KIND" in
            tag)
              if [[ "$normalized_context_sha" != "$normalized_target_sha" ]]; then
                echo "Trusted QA tooling tag ${CONTEXT_REF} resolves to ${context_sha} and does not match target ${TARGET_REF}." >&2
                exit 1
              fi
              ;;
            branch)
              if ! git -C "$context_repo" merge-base --is-ancestor "$normalized_target_sha" "$normalized_context_sha" 2>/dev/null; then
                echo "Target ${TARGET_REF} is not reachable from branch ${CONTEXT_REF} at ${context_sha}." >&2
                exit 1
              fi
              ;;
            *)
              echo "Trusted QA tooling context kind is invalid: ${CONTEXT_KIND}." >&2
              exit 1
              ;;
          esac
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: workflow
          fetch-depth: 1

      - name: Fast-resolve selected ref
        id: fast_ref
        env:
          RELEASE_REF: ${{ inputs.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          bash workflow/scripts/github/resolve-openclaw-ref.sh \
            --ref "$RELEASE_REF" \
            --expected-sha "$EXPECTED_SHA" \
            --fallback-ok \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout selected ref for reachability fallback
        if: steps.fast_ref.outputs.fallback == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Resolve checked-out fallback SHA
        if: steps.fast_ref.outputs.fallback == 'true'
        id: fallback_ref
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate selected ref belongs to this repository
        if: steps.fast_ref.outputs.fallback == 'true'
        working-directory: source
        env:
          RELEASE_REF: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SELECTED_SHA="$(git rev-parse HEAD)"
          git_fetch_with_checkout_auth() {
            local -a git_args=(git)
            if ! git config --get-all http.https://github.com/.extraheader >/dev/null; then
              local auth_header
              auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git_args+=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}")
            fi
            timeout --signal=TERM --kill-after=10s 120s "${git_args[@]}" fetch "$@"
          }
          git_fetch_with_checkout_auth --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git_fetch_with_checkout_auth --tags origin '+refs/tags/*:refs/tags/*'

          if git tag --points-at "${SELECTED_SHA}" | grep -Eq '^v'; then
            exit 0
          fi

          if git for-each-ref --format='%(refname:short)' --contains "${SELECTED_SHA}" refs/remotes/origin | grep -Eq '^origin/'; then
            exit 0
          fi

          echo "Ref '${RELEASE_REF}' resolved to ${SELECTED_SHA}, but that commit is not reachable from an OpenClaw branch or release tag." >&2
          echo "Secret-bearing release checks only run repository-owned branch/tag history, not arbitrary unreferenced commits." >&2
          exit 1

      - name: Finalize resolved SHA
        id: ref
        env:
          FAST_SHA: ${{ steps.fast_ref.outputs.sha }}
          FALLBACK_SHA: ${{ steps.fallback_ref.outputs.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          USED_FALLBACK: ${{ steps.fast_ref.outputs.fallback }}
        run: |
          set -euo pipefail
          selected_sha="$FAST_SHA"
          if [[ "$USED_FALLBACK" == "true" ]]; then
            selected_sha="$FALLBACK_SHA"
          fi
          if [[ -z "$selected_sha" ]]; then
            echo "Failed to resolve selected ref SHA." >&2
            exit 1
          fi
          normalized_selected_sha="$(printf '%s' "$selected_sha" | tr '[:upper:]' '[:lower:]')"
          normalized_expected_sha="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${normalized_expected_sha// }" ]] && [[ "$normalized_selected_sha" != "$normalized_expected_sha" ]]; then
            echo "Ref resolved to ${selected_sha}, expected ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "sha=${normalized_selected_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate Tideclaw alpha target matches workflow branch
        if: startsWith(github.ref, 'refs/heads/tideclaw/alpha/')
        working-directory: workflow
        env:
          SELECTED_SHA: ${{ steps.ref.outputs.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${WORKFLOW_REF}" =~ ^refs/heads/tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            echo "Tideclaw alpha release checks must run from tideclaw/alpha/YYYY-MM-DD-HHMMZ." >&2
            exit 1
          fi
          alpha_branch="${WORKFLOW_REF#refs/heads/}"
          git_fetch_with_checkout_auth() {
            local -a git_args=(git)
            if ! git config --get-all http.https://github.com/.extraheader >/dev/null; then
              local auth_header
              auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git_args+=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}")
            fi
            timeout --signal=TERM --kill-after=10s 120s "${git_args[@]}" fetch "$@"
          }
          git_fetch_with_checkout_auth --no-tags origin "+refs/heads/${alpha_branch}:refs/remotes/origin/${alpha_branch}"
          if ! git merge-base --is-ancestor "${SELECTED_SHA}" "refs/remotes/origin/${alpha_branch}"; then
            echo "Alpha release target ${SELECTED_SHA} must be reachable from ${alpha_branch}." >&2
            exit 1
          fi

      - name: Read Telegram waiver target manifest
        if: inputs.telegram_waiver != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          # Admission needs package metadata only; never execute the target here.
          mkdir -p waiver-target
          gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${TARGET_SHA}" --jq .content |
            base64 --decode > waiver-target/package.json

      - name: Capture selected inputs
        id: inputs
        env:
          RELEASE_REF_INPUT: ${{ inputs.ref }}
          RELEASE_PROVIDER_INPUT: ${{ inputs.provider }}
          RELEASE_MODE_INPUT: ${{ inputs.mode }}
          RELEASE_PHASE_INPUT: ${{ inputs.phase }}
          RELEASE_PROFILE_INPUT: ${{ inputs.release_profile }}
          RELEASE_RUN_RELEASE_SOAK_INPUT: ${{ inputs.run_release_soak }}
          RELEASE_FAIL_FAST_INPUT: ${{ inputs.fail_fast }}
          RELEASE_RUN_MATURITY_SCORECARD_INPUT: ${{ inputs.run_maturity_scorecard }}
          RELEASE_ALLOW_UNRELEASED_CHANGELOG_INPUT: ${{ inputs.allow_unreleased_changelog }}
          RELEASE_SKIP_PACKAGE_TELEGRAM_E2E_INPUT: ${{ inputs.skip_package_telegram_e2e }}
          TELEGRAM_WAIVER: ${{ inputs.telegram_waiver }}
          RELEASE_RERUN_GROUP_INPUT: ${{ inputs.rerun_group }}
          RELEASE_LIVE_SUITE_FILTER_INPUT: ${{ inputs.live_suite_filter }}
          RELEASE_CROSS_OS_SUITE_FILTER_INPUT: ${{ inputs.cross_os_suite_filter }}
          RELEASE_QA_DISCORD_LIVE_CI_ENABLED: ${{ vars.OPENCLAW_RELEASE_QA_DISCORD_LIVE_CI_ENABLED || 'false' }}
          RELEASE_QA_WHATSAPP_LIVE_CI_ENABLED: ${{ vars.OPENCLAW_RELEASE_QA_WHATSAPP_LIVE_CI_ENABLED || 'false' }}
          RELEASE_QA_SLACK_LIVE_CI_ENABLED: ${{ vars.OPENCLAW_RELEASE_QA_SLACK_LIVE_CI_ENABLED || 'false' }}
          RELEASE_PACKAGE_SPEC_INPUT: ${{ inputs.release_package_spec }}
          RELEASE_PACKAGE_ACCEPTANCE_PACKAGE_SPEC_INPUT: ${{ inputs.package_acceptance_package_spec }}
          RELEASE_CODEX_PLUGIN_SPEC_INPUT: ${{ inputs.codex_plugin_spec }}
          CANDIDATE_ARTIFACT_JSON_INPUT: ${{ inputs.candidate_artifact_json }}
          RELEASE_FILTER_VALIDATOR: workflow/scripts/github/validate-release-suite-filters.sh
        run: |
          set -euo pipefail
          phase="$RELEASE_PHASE_INPUT"
          case "$phase" in
            all|independent|candidate) ;;
            *)
              echo "phase must be one of: all, independent, candidate" >&2
              exit 1
              ;;
          esac
          candidate_artifact_json=""
          release_package_spec=""
          package_acceptance_package_spec=""
          [[ "$CANDIDATE_ARTIFACT_JSON_INPUT" =~ [^[:space:]] ]] &&
            candidate_artifact_json="$CANDIDATE_ARTIFACT_JSON_INPUT"
          [[ "$RELEASE_PACKAGE_SPEC_INPUT" =~ [^[:space:]] ]] &&
            release_package_spec="$RELEASE_PACKAGE_SPEC_INPUT"
          [[ "$RELEASE_PACKAGE_ACCEPTANCE_PACKAGE_SPEC_INPUT" =~ [^[:space:]] ]] &&
            package_acceptance_package_spec="$RELEASE_PACKAGE_ACCEPTANCE_PACKAGE_SPEC_INPUT"
          if [[ -n "$candidate_artifact_json" && -n "$release_package_spec" ]]; then
            echo "candidate_artifact_json cannot be combined with release_package_spec." >&2
            exit 1
          fi
          package_mode=source
          if [[ -n "$candidate_artifact_json" ]]; then
            package_mode=artifact
          elif [[ -n "$release_package_spec" ]]; then
            package_mode=published
          fi
          qa_live_matrix_enabled=true
          qa_live_buzz_enabled=true
          qa_live_telegram_enabled=true
          qa_live_discord_ci_enabled="$(printf '%s' "$RELEASE_QA_DISCORD_LIVE_CI_ENABLED" | tr '[:upper:]' '[:lower:]')"
          if [[ "$qa_live_discord_ci_enabled" != "true" && "$qa_live_discord_ci_enabled" != "1" && "$qa_live_discord_ci_enabled" != "yes" ]]; then
            qa_live_discord_ci_enabled=false
          else
            qa_live_discord_ci_enabled=true
          fi
          qa_live_whatsapp_ci_enabled="$(printf '%s' "$RELEASE_QA_WHATSAPP_LIVE_CI_ENABLED" | tr '[:upper:]' '[:lower:]')"
          if [[ "$qa_live_whatsapp_ci_enabled" != "true" && "$qa_live_whatsapp_ci_enabled" != "1" && "$qa_live_whatsapp_ci_enabled" != "yes" ]]; then
            qa_live_whatsapp_ci_enabled=false
          else
            qa_live_whatsapp_ci_enabled=true
          fi
          qa_live_slack_ci_enabled="$(printf '%s' "$RELEASE_QA_SLACK_LIVE_CI_ENABLED" | tr '[:upper:]' '[:lower:]')"
          if [[ "$qa_live_slack_ci_enabled" != "true" && "$qa_live_slack_ci_enabled" != "1" && "$qa_live_slack_ci_enabled" != "yes" ]]; then
            qa_live_slack_ci_enabled=false
          else
            qa_live_slack_ci_enabled=true
          fi
          qa_live_discord_enabled="$qa_live_discord_ci_enabled"
          qa_live_whatsapp_enabled="$qa_live_whatsapp_ci_enabled"
          qa_live_slack_enabled="$qa_live_slack_ci_enabled"
          run_release_soak="$(printf '%s' "$RELEASE_RUN_RELEASE_SOAK_INPUT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$run_release_soak" != "true" && "$run_release_soak" != "1" && "$run_release_soak" != "yes" ]]; then
            run_release_soak=false
          else
            run_release_soak=true
          fi
          fail_fast="$(printf '%s' "$RELEASE_FAIL_FAST_INPUT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$fail_fast" != "true" && "$fail_fast" != "1" && "$fail_fast" != "yes" ]]; then
            fail_fast=false
          else
            fail_fast=true
          fi
          run_maturity_scorecard="$(printf '%s' "$RELEASE_RUN_MATURITY_SCORECARD_INPUT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$run_maturity_scorecard" != "true" && "$run_maturity_scorecard" != "1" && "$run_maturity_scorecard" != "yes" ]]; then
            run_maturity_scorecard=false
          else
            run_maturity_scorecard=true
          fi
          release_profile="$RELEASE_PROFILE_INPUT"
          if [[ "$release_profile" == "minimum" ]]; then
            release_profile=beta
          fi
          case "$release_profile" in
            beta|stable|full) ;;
            *)
              echo "release_profile must be one of: beta, stable, full" >&2
              exit 1
              ;;
          esac
          if [[ "$release_profile" == "stable" || "$release_profile" == "full" ]]; then
            run_release_soak=true
          fi
          allow_unreleased_changelog="$(printf '%s' "$RELEASE_ALLOW_UNRELEASED_CHANGELOG_INPUT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$RELEASE_REF_INPUT" == "main" || "$RELEASE_REF_INPUT" == "refs/heads/main" ]]; then
            allow_unreleased_changelog=true
          elif [[ "$allow_unreleased_changelog" == "true" || "$allow_unreleased_changelog" == "1" || "$allow_unreleased_changelog" == "yes" ]]; then
            allow_unreleased_changelog=true
          elif [[ "$RELEASE_REF_INPUT" =~ ^(refs/heads/)?(release/[0-9]{4}\.[0-9]+\.[0-9]+|extended-stable/[0-9]{4}\.[0-9]+\.33|tideclaw/alpha/) ]] || [[ "$RELEASE_REF_INPUT" =~ ^(refs/tags/)?v[0-9]{4}\.[0-9]+\.[0-9]+ ]]; then
            allow_unreleased_changelog=false
          else
            allow_unreleased_changelog=false
          fi
          skip_package_telegram_e2e="$(printf '%s' "$RELEASE_SKIP_PACKAGE_TELEGRAM_E2E_INPUT" | tr '[:upper:]' '[:lower:]')"
          if [[ "$skip_package_telegram_e2e" != "true" && "$skip_package_telegram_e2e" != "1" && "$skip_package_telegram_e2e" != "yes" ]]; then
            skip_package_telegram_e2e=false
          else
            skip_package_telegram_e2e=true
          fi
          if [[ "$skip_package_telegram_e2e" == "true" && "$release_profile" != "beta" ]]; then
            echo "skip_package_telegram_e2e is allowed only for release_profile=beta." >&2
            exit 1
          fi
          # Advisory Telegram confidence must not delay the bounded beta gate.
          # Soak and explicit package reruns keep their existing Telegram selection.
          if [[ "$release_profile" == "beta" && "$run_release_soak" == "false" &&
                "$RELEASE_RERUN_GROUP_INPUT" == "all" ]]; then
            skip_package_telegram_e2e=true
          fi
          if [[ -n "$TELEGRAM_WAIVER" ]]; then
            TARGET_VERSION="$(jq -er '.version | select(type == "string")' waiver-target/package.json)" \
              RELEASE_PROFILE="$release_profile" node --input-type=module <<'NODE'
          import { normalizeReleaseTelegramWaiver } from './workflow/scripts/full-release-validation-policy.mjs';
          normalizeReleaseTelegramWaiver({
            telegramWaiver: process.env.TELEGRAM_WAIVER,
            targetVersion: process.env.TARGET_VERSION,
            releaseProfile: process.env.RELEASE_PROFILE,
            rerunGroup: process.env.RELEASE_RERUN_GROUP_INPUT,
            liveSuiteFilter: process.env.RELEASE_LIVE_SUITE_FILTER_INPUT,
            releasePackageSpec: process.env.RELEASE_PACKAGE_SPEC_INPUT,
            packageAcceptancePackageSpec: process.env.RELEASE_PACKAGE_ACCEPTANCE_PACKAGE_SPEC_INPUT,
            candidateVersion: process.env.CANDIDATE_ARTIFACT_JSON_INPUT?.trim()
              ? JSON.parse(process.env.CANDIDATE_ARTIFACT_JSON_INPUT).packageVersion : undefined,
          });
          NODE
          fi
          codex_plugin_spec="$RELEASE_CODEX_PLUGIN_SPEC_INPUT"
          if [[ -z "${codex_plugin_spec// }" && "$release_package_spec" =~ ^openclaw@(.+)$ ]]; then
            codex_plugin_spec="npm:@openclaw/codex@${BASH_REMATCH[1]}"
          fi
          source "$RELEASE_FILTER_VALIDATOR"
          validate_release_suite_filters \
            "$RELEASE_RERUN_GROUP_INPUT" \
            "$RELEASE_LIVE_SUITE_FILTER_INPUT" \
            "$RELEASE_CROSS_OS_SUITE_FILTER_INPUT" \
            release-checks
          live_suite_filter="$RELEASE_FILTER_LIVE_SUITE_FILTER"
          cross_os_suite_filter="$RELEASE_FILTER_CROSS_OS_SUITE_FILTER"

          qa_filter_seen="$RELEASE_FILTER_QA_FILTER_SEEN"
          filter="$live_suite_filter"
          repo_live_suite_filter="$RELEASE_FILTER_REPO_LIVE_SUITE_FILTER"
          if [[ -n "$filter" ]]; then
            matrix_selected=false
            buzz_selected=false
            telegram_selected=false
            discord_selected=false
            whatsapp_selected=false
            slack_selected=false
            disabled_required_lanes=()

            IFS=',' read -r -a filter_tokens <<< "$filter"
            for token in "${filter_tokens[@]}"; do
              case "$token" in
                qa-live|qa-live-all|qa-all)
                  qa_filter_seen=true
                  matrix_selected=true
                  buzz_selected=true
                  telegram_selected=true
                  discord_selected="$qa_live_discord_ci_enabled"
                  whatsapp_selected="$qa_live_whatsapp_ci_enabled"
                  slack_selected="$qa_live_slack_ci_enabled"
                  [[ "$qa_live_discord_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-discord")
                  [[ "$qa_live_whatsapp_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-whatsapp")
                  [[ "$qa_live_slack_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-slack")
                  ;;
                qa-live-non-slack|qa-non-slack|non-slack|no-slack|without-slack)
                  qa_filter_seen=true
                  matrix_selected=true
                  buzz_selected=true
                  telegram_selected=true
                  discord_selected="$qa_live_discord_ci_enabled"
                  whatsapp_selected="$qa_live_whatsapp_ci_enabled"
                  [[ "$qa_live_discord_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-discord")
                  [[ "$qa_live_whatsapp_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-whatsapp")
                  ;;
                qa-live-matrix|qa-matrix|matrix)
                  qa_filter_seen=true
                  matrix_selected=true
                  ;;
                qa-live-buzz|qa-buzz|buzz)
                  qa_filter_seen=true
                  buzz_selected=true
                  ;;
                qa-live-telegram|qa-telegram|telegram)
                  qa_filter_seen=true
                  telegram_selected=true
                  ;;
                qa-live-discord|qa-discord|discord)
                  qa_filter_seen=true
                  discord_selected="$qa_live_discord_ci_enabled"
                  [[ "$qa_live_discord_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-discord")
                  ;;
                qa-live-whatsapp|qa-whatsapp|whatsapp)
                  qa_filter_seen=true
                  whatsapp_selected="$qa_live_whatsapp_ci_enabled"
                  [[ "$qa_live_whatsapp_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-whatsapp")
                  ;;
                qa-live-slack|qa-slack|slack)
                  slack_selected="$qa_live_slack_ci_enabled"
                  [[ "$qa_live_slack_ci_enabled" == "true" ]] || disabled_required_lanes+=("qa-live-slack")
                  ;;
                *) ;;
              esac
            done

            if [[ "${#disabled_required_lanes[@]}" -gt 0 ]]; then
              echo "live_suite_filter explicitly requested disabled QA live lane(s): ${disabled_required_lanes[*]}" >&2
              echo "Enable the matching OPENCLAW_RELEASE_QA_*_LIVE_CI_ENABLED repo variable or remove the lane from live_suite_filter." >&2
              exit 1
            fi

            if [[ "$qa_filter_seen" == "true" ]]; then
              qa_live_matrix_enabled="$matrix_selected"
              qa_live_buzz_enabled="$buzz_selected"
              qa_live_telegram_enabled="$telegram_selected"
              qa_live_discord_enabled="$discord_selected"
              qa_live_whatsapp_enabled="$whatsapp_selected"
              qa_live_slack_enabled="$slack_selected"
            fi
          fi

          if [[ -n "$TELEGRAM_WAIVER" ]]; then
            qa_live_telegram_enabled=false
          fi

          release_check_groups=()
          case "$RELEASE_RERUN_GROUP_INPUT" in
            all)
              release_check_groups=(install-smoke cross-os package qa-parity)
              if [[ "$run_release_soak" == "true" ]]; then
                release_check_groups+=(live-e2e)
              fi
              if [[ "$run_release_soak" == "true" || "$qa_filter_seen" == "true" ]]; then
                release_check_groups+=(qa-live)
              fi
              ;;
            qa)
              release_check_groups=(qa-parity qa-live)
              ;;
            install-smoke|cross-os|live-e2e|package|qa-parity|qa-live)
              release_check_groups=("$RELEASE_RERUN_GROUP_INPUT")
              ;;
            *)
              echo "rerun_group must be one of: all, install-smoke, cross-os, live-e2e, package, qa, qa-parity, qa-live" >&2
              exit 1
              ;;
          esac
          release_check_groups_json="$(printf '%s\n' "${release_check_groups[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          group_selected() {
            jq -e --arg group "$1" 'index($group) != null' <<< "$release_check_groups_json" >/dev/null
          }

          install_smoke_scheduled=false
          cross_os_scheduled=false
          live_e2e_scheduled=false
          package_acceptance_scheduled=false
          qa_parity_scheduled=false
          qa_live_scheduled=false
          group_selected install-smoke && install_smoke_scheduled=true
          group_selected cross-os && cross_os_scheduled=true
          group_selected live-e2e && live_e2e_scheduled=true
          group_selected package && package_acceptance_scheduled=true
          group_selected qa-parity && qa_parity_scheduled=true
          group_selected qa-live && qa_live_scheduled=true

          docker_required=false
          if [[ "$live_e2e_scheduled" == "true" && -z "$repo_live_suite_filter" ]]; then
            docker_required=true
          fi
          case "$phase" in
            independent)
              cross_os_scheduled=false
              docker_required=false
              package_acceptance_scheduled=false
              ;;
            candidate)
              install_smoke_scheduled=false
              live_e2e_scheduled=false
              qa_parity_scheduled=false
              qa_live_scheduled=false
              run_maturity_scorecard=false
              ;;
          esac

          package_required=false
          if [[ "$cross_os_scheduled" == "true" ||
                "$package_acceptance_scheduled" == "true" ||
                "$docker_required" == "true" ]]; then
            package_required=true
          fi
          if [[ "$phase" == "candidate" && -z "$candidate_artifact_json" ]]; then
            candidate_artifact_required=false
            if [[ -z "$release_package_spec" ]] &&
              { [[ "$cross_os_scheduled" == "true" ]] ||
                [[ "$docker_required" == "true" ]]; }; then
              candidate_artifact_required=true
            fi
            if [[ "$package_acceptance_scheduled" == "true" &&
                  -z "$release_package_spec" &&
                  -z "$package_acceptance_package_spec" ]]; then
              candidate_artifact_required=true
            fi
            if [[ "$candidate_artifact_required" == "true" ]]; then
              echo "phase=candidate requires candidate_artifact_json unless every selected package path uses a published package spec." >&2
              exit 1
            fi
          fi

          {
            printf 'ref=%s\n' "$RELEASE_REF_INPUT"
            printf 'provider=%s\n' "$RELEASE_PROVIDER_INPUT"
            printf 'mode=%s\n' "$RELEASE_MODE_INPUT"
            printf 'release_profile=%s\n' "$release_profile"
            printf 'run_release_soak=%s\n' "$run_release_soak"
            printf 'phase=%s\n' "$phase"
            printf 'qa_live_scheduled=%s\n' "$qa_live_scheduled"
            printf 'release_check_groups_json=%s\n' "$release_check_groups_json"
            printf 'package_required=%s\n' "$package_required"
            printf 'docker_required=%s\n' "$docker_required"
            printf 'install_smoke_scheduled=%s\n' "$install_smoke_scheduled"
            printf 'fail_fast=%s\n' "$fail_fast"
            printf 'run_maturity_scorecard=%s\n' "$run_maturity_scorecard"
            printf 'allow_unreleased_changelog=%s\n' "$allow_unreleased_changelog"
            printf 'skip_package_telegram_e2e=%s\n' "$skip_package_telegram_e2e"
            printf 'telegram_waiver=%s\n' "$TELEGRAM_WAIVER"
            printf 'rerun_group=%s\n' "$RELEASE_RERUN_GROUP_INPUT"
            printf 'live_suite_filter=%s\n' "$live_suite_filter"
            printf 'repo_live_suite_filter=%s\n' "$repo_live_suite_filter"
            printf 'cross_os_suite_filter=%s\n' "$cross_os_suite_filter"
            printf 'qa_live_matrix_enabled=%s\n' "$qa_live_matrix_enabled"
            printf 'qa_live_buzz_enabled=%s\n' "$qa_live_buzz_enabled"
            printf 'qa_live_telegram_enabled=%s\n' "$qa_live_telegram_enabled"
            printf 'qa_live_discord_enabled=%s\n' "$qa_live_discord_enabled"
            printf 'qa_live_whatsapp_enabled=%s\n' "$qa_live_whatsapp_enabled"
            printf 'qa_live_slack_enabled=%s\n' "$qa_live_slack_enabled"
            printf 'package_mode=%s\n' "$package_mode"
            printf 'candidate_artifact_json=%s\n' "$candidate_artifact_json"
            printf 'release_package_spec=%s\n' "$release_package_spec"
            printf 'package_acceptance_package_spec=%s\n' "$package_acceptance_package_spec"
            printf 'codex_plugin_spec=%s\n' "$codex_plugin_spec"
            printf 'cross_os_scheduled=%s\n' "$cross_os_scheduled"
            printf 'live_e2e_scheduled=%s\n' "$live_e2e_scheduled"
            printf 'package_acceptance_scheduled=%s\n' "$package_acceptance_scheduled"
            printf 'qa_parity_scheduled=%s\n' "$qa_parity_scheduled"
          } >> "$GITHUB_OUTPUT"

      # A frozen extended-stable target must not downgrade from npm latest.
      - name: Resolve frozen upgrade baseline
        id: frozen_upgrade_baseline
        if: >-
          (steps.inputs.outputs.install_smoke_scheduled == 'true' ||
          steps.inputs.outputs.package_acceptance_scheduled == 'true') &&
          (startsWith(inputs.target_context_ref, 'extended-stable/') ||
          startsWith(inputs.target_context_ref, 'refs/heads/extended-stable/'))
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CONTEXT_REF: ${{ inputs.target_context_ref }}
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          candidate_version="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${TARGET_SHA}" --jq .content |
              base64 --decode |
              jq -er '.version | select(type == "string" and length > 0)'
          )"
          baseline="$(node workflow/scripts/lib/release-upgrade-baseline.mjs \
            --candidate-version "$candidate_version" \
            --target-context-ref "$TARGET_CONTEXT_REF")"
          echo "value=${baseline#openclaw@}" >> "$GITHUB_OUTPUT"

      - name: Summarize validated ref
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          RELEASE_REF_FAST_PATH: ${{ steps.fast_ref.outputs.fast }}
          RELEASE_PROVIDER: ${{ inputs.provider }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_PHASE: ${{ steps.inputs.outputs.phase }}
          RELEASE_PROFILE: ${{ steps.inputs.outputs.release_profile }}
          RUN_RELEASE_SOAK: ${{ steps.inputs.outputs.run_release_soak }}
          QA_LIVE_SCHEDULED: ${{ steps.inputs.outputs.qa_live_scheduled }}
          RELEASE_CHECK_GROUPS_JSON: ${{ steps.inputs.outputs.release_check_groups_json }}
          PACKAGE_REQUIRED: ${{ steps.inputs.outputs.package_required }}
          DOCKER_REQUIRED: ${{ steps.inputs.outputs.docker_required }}
          FAIL_FAST: ${{ steps.inputs.outputs.fail_fast }}
          RUN_MATURITY_SCORECARD: ${{ steps.inputs.outputs.run_maturity_scorecard }}
          SKIP_PACKAGE_TELEGRAM_E2E: ${{ steps.inputs.outputs.skip_package_telegram_e2e }}
          TELEGRAM_WAIVER: ${{ steps.inputs.outputs.telegram_waiver }}
          ALLOW_UNRELEASED_CHANGELOG: ${{ steps.inputs.outputs.allow_unreleased_changelog }}
          RELEASE_RERUN_GROUP: ${{ inputs.rerun_group }}
          RELEASE_LIVE_SUITE_FILTER: ${{ inputs.live_suite_filter }}
          RELEASE_CROSS_OS_SUITE_FILTER: ${{ inputs.cross_os_suite_filter }}
          RELEASE_PACKAGE_SPEC: ${{ steps.inputs.outputs.release_package_spec }}
          PACKAGE_ACCEPTANCE_PACKAGE_SPEC: ${{ steps.inputs.outputs.package_acceptance_package_spec }}
          CODEX_PLUGIN_SPEC: ${{ steps.inputs.outputs.codex_plugin_spec }}
        run: |
          {
            echo "## Release checks"
            echo
            echo "- Requested ref: \`${RELEASE_REF}\`"
            echo "- Validated SHA: \`${RELEASE_SHA}\`"
            echo "- Ref resolution fast path: \`${RELEASE_REF_FAST_PATH}\`"
            echo "- Cross-OS provider: \`${RELEASE_PROVIDER}\`"
            echo "- Cross-OS mode: \`${RELEASE_MODE}\`"
            echo "- Phase: \`${RELEASE_PHASE}\`"
            echo "- Release profile: \`${RELEASE_PROFILE}\`"
            echo "- Release soak lanes: \`${RUN_RELEASE_SOAK}\`"
            echo "- Concrete release-check groups: \`${RELEASE_CHECK_GROUPS_JSON}\`"
            echo "- Shared package artifact required: \`${PACKAGE_REQUIRED}\`"
            echo "- Docker release-path prep required: \`${DOCKER_REQUIRED}\`"
            echo "- QA-live scheduled: \`${QA_LIVE_SCHEDULED}\`"
            echo "- Matrix QA fail fast: \`${FAIL_FAST}\`"
            echo "- Maturity scorecard docs: \`${RUN_MATURITY_SCORECARD}\`"
            echo "- Package Acceptance Telegram E2E deferred: \`${SKIP_PACKAGE_TELEGRAM_E2E}\`"
            if [[ "$SKIP_PACKAGE_TELEGRAM_E2E" == "true" ]]; then
              echo "- Package Acceptance Telegram E2E: not run; deferred to postpublish confidence."
            fi
            if [[ -n "$TELEGRAM_WAIVER" ]]; then
              echo "- Source and Package Acceptance Telegram E2E: waived/not run (\`${TELEGRAM_WAIVER}\`); not a pass"
            fi
            echo "- Allow Unreleased changelog packaging: \`${ALLOW_UNRELEASED_CHANGELOG}\`"
            echo "- Rerun group: \`${RELEASE_RERUN_GROUP}\`"
            if [[ -n "${RELEASE_LIVE_SUITE_FILTER// }" ]]; then
              echo "- Live suite filter: \`${RELEASE_LIVE_SUITE_FILTER}\`"
            fi
            if [[ -n "${RELEASE_CROSS_OS_SUITE_FILTER// }" ]]; then
              echo "- Cross-OS suite filter: \`${RELEASE_CROSS_OS_SUITE_FILTER}\`"
            fi
            echo "- QA-live lane eligibility: Matrix \`${{ steps.inputs.outputs.qa_live_matrix_enabled }}\`, Buzz \`${{ steps.inputs.outputs.qa_live_buzz_enabled }}\`, Telegram \`${{ steps.inputs.outputs.qa_live_telegram_enabled }}\`, Discord \`${{ steps.inputs.outputs.qa_live_discord_enabled }}\`, WhatsApp \`${{ steps.inputs.outputs.qa_live_whatsapp_enabled }}\`, Slack \`${{ steps.inputs.outputs.qa_live_slack_enabled }}\`"
            if [[ -n "$RELEASE_PACKAGE_SPEC" ]]; then
              echo "- Release package spec: \`${RELEASE_PACKAGE_SPEC}\`"
            fi
            if [[ -n "$PACKAGE_ACCEPTANCE_PACKAGE_SPEC" ]]; then
              echo "- Package Acceptance package spec: \`${PACKAGE_ACCEPTANCE_PACKAGE_SPEC}\`"
            elif [[ -n "$RELEASE_PACKAGE_SPEC" ]]; then
              echo "- Package Acceptance package spec: \`${RELEASE_PACKAGE_SPEC}\`"
            else
              echo "- Package Acceptance package spec: prepared release artifact"
            fi
            if [[ -n "${CODEX_PLUGIN_SPEC// }" ]]; then
              echo "- Codex plugin spec: \`${CODEX_PLUGIN_SPEC}\`"
            else
              echo "- Codex plugin spec: packed from selected ref"
            fi
            if [[ "$RUN_RELEASE_SOAK" == "true" ]]; then
              echo "- This run will execute blocking release validation plus exhaustive live/Docker soak coverage."
            else
              echo "- This run will execute blocking release validation. Exhaustive live/Docker soak lanes are skipped unless \`run_release_soak=true\`, \`release_profile=full\`, or \`rerun_group=live-e2e\` is selected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  prepare_release_package:
    name: Prepare release package artifact
    needs: [resolve_target]
    if: needs.resolve_target.outputs.package_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      artifact_digest: ${{ steps.release_package_upload.outputs.artifact-digest || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageArtifactDigest }}
      artifact_id: ${{ steps.release_package_upload.outputs.artifact-id || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageArtifactId }}
      artifact_name: ${{ steps.artifact.outputs.name || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageArtifactName }}
      artifact_run_attempt: ${{ steps.artifact.outputs.run_attempt || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageArtifactRunAttempt }}
      artifact_run_id: ${{ steps.artifact.outputs.run_id || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageArtifactRunId }}
      package_file_name: ${{ steps.artifact.outputs.file_name || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageFileName }}
      package_sha256: ${{ steps.package.outputs.sha256 || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageSha256 }}
      package_version: ${{ steps.package.outputs.package_version || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageVersion }}
      prepublish_plugin_registry_json: ${{ steps.registry_identity.outputs.json }}
      source_sha: ${{ steps.package.outputs.source_sha || fromJSON(needs.resolve_target.outputs.candidate_artifact_json || '{}').packageSourceSha }}
    steps:
      - name: Checkout trusted workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # Artifact validation reads the immutable tuple, not source history.
          fetch-depth: ${{ needs.resolve_target.outputs.package_mode == 'artifact' && 1 || 0 }}
          filter: blob:none

      - name: Validate release package source metadata
        if: needs.resolve_target.outputs.package_mode == 'source'
        env:
          ALLOW_UNRELEASED_CHANGELOG: ${{ needs.resolve_target.outputs.allow_unreleased_changelog }}
          PACKAGE_REF: ${{ needs.resolve_target.outputs.revision }}
        run: |
          set -euo pipefail
          args=(--ref "$PACKAGE_REF")
          if [[ "$ALLOW_UNRELEASED_CHANGELOG" == "true" ]]; then
            args+=(--allow-unreleased-changelog)
          fi
          node scripts/package-source-preflight.mjs "${args[@]}"

      - name: Set artifact metadata
        id: artifact
        if: needs.resolve_target.outputs.package_mode != 'artifact'
        run: |
          {
            echo "file_name=openclaw-current.tgz"
            echo "name=release-package-under-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node environment
        if: needs.resolve_target.outputs.package_mode != 'artifact'
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"
          install-deps: "true"

      - name: Resolve release package artifact
        id: package
        if: needs.resolve_target.outputs.package_mode != 'artifact'
        shell: bash
        env:
          CROSS_OS_SCHEDULED: ${{ needs.resolve_target.outputs.cross_os_scheduled }}
          DOCKER_REQUIRED: ${{ needs.resolve_target.outputs.docker_required }}
          PACKAGE_REF: ${{ needs.resolve_target.outputs.revision }}
          PROVIDER: ${{ needs.resolve_target.outputs.provider }}
          PACKAGE_MODE: ${{ needs.resolve_target.outputs.package_mode }}
          RELEASE_PACKAGE_SPEC: ${{ needs.resolve_target.outputs.release_package_spec }}
          RELEASE_PROFILE: ${{ needs.resolve_target.outputs.release_profile }}
        run: |
          set -euo pipefail
          source_args=(--source ref --package-ref "$PACKAGE_REF")
          package_label="ref:${PACKAGE_REF}"
          if [[ "$PACKAGE_MODE" == "published" ]]; then
            source_args=(--source npm --package-spec "$RELEASE_PACKAGE_SPEC" --package-ref "$PACKAGE_REF")
            package_label="$RELEASE_PACKAGE_SPEC"
          fi
          provider_packages='[]'
          if [[ "$CROSS_OS_SCHEDULED" == "true" ]]; then
            provider_packages="$(
              OPENCLAW_RELEASE_CHECKS_SCRIPT=scripts/openclaw-cross-os-release-checks.ts \
                bash scripts/github/run-openclaw-cross-os-release-checks.sh \
                --resolve-provider-required-companion-packages \
                --provider "$PROVIDER"
            )"
          fi
          docker_packages='[]'
          if [[ "$DOCKER_REQUIRED" == "true" && "$PACKAGE_MODE" == "source" ]]; then
            export OPENCLAW_DOCKER_ALL_PROFILE=release-path
            export OPENCLAW_DOCKER_ALL_PLAN_RELEASE_ALL=1
            export OPENCLAW_DOCKER_ALL_INCLUDE_OPENWEBUI="${{ needs.resolve_target.outputs.release_profile != 'beta' }}"
            export OPENCLAW_DOCKER_ALL_RELEASE_PROFILE="$RELEASE_PROFILE"
            docker_packages="$(
              node scripts/test-docker-all.mjs --plan-json |
                jq -c '.requiredPrepublishPluginPackages'
            )"
          fi
          required_packages="$(
            jq -cnr \
              --argjson provider "$provider_packages" \
              --argjson docker "$docker_packages" \
              '$provider + $docker | unique | sort'
          )"
          registry_args=()
          if [[ "$required_packages" != '[]' ]]; then
            registry_args=(
              --plugin-registry-output-dir .artifacts/prepublish-plugin-registry
              --required-plugin-packages-json "$required_packages"
            )
          fi
          node --import tsx scripts/resolve-openclaw-package-candidate.mts \
            "${source_args[@]}" \
            "${registry_args[@]}" \
            --output-dir .artifacts/docker-e2e-package \
            --output-name openclaw-current.tgz \
            --metadata .artifacts/docker-e2e-package/package-candidate.json \
            --github-output "$GITHUB_OUTPUT"
          digest="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/docker-e2e-package/package-candidate.json', 'utf8')).sha256")"
          version="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/docker-e2e-package/package-candidate.json', 'utf8')).version")"
          source_sha="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/docker-e2e-package/package-candidate.json', 'utf8')).packageSourceSha")"
          plugin_registry_manifest_sha256="$(node -p "JSON.parse(require('fs').readFileSync('.artifacts/docker-e2e-package/package-candidate.json', 'utf8')).pluginRegistryManifestSha256 || ''")"
          if [[ "$source_sha" != "$PACKAGE_REF" ]]; then
            echo "Release package source SHA differs from the selected release SHA: expected $PACKAGE_REF, found ${source_sha:-<missing>}." >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "plugin_registry_manifest_sha256=$plugin_registry_manifest_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "## Release package artifact"
            echo
            echo "- Artifact: \`${{ steps.artifact.outputs.name }}\`"
            echo "- Package: \`$package_label\`"
            echo "- SHA-256: \`$digest\`"
            echo "- Version: \`$version\`"
            echo "- Source SHA: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release package artifact
        id: release_package_upload
        if: needs.resolve_target.outputs.package_mode != 'artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            .artifacts/docker-e2e-package/${{ steps.artifact.outputs.file_name }}
            .artifacts/docker-e2e-package/package-candidate.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload shared prerelease plugin registry artifact
        id: prepublish_plugin_registry_upload
        if: needs.resolve_target.outputs.package_mode != 'artifact' && steps.package.outputs.plugin_registry_manifest_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-e2e-prepublish-plugin-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/prepublish-plugin-registry/
          retention-days: 14
          if-no-files-found: error

      - name: Validate release package artifact binding
        if: needs.resolve_target.outputs.package_mode != 'artifact'
        env:
          ARTIFACT_DIGEST: ${{ steps.release_package_upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.release_package_upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_RUN_ATTEMPT: ${{ steps.artifact.outputs.run_attempt }}
          ARTIFACT_RUN_ID: ${{ steps.artifact.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE_NAME: ${{ steps.artifact.outputs.file_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          PACKAGE_SOURCE_SHA: ${{ steps.package.outputs.source_sha }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_FILE_NAME" == "openclaw-current.tgz" ]] || {
            echo "Release package tarball filename is invalid." >&2
            exit 1
          }
          [[ "$PACKAGE_SHA256" =~ ^[a-f0-9]{64}$ &&
            "$PACKAGE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ &&
            -n "${PACKAGE_VERSION// }" ]] || {
            echo "Release package identity is incomplete." >&2
            exit 1
          }
          bash scripts/docker/shared-image-artifact.sh \
            verify-upload "Release package" \
            "$ARTIFACT_ID" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" \
            "$ARTIFACT_RUN_ID" "$ARTIFACT_RUN_ATTEMPT"

      - name: Validate shared prerelease plugin registry binding
        if: needs.resolve_target.outputs.package_mode != 'artifact' && steps.package.outputs.plugin_registry_manifest_sha256 != ''
        env:
          ARTIFACT_DIGEST: ${{ steps.prepublish_plugin_registry_upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.prepublish_plugin_registry_upload.outputs.artifact-id }}
          ARTIFACT_NAME: docker-e2e-prepublish-plugin-registry-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ steps.package.outputs.plugin_registry_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
            echo "Shared prerelease plugin registry manifest identity is incomplete." >&2
            exit 1
          }
          bash scripts/docker/shared-image-artifact.sh \
            verify-upload "Prerelease plugin registry" \
            "$ARTIFACT_ID" "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" \
            "$ARTIFACT_RUN_ID" "$ARTIFACT_RUN_ATTEMPT"

      - name: Validate shared release candidate identity
        if: needs.resolve_target.outputs.package_mode == 'artifact'
        env:
          CANDIDATE_ARTIFACT_JSON: ${{ needs.resolve_target.outputs.candidate_artifact_json }}
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ needs.resolve_target.outputs.revision }}
        run: |
          set -euo pipefail
          jq -e \
            --arg sha "$SELECTED_SHA" \
            'def digits: test("^[1-9][0-9]*$");
             def hex40: test("^[a-f0-9]{40}$");
             def hex64: test("^[a-f0-9]{64}$");
             (.packageArtifactName | type == "string" and length > 0) and
             (.packageArtifactId | tostring | digits) and
             (.packageArtifactDigest | hex64) and
             (.packageArtifactRunId | tostring | digits) and
             (.packageArtifactRunAttempt | tostring | digits) and
             (.packageFileName | test("^[A-Za-z0-9][A-Za-z0-9._-]*\\.tgz$")) and
             (.packageSourceSha | hex40) and
             .packageSourceSha == $sha and
             (.packageSha256 | hex64) and
             (.packageVersion | type == "string" and length > 0) and
             (.imageArtifactName | type == "string" and length > 0) and
             (.imageArtifactId | tostring | digits) and
             (.imageArtifactDigest | hex64) and
             (.imageArtifactRunId | tostring | digits) and
             (.imageArtifactRunAttempt | tostring | digits) and
             (.imageArchiveSha256 | hex64) and
             (
               (
                 (has("prepublishPluginRegistryArtifactName") | not) and
                 (has("prepublishPluginRegistryArtifactId") | not) and
                 (has("prepublishPluginRegistryArtifactDigest") | not) and
                 (has("prepublishPluginRegistryArtifactRunId") | not) and
                 (has("prepublishPluginRegistryArtifactRunAttempt") | not) and
                 (has("prepublishPluginRegistryManifestSha256") | not)
               ) or
               (
                 (.prepublishPluginRegistryArtifactName | type == "string" and length > 0) and
                 (.prepublishPluginRegistryArtifactId | type == "string" and digits) and
                 (.prepublishPluginRegistryArtifactDigest | hex64) and
                 (.prepublishPluginRegistryArtifactRunId | type == "string" and digits) and
                 (.prepublishPluginRegistryArtifactRunAttempt | type == "string" and digits) and
                 (.prepublishPluginRegistryManifestSha256 | hex64) and
                 .prepublishPluginRegistryArtifactName ==
                   ("docker-e2e-prepublish-plugin-registry-" +
                     (.prepublishPluginRegistryArtifactRunId | tostring) + "-" +
                     (.prepublishPluginRegistryArtifactRunAttempt | tostring))
               )
             )' \
            <<< "$CANDIDATE_ARTIFACT_JSON" >/dev/null
          bash scripts/docker/shared-image-artifact.sh \
            verify-upload "Release package" \
            "$(jq -r '.packageArtifactId' <<< "$CANDIDATE_ARTIFACT_JSON")" \
            "$(jq -r '.packageArtifactName' <<< "$CANDIDATE_ARTIFACT_JSON")" \
            "$(jq -r '.packageArtifactDigest' <<< "$CANDIDATE_ARTIFACT_JSON")" \
            "$(jq -r '.packageArtifactRunId' <<< "$CANDIDATE_ARTIFACT_JSON")" \
            "$(jq -r '.packageArtifactRunAttempt' <<< "$CANDIDATE_ARTIFACT_JSON")"
          if jq -e 'has("prepublishPluginRegistryArtifactId")' \
            <<< "$CANDIDATE_ARTIFACT_JSON" >/dev/null; then
            bash scripts/docker/shared-image-artifact.sh \
              verify-upload "Prerelease plugin registry" \
              "$(jq -r '.prepublishPluginRegistryArtifactId' <<< "$CANDIDATE_ARTIFACT_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactName' <<< "$CANDIDATE_ARTIFACT_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactDigest' <<< "$CANDIDATE_ARTIFACT_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactRunId' <<< "$CANDIDATE_ARTIFACT_JSON")" \
              "$(jq -r '.prepublishPluginRegistryArtifactRunAttempt' <<< "$CANDIDATE_ARTIFACT_JSON")"
          fi

      - name: Prepare prerelease plugin registry identity
        id: registry_identity
        env:
          CANDIDATE_ARTIFACT_JSON: ${{ needs.resolve_target.outputs.candidate_artifact_json }}
          GENERATED_ARTIFACT_DIGEST: ${{ steps.prepublish_plugin_registry_upload.outputs.artifact-digest }}
          GENERATED_ARTIFACT_ID: ${{ steps.prepublish_plugin_registry_upload.outputs.artifact-id }}
          GENERATED_MANIFEST_SHA256: ${{ steps.package.outputs.plugin_registry_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$GENERATED_ARTIFACT_ID" ]]; then
            jq -cnr \
              --arg digest "$GENERATED_ARTIFACT_DIGEST" \
              --arg id "$GENERATED_ARTIFACT_ID" \
              --arg manifest "$GENERATED_MANIFEST_SHA256" \
              --arg name "docker-e2e-prepublish-plugin-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg attempt "$GITHUB_RUN_ATTEMPT" \
              --arg run "$GITHUB_RUN_ID" \
              '{
                prepublishPluginRegistryArtifactName: $name,
                prepublishPluginRegistryArtifactId: $id,
                prepublishPluginRegistryArtifactDigest: $digest,
                prepublishPluginRegistryArtifactRunId: $run,
                prepublishPluginRegistryArtifactRunAttempt: $attempt,
                prepublishPluginRegistryManifestSha256: $manifest
              } | "json=\(.)"' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$CANDIDATE_ARTIFACT_JSON" ]] &&
            jq -e 'has("prepublishPluginRegistryArtifactId")' \
              <<< "$CANDIDATE_ARTIFACT_JSON" >/dev/null; then
            jq -cr '{
              prepublishPluginRegistryArtifactName,
              prepublishPluginRegistryArtifactId,
              prepublishPluginRegistryArtifactDigest,
              prepublishPluginRegistryArtifactRunId,
              prepublishPluginRegistryArtifactRunAttempt,
              prepublishPluginRegistryManifestSha256
            } | "json=\(.)"' <<< "$CANDIDATE_ARTIFACT_JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "json=" >> "$GITHUB_OUTPUT"

  install_smoke_release_checks:
    needs: [resolve_target]
    if: needs.resolve_target.outputs.install_smoke_scheduled == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/install-smoke-reusable.yml
    with:
      allow_frozen_target_scenario_omissions: ${{ inputs.allow_frozen_target_scenario_omissions }}
      allow_unreleased_changelog: ${{ needs.resolve_target.outputs.allow_unreleased_changelog == 'true' }}
      ref: ${{ needs.resolve_target.outputs.revision }}
      run_bun_global_install_smoke: true
      update_baseline_version: ${{ needs.resolve_target.outputs.frozen_upgrade_baseline || 'latest' }}

  cross_os_release_checks:
    needs: [resolve_target, prepare_release_package]
    if: needs.resolve_target.outputs.cross_os_scheduled == 'true'
    permissions: read-all
    uses: ./.github/workflows/openclaw-cross-os-release-checks-reusable.yml
    with:
      advisory: ${{ startsWith(github.ref, 'refs/heads/tideclaw/alpha/') }}
      ref: ${{ needs.resolve_target.outputs.revision }}
      target_context_ref: ${{ inputs.target_context_ref }}
      provider: ${{ needs.resolve_target.outputs.provider }}
      mode: ${{ needs.resolve_target.outputs.mode }}
      suite_filter: ${{ needs.resolve_target.outputs.cross_os_suite_filter }}
      candidate_artifact_digest: ${{ needs.prepare_release_package.outputs.artifact_digest }}
      candidate_artifact_id: ${{ needs.prepare_release_package.outputs.artifact_id }}
      candidate_artifact_name: ${{ needs.prepare_release_package.outputs.artifact_name }}
      candidate_artifact_run_attempt: ${{ needs.prepare_release_package.outputs.artifact_run_attempt }}
      candidate_artifact_run_id: ${{ needs.prepare_release_package.outputs.artifact_run_id }}
      candidate_file_name: ${{ needs.prepare_release_package.outputs.package_file_name }}
      candidate_sha256: ${{ needs.prepare_release_package.outputs.package_sha256 }}
      candidate_version: ${{ needs.prepare_release_package.outputs.package_version }}
      candidate_source_sha: ${{ needs.prepare_release_package.outputs.source_sha }}
      prepublish_plugin_registry_json: ${{ needs.prepare_release_package.outputs.prepublish_plugin_registry_json }}
      openai_model: openai/gpt-5.6-luna
      ubuntu_runner: ubuntu-24.04
      windows_runner: windows-2025
      macos_runner: macos-26
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      OPENCLAW_DISCORD_SMOKE_BOT_TOKEN: ${{ secrets.OPENCLAW_DISCORD_SMOKE_BOT_TOKEN }}
      OPENCLAW_DISCORD_SMOKE_GUILD_ID: ${{ secrets.OPENCLAW_DISCORD_SMOKE_GUILD_ID }}
      OPENCLAW_DISCORD_SMOKE_CHANNEL_ID: ${{ secrets.OPENCLAW_DISCORD_SMOKE_CHANNEL_ID }}

  live_repo_e2e_release_checks:
    name: Run repo/live E2E validation
    needs: [resolve_target]
    if: needs.resolve_target.outputs.live_e2e_scheduled == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/openclaw-live-and-e2e-checks-reusable.yml
    with:
      advisory: ${{ startsWith(github.ref, 'refs/heads/tideclaw/alpha/') }}
      allow_frozen_target_scenario_omissions: ${{ inputs.allow_frozen_target_scenario_omissions }}
      allow_unreleased_changelog: ${{ needs.resolve_target.outputs.allow_unreleased_changelog == 'true' }}
      # Live-provider suites depend on third-party model deployments; beta
      # treats only those as advisory while repo E2E stays blocking and
      # stable/full keep everything blocking.
      live_advisory: ${{ needs.resolve_target.outputs.release_profile == 'beta' }}
      ref: ${{ needs.resolve_target.outputs.revision }}
      include_repo_e2e: true
      include_release_path_suites: false
      include_openwebui: false
      include_live_suites: true
      release_test_profile: ${{ needs.resolve_target.outputs.release_profile }}
      live_suite_filter: ${{ needs.resolve_target.outputs.repo_live_suite_filter }}
      shared_image_artifact_namespace: release-live
      shared_image_policy: no-push-artifact
    secrets: &live_e2e_release_secrets
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_API_KEY_OLD: ${{ secrets.ANTHROPIC_API_KEY_OLD }}
      ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
