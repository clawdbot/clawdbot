name: Plugin ClawHub Release

on:
  workflow_dispatch:
    inputs:
      publish_scope:
        description: Publish the selected plugins or all ClawHub-publishable plugins from the workflow ref
        required: true
        default: selected
        type: choice
        options:
          - selected
          - all-publishable
      plugins:
        description: Comma-separated plugin package names to publish when publish_scope=selected
        required: false
        type: string
      ref:
        description: Exact target SHA for protected-tooling release publication, or a dry-run target ref
        required: false
        default: ""
        type: string
      release_tag:
        description: Exact release tag that must peel to ref for protected-tooling publication
        required: false
        default: ""
        type: string
      release_publish_run_id:
        description: Approved OpenClaw Release Publish workflow run id
        required: false
        type: string
      release_publish_run_attempt:
        description: Exact approving OpenClaw Release Publish workflow run attempt
        required: false
        default: ""
        type: string
      release_publish_branch:
        description: Branch name of the approving OpenClaw Release Publish workflow run
        required: false
        type: string
      release_publish_full_ref:
        description: Full ref of the approving OpenClaw Release Publish workflow run
        required: false
        default: ""
        type: string
      release_publish_workflow_sha:
        description: Exact SHA of the approving OpenClaw Release Publish workflow run
        required: false
        default: ""
        type: string
      dry_run:
        description: Validate the full ClawHub artifact handoff without publishing.
        required: false
        default: false
        type: boolean

concurrency:
  # Validation gets its own slot; real publication remains serialized by target.
  group: plugin-clawhub-release-${{ inputs.dry_run && format('dry-run-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  CLAWHUB_REGISTRY: "https://clawhub.ai"
  CLAWHUB_CLI_PACKAGE: "clawhub@0.23.3"

jobs:
  preview_plugins_clawhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref_revision: ${{ steps.ref.outputs.sha }}
      has_candidates: ${{ steps.plan.outputs.has_candidates }}
      has_bootstrap_candidates: ${{ steps.plan.outputs.has_bootstrap_candidates }}
      has_missing_trusted_publisher: ${{ steps.plan.outputs.has_missing_trusted_publisher }}
      candidate_count: ${{ steps.plan.outputs.candidate_count }}
      bootstrap_candidate_count: ${{ steps.plan.outputs.bootstrap_candidate_count }}
      missing_trusted_publisher_count: ${{ steps.plan.outputs.missing_trusted_publisher_count }}
      skipped_published_count: ${{ steps.plan.outputs.skipped_published_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      bootstrap_matrix: ${{ steps.plan.outputs.bootstrap_matrix }}
      missing_trusted_publisher_matrix: ${{ steps.plan.outputs.missing_trusted_publisher_matrix }}
    steps:
      - name: Prepare Git owner
        uses: openclaw/openclaw/.github/actions/git-owner@dd4528b6393e7d00063067a080ca7241b48ce475

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0
          filter: blob:none

      - name: Resolve checked-out ref
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          import re
          import subprocess
          import sys

          from ci_git_owner import GitFailure, git_output, run_git

          workspace = os.environ["GITHUB_WORKSPACE"]
          release_tag = os.environ["RELEASE_TAG"]
          target_ref = os.environ["TARGET_REF"]

          def resolve(ref):
              try:
                  run_git(
                      workspace,
                      "rev-parse",
                      "--verify",
                      "--quiet",
                      ref,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
              except GitFailure:
                  return None
              return git_output(workspace, "rev-parse", ref).rstrip("\n")

          run_git(
              workspace,
              "fetch",
              "--no-tags",
              "origin",
              "+refs/heads/main:refs/remotes/origin/main",
              "+refs/heads/release/*:refs/remotes/origin/release/*",
              timeout=120,
              reclaim_locks=True,
          )
          if release_tag:
              if not re.fullmatch(
                  r"v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-(alpha|beta)\.[1-9][0-9]*)|(-[1-9][0-9]*))?",
                  release_tag,
              ):
                  print(f"Invalid ClawHub release tag: {release_tag}", file=sys.stderr)
                  raise SystemExit(1)
              run_git(
                  workspace,
                  "fetch",
                  "--no-tags",
                  "origin",
                  f"+refs/tags/{release_tag}:refs/tags/{release_tag}",
                  timeout=120,
                  reclaim_locks=True,
              )
          if target_ref:
              target_sha = resolve(f"{target_ref}^{{commit}}")
              if target_sha is None:
                  target_sha = resolve(f"origin/{target_ref}^{{commit}}")
              if target_sha is None:
                  print(f"Unable to resolve requested publish ref: {target_ref}", file=sys.stderr)
                  raise SystemExit(1)
              run_git(workspace, "checkout", "--detach", target_sha)
          head_sha = git_output(workspace, "rev-parse", "HEAD").rstrip("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={head_sha}\n")
          PYTHON

      - name: Validate OIDC source matches workflow ref
        env:
          TARGET_SHA: ${{ steps.ref.outputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PUBLISH_RUN_ID: ${{ inputs.release_publish_run_id }}
          RELEASE_PUBLISH_RUN_ATTEMPT: ${{ inputs.release_publish_run_attempt }}
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          import re
          import sys

          from ci_git_owner import GitFailure, git_output

          target_sha = os.environ["TARGET_SHA"]
          workflow_sha = os.environ["WORKFLOW_SHA"]
          if target_sha == workflow_sha:
              raise SystemExit(0)
          if os.environ["DRY_RUN"] == "true":
              print("Dry-run publish target differs from workflow ref; allowing validation-only dispatch.")
              raise SystemExit(0)
          workflow_ref = os.environ["WORKFLOW_REF"]
          release_tag = os.environ["RELEASE_TAG"]
          protected = (
              re.fullmatch(r"refs/tags/release-publish/[a-f0-9]{12}-[1-9][0-9]*", workflow_ref)
              and os.environ["RELEASE_PUBLISH_RUN_ID"].strip()
              and re.fullmatch(r"[1-9][0-9]*", os.environ["RELEASE_PUBLISH_RUN_ATTEMPT"])
              and release_tag
          )
          if protected:
              try:
                  tag_sha = git_output(
                      os.environ["GITHUB_WORKSPACE"],
                      "rev-parse",
                      f"{release_tag}^{{commit}}",
                  ).rstrip("\n")
              except GitFailure:
                  tag_sha = None
              if tag_sha == target_sha:
                  print("Protected release tooling is publishing the exact immutable release tag target.")
                  raise SystemExit(0)
          print(
              "Plugin ClawHub OIDC publish target is not bound to protected tooling and "
              "the exact release tag.",
              file=sys.stderr,
          )
          raise SystemExit(1)
          PYTHON

      - name: Validate ref is on a trusted publish branch
        env:
          TRUSTED_PUBLISH_BRANCH: ${{ inputs.release_publish_branch || github.ref_name }}
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          import re
          import sys

          from ci_git_owner import GitFailure, git_output, run_git

          workspace = os.environ["GITHUB_WORKSPACE"]

          def is_ancestor(ref):
              try:
                  run_git(workspace, "merge-base", "--is-ancestor", "HEAD", ref)
                  return True
              except GitFailure as error:
                  if error.code == 1:
                      return False
                  raise

          if is_ancestor("origin/main"):
              raise SystemExit(0)
          release_refs = git_output(
              workspace,
              "for-each-ref",
              "--format=%(refname)",
              "refs/remotes/origin/release",
          ).splitlines()
          if any(is_ancestor(ref) for ref in release_refs):
              raise SystemExit(0)
          trusted_branch = os.environ["TRUSTED_PUBLISH_BRANCH"]
          if re.fullmatch(
              r"tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z",
              trusted_branch,
          ):
              run_git(
                  workspace,
                  "fetch",
                  "--no-tags",
                  "origin",
                  f"+refs/heads/{trusted_branch}:refs/remotes/origin/{trusted_branch}",
                  timeout=120,
                  reclaim_locks=True,
              )
              if is_ancestor(f"refs/remotes/origin/{trusted_branch}"):
                  raise SystemExit(0)
          print(
              "Plugin ClawHub publishes must target a commit reachable from main, release/*, "
              "or the matching Tideclaw alpha branch.",
              file=sys.stderr,
          )
          raise SystemExit(1)
          PYTHON

      - name: Checkout trusted planning tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"

      - name: Validate publishable plugin metadata
        env:
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/.release-tooling/tsconfig.json
          PUBLISH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_scope || '' }}
          RELEASE_PLUGINS: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins || '' }}
          BASE_REF: ${{ github.event_name != 'workflow_dispatch' && github.event.before || '' }}
          HEAD_REF: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PUBLISH_SCOPE}" ]]; then
            release_args=(--selection-mode "${PUBLISH_SCOPE}")
            if [[ -n "${RELEASE_PLUGINS}" ]]; then
              release_args+=(--plugins "${RELEASE_PLUGINS}")
            fi
            node --import tsx .release-tooling/scripts/plugin-clawhub-release-check.ts "${release_args[@]}"
          elif [[ -n "${BASE_REF}" ]]; then
            node --import tsx .release-tooling/scripts/plugin-clawhub-release-check.ts --base-ref "${BASE_REF}" --head-ref "${HEAD_REF}"
          else
            node --import tsx .release-tooling/scripts/plugin-clawhub-release-check.ts
          fi

      - name: Resolve plugin release plan
        id: plan
        env:
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/.release-tooling/tsconfig.json
          PUBLISH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_scope || '' }}
          RELEASE_PLUGINS: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins || '' }}
          BASE_REF: ${{ github.event_name != 'workflow_dispatch' && github.event.before || '' }}
          HEAD_REF: ${{ steps.ref.outputs.sha }}
          CLAWHUB_REGISTRY: ${{ env.CLAWHUB_REGISTRY }}
        run: |
          set -euo pipefail
          mkdir -p .local
          if [[ -n "${PUBLISH_SCOPE}" ]]; then
            plan_args=(--selection-mode "${PUBLISH_SCOPE}")
            if [[ -n "${RELEASE_PLUGINS}" ]]; then
              plan_args+=(--plugins "${RELEASE_PLUGINS}")
            fi
            node --import tsx .release-tooling/scripts/plugin-clawhub-release-plan.ts "${plan_args[@]}" > .local/plugin-clawhub-release-plan.json
          elif [[ -n "${BASE_REF}" ]]; then
            node --import tsx .release-tooling/scripts/plugin-clawhub-release-plan.ts --base-ref "${BASE_REF}" --head-ref "${HEAD_REF}" > .local/plugin-clawhub-release-plan.json
          else
            node --import tsx .release-tooling/scripts/plugin-clawhub-release-plan.ts > .local/plugin-clawhub-release-plan.json
          fi

          cat .local/plugin-clawhub-release-plan.json
          jq -r '.warnings[]? | "- Warning: \(.)"' .local/plugin-clawhub-release-plan.json >> "$GITHUB_STEP_SUMMARY"

          candidate_count="$(jq -r '.candidates | length' .local/plugin-clawhub-release-plan.json)"
          bootstrap_candidate_count="$(jq -r '.bootstrapCandidates | length' .local/plugin-clawhub-release-plan.json)"
          missing_trusted_publisher_count="$(jq -r '.missingTrustedPublisher | length' .local/plugin-clawhub-release-plan.json)"
          skipped_published_count="$(jq -r '.skippedPublished | length' .local/plugin-clawhub-release-plan.json)"
          has_candidates="false"
          if [[ "${candidate_count}" != "0" ]]; then
            has_candidates="true"
          fi
          has_bootstrap_candidates="false"
          if [[ "${bootstrap_candidate_count}" != "0" ]]; then
            has_bootstrap_candidates="true"
          fi
          has_missing_trusted_publisher="false"
          if [[ "${missing_trusted_publisher_count}" != "0" ]]; then
            has_missing_trusted_publisher="true"
          fi
          matrix_json="$(jq -c '.candidates' .local/plugin-clawhub-release-plan.json)"
          bootstrap_matrix_json="$(jq -c '.bootstrapCandidates' .local/plugin-clawhub-release-plan.json)"
          missing_trusted_publisher_matrix_json="$(jq -c '.missingTrustedPublisher' .local/plugin-clawhub-release-plan.json)"

          {
            echo "candidate_count=${candidate_count}"
            echo "bootstrap_candidate_count=${bootstrap_candidate_count}"
            echo "missing_trusted_publisher_count=${missing_trusted_publisher_count}"
            echo "skipped_published_count=${skipped_published_count}"
            echo "has_candidates=${has_candidates}"
            echo "has_bootstrap_candidates=${has_bootstrap_candidates}"
            echo "has_missing_trusted_publisher=${has_missing_trusted_publisher}"
            echo "matrix=${matrix_json}"
            echo "bootstrap_matrix=${bootstrap_matrix_json}"
            echo "missing_trusted_publisher_matrix=${missing_trusted_publisher_matrix_json}"
          } >> "$GITHUB_OUTPUT"

          echo "Plugin release candidates:"
          jq -r '.candidates[]? | "- \(.packageName)@\(.version) [\(.publishTag)] from \(.packageDir)"' .local/plugin-clawhub-release-plan.json

          echo "Bootstrap candidates requiring token bootstrap:"
          jq -r '.bootstrapCandidates[]? | "- \(.packageName)@\(.version) [\(.publishTag)] from \(.packageDir)"' .local/plugin-clawhub-release-plan.json

          echo "Missing trusted publisher candidates:"
          jq -r '.missingTrustedPublisher[]? | "- \(.packageName)@\(.version) [\(.publishTag)] from \(.packageDir)"' .local/plugin-clawhub-release-plan.json

          echo "Already published / skipped:"
          jq -r '.skippedPublished[]? | "- \(.packageName)@\(.version)"' .local/plugin-clawhub-release-plan.json

      - name: Fail when trusted publisher is missing
        if: steps.plan.outputs.missing_trusted_publisher_count != '0'
        run: |
          echo "::error::One or more ClawHub packages exist but do not have trusted publishing configured. Configure trusted publishing before running the normal OIDC publish workflow."
          jq -r '.missingTrustedPublisher[]? | "::error::Missing trusted publisher: \(.packageName)@\(.version). Configure trusted publishing for openclaw/openclaw, workflow plugin-clawhub-release.yml."' .local/plugin-clawhub-release-plan.json
          exit 1

      - name: Fail normal publish when bootstrap is required
        if: steps.plan.outputs.bootstrap_candidate_count != '0'
        run: |
          echo "::error::One or more ClawHub packages do not exist yet and require the token-gated Plugin ClawHub New bootstrap workflow before normal OIDC publish can run."
          jq -r '.bootstrapCandidates[]? | "::error::Bootstrap required: \(.packageName)@\(.version). Dispatch plugin-clawhub-new.yml for this package, then rerun the normal release."' .local/plugin-clawhub-release-plan.json
          exit 1

      - name: Fail manual publish when target versions already exist
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.publish_scope == 'selected' && steps.plan.outputs.skipped_published_count != '0'
        run: |
          echo "::error::One or more selected plugin versions already exist on ClawHub. Bump the version before running a real publish."
          exit 1

      - name: Validate Tideclaw alpha plugin channels
        env:
          TRUSTED_PUBLISH_BRANCH: ${{ inputs.release_publish_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TRUSTED_PUBLISH_BRANCH}" =~ ^tideclaw/alpha/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}Z$ ]]; then
            exit 0
          fi
          invalid="$(
            jq -r '.candidates[]? | select(.publishTag != "alpha" or .channel != "alpha") | "- \(.packageName)@\(.version) [\(.publishTag)]"' .local/plugin-clawhub-release-plan.json
          )"
          if [[ -n "${invalid}" ]]; then
            echo "Tideclaw alpha ClawHub publishes may only publish alpha plugin versions." >&2
            printf '%s\n' "${invalid}" >&2
            exit 1
          fi

  validate_release_publish_approval:
    name: Validate release publish approval
    needs: preview_plugins_clawhub
    if: github.event_name == 'workflow_dispatch' && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release publish approval run
        env:
          ALLOW_COMPLETED_SUCCESSFUL_PARENT: "true"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_RUN_ID: ${{ inputs.release_publish_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.release_publish_run_attempt }}
          EXPECTED_WORKFLOW_BRANCH: ${{ inputs.release_publish_branch || github.ref_name }}
          EXPECTED_WORKFLOW_FULL_REF: ${{ inputs.release_publish_full_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.release_publish_workflow_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_PUBLISH_RUN_ID// }" ]]; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "Validation-only ClawHub package preparation; no publication authority requested."
              exit 0
            fi
            echo "ClawHub OIDC publication requires a release parent with an exact transaction authorization receipt. Use the release parent workflow, or the separately authenticated manual ClawHub owner route." >&2
            exit 1
          fi
          direct_recovery=false
          if [[ "${GITHUB_ACTOR}" != "github-actions[bot]" ]]; then
            direct_recovery=true
            echo "Direct Plugin ClawHub Release recovery with release_publish_run_id; relying on this workflow's clawhub-plugin-release environment approval."
          fi
          RUN_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_PUBLISH_RUN_ID}/attempts/${EXPECTED_RUN_ATTEMPT}" |
              jq '{
                repository: .repository.full_name,
                workflowName: .name,
                headBranch: .head_branch,
                headSha: .head_sha,
                event,
                status,
                conclusion,
                path,
                url: .html_url,
                runAttempt: .run_attempt
              }'
          )"
          printf '%s' "$RUN_JSON" | DIRECT_RELEASE_RECOVERY="${direct_recovery}" node scripts/validate-release-publish-approval.mjs

  pack_plugins_clawhub_artifacts:
    needs: [preview_plugins_clawhub, validate_release_publish_approval]
    if: github.event_name == 'workflow_dispatch' && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        plugin: ${{ fromJson(needs.preview_plugins_clawhub.outputs.matrix) }}
    steps:
      - name: Validate target revision
        env:
          TARGET_SHA: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
        run: |
          if [[ ! "${TARGET_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ClawHub pack target must be a full lowercase commit SHA; got: ${TARGET_SHA}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"
          install-deps: "true"

      - name: Install pinned ClawHub CLI wrapper
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/clawhub" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec npm exec --yes --package "${CLAWHUB_CLI_PACKAGE}" -- clawhub "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/clawhub"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Pack ClawHub package artifact
        env:
          CLAWHUB_REGISTRY: ${{ env.CLAWHUB_REGISTRY }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
          SOURCE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          PACKAGE_TAG: ${{ matrix.plugin.publishTag }}
          PACKAGE_DIR: ${{ matrix.plugin.packageDir }}
          OPENCLAW_CLAWHUB_PACK_OUTPUT_DIR: ${{ runner.temp }}/clawhub-package-artifact
        run: bash scripts/plugin-clawhub-publish.sh --pack "${PACKAGE_DIR}"

      - name: Upload ClawHub package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.plugin.artifactName }}
          path: ${{ runner.temp }}/clawhub-package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  seal_clawhub_transactions:
    name: Seal ClawHub package transactions
    needs: [preview_plugins_clawhub, pack_plugins_clawhub_artifacts]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      identity: ${{ steps.seal.outputs.identity }}
    steps:
      - name: Checkout trusted transaction tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download exact packed transactions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: clawhub-package-*
          path: ${{ runner.temp }}/clawhub-transactions/packages
      - name: Seal actual packed inventories
        id: seal
        env:
          TARGET_SHA: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
          PACKAGE_MATRIX: ${{ needs.preview_plugins_clawhub.outputs.matrix }}
          RELEASE_PUBLISH_RUN_ID: ${{ inputs.release_publish_run_id }}
          RELEASE_PUBLISH_RUN_ATTEMPT: ${{ inputs.release_publish_run_attempt }}
          RELEASE_PUBLISH_BRANCH: ${{ inputs.release_publish_branch }}
          RELEASE_PUBLISH_FULL_REF: ${{ inputs.release_publish_full_ref }}
          RELEASE_PUBLISH_WORKFLOW_SHA: ${{ inputs.release_publish_workflow_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGE_MATRIX" > "$RUNNER_TEMP/clawhub-transactions/matrix.json"
          node scripts/clawhub-parent-authorization.mjs seal \
            --matrix "$RUNNER_TEMP/clawhub-transactions/matrix.json" \
            --directory "$RUNNER_TEMP/clawhub-transactions/packages" \
            --output "$RUNNER_TEMP/clawhub-transactions/transactions.json"
      - name: Upload exact transaction identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/clawhub-transactions/transactions.json
          if-no-files-found: error
          retention-days: 30

  approve_plugins_clawhub_release:
    needs: [preview_plugins_clawhub, pack_plugins_clawhub_artifacts, seal_clawhub_transactions]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run != true && needs.preview_plugins_clawhub.outputs.has_candidates == 'true' && needs.pack_plugins_clawhub_artifacts.result == 'success' && needs.seal_clawhub_transactions.result == 'success'
    runs-on: ubuntu-latest
    environment: clawhub-plugin-release
    permissions:
      contents: read
    steps:
      - name: Approve Plugin ClawHub release publish
        run: |
          echo "Approved CLAW-277 03 - Split OpenClaw plugin ClawHub publishing into OIDC release and token bootstrap workflows release publish gate."

  publish_plugins_clawhub:
    needs:
      [
        preview_plugins_clawhub,
        pack_plugins_clawhub_artifacts,
        seal_clawhub_transactions,
        approve_plugins_clawhub_release,
      ]
    if: always() && github.event_name == 'workflow_dispatch' && needs.preview_plugins_clawhub.outputs.has_candidates == 'true' && needs.pack_plugins_clawhub_artifacts.result == 'success' && (inputs.dry_run == true || needs.approve_plugins_clawhub_release.result == 'success')
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@0f6803b4611fc47547d2322dd8903e7b02f5e126 # reviewed parent receipt contract
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        plugin: ${{ fromJson(needs.preview_plugins_clawhub.outputs.matrix) }}
    with:
      trusted_tooling_identity_json: ${{ needs.seal_clawhub_transactions.outputs.identity }}
      wait_for_publication: false
      package_artifact_name: ${{ matrix.plugin.artifactName }}
      dry_run: ${{ inputs.dry_run }}
      registry: https://clawhub.ai
      site: https://clawhub.ai
      family: ${{ contains(fromJson('["@openclaw/acpx","@openclaw/diffs","@openclaw/feishu"]'), matrix.plugin.packageName) && 'bundle-plugin' || '' }}
      tags: ${{ matrix.plugin.publishTag }}
      source_repo: ${{ github.repository }}
      source_commit: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
      # ClawHub requires the token's candidate SHA in both fields, not a mutable tag or tooling ref.
      source_ref: ${{ needs.preview_plugins_clawhub.outputs.ref_revision }}
      source_path: ${{ matrix.plugin.packageDir }}
      inspector_artifact_name: ${{ matrix.plugin.artifactName }}-inspector
      publish_json_artifact_name: ${{ matrix.plugin.artifactName }}-publish-json

  # Exact public artifact verification runs in plugin-clawhub-postpublish.yml
  # after the authorizing parent succeeds. Waiting here would deadlock staging.
