title: Claude CLI inbound image subscription

scenario:
  id: claude-cli-inbound-image-subscription
  surface: model-provider
  coverage:
    primary:
      - anthropic.claude-cli-compatibility-provider-capabilities
      - channels.inbound-routing-qa-channel
  objective: Verify a qa-channel inbound image survives reply admission and reaches a Claude CLI subscription turn exactly once.
  successCriteria:
    - The selected live provider is claude-cli with subscription auth.
    - A qa-channel inbound image receives a visible description through the normal reply path.
    - The description mentions the expected red and blue regions.
    - Gateway logs prove the turn entered the Claude CLI backend without a structured-image hydration failure.
  docsRefs:
    - docs/gateway/cli-backends.md
    - docs/channels/qa-channel.md
    - docs/help/testing.md
  codeRefs:
    - extensions/qa-channel/src/inbound.ts
    - src/auto-reply/reply/get-reply-run-execute.ts
    - src/auto-reply/reply/agent-runner-execution.ts
    - src/agents/cli-runner/helpers.ts
  execution:
    kind: flow
    providerMode: live-frontier
    channel: qa-channel
    summary: Run with `pnpm openclaw qa suite --provider-mode live-frontier --cli-auth-mode subscription --model claude-cli/claude-sonnet-4-6 --alt-model claude-cli/claude-sonnet-4-6 --scenario claude-cli-inbound-image-subscription`.
    config:
      authMode: subscription
      requiredProvider: claude-cli
      conversationId: qa-claude-cli-inbound-image-subscription
      prompt: "Inbound Claude CLI image check: describe the top and bottom colors in the attached image in one short sentence."
      requiredColorGroups:
        - [red, scarlet, crimson]
        - [blue, azure, teal, cyan, aqua]

flow:
  steps:
    - name: describes an inbound image through the Claude CLI reply path
      actions:
        - set: selected
          value:
            expr: splitModelRef(env.primaryModel)
        - set: preserveEnv
          value:
            expr: "String(env.gateway.runtimeEnv.OPENCLAW_LIVE_CLI_BACKEND_PRESERVE_ENV ?? '')"
        - assert:
            expr: "env.providerMode === 'live-frontier' && selected?.provider === config.requiredProvider"
            message:
              expr: "`expected live provider ${config.requiredProvider}, got mode=${env.providerMode} model=${env.primaryModel}`"
        - assert:
            expr: "env.gateway.runtimeEnv.OPENCLAW_LIVE_CLI_BACKEND_AUTH_MODE === config.authMode"
            message:
              expr: "`expected Claude CLI auth mode ${config.authMode}, got ${env.gateway.runtimeEnv.OPENCLAW_LIVE_CLI_BACKEND_AUTH_MODE ?? 'unset'}`"
        - assert:
            expr: "!preserveEnv.includes('ANTHROPIC_API_KEY')"
            message:
              expr: "`expected subscription auth without ANTHROPIC_API_KEY preservation, got ${preserveEnv}`"
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: gatewayLogCursor
          value:
            expr: markGatewayLogCursor()
        - set: outboundStartIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            accountId: default
            conversation:
              id:
                expr: config.conversationId
              kind: direct
            senderId: qa-operator
            senderName: QA Operator
            text:
              expr: config.prompt
            attachments:
              - kind: image
                mimeType: image/png
                fileName: claude-cli-inbound-red-top-blue-bottom.png
                altText: red on top blue on bottom
                contentBase64:
                  expr: imageUnderstandingValidPngBase64
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === config.conversationId && config.requiredColorGroups.every((group) => group.some((color) => normalizeLowercaseStringOrEmpty(candidate.text).includes(color)))"
            - expr: resolveQaLiveTurnTimeoutMs(env, 90000, env.primaryModel)
            - sinceIndex:
                ref: outboundStartIndex
        - set: gatewayLog
          value:
            expr: "String(readGatewayLogs(gatewayLogCursor) ?? '')"
        - assert:
            expr: "gatewayLog.includes('cli exec: provider=claude-cli')"
            message:
              expr: "`expected Claude CLI execution trace; log tail=${gatewayLog.slice(-2000)}`"
        - assert:
            expr: "!gatewayLog.includes('failed to hydrate')"
            message:
              expr: "`unexpected structured image hydration failure; log tail=${gatewayLog.slice(-2000)}`"
      detailsExpr: "`provider=${selected?.provider} model=${selected?.model} auth=${config.authMode} reply=${JSON.stringify(outbound.text)} cliTrace=true`"
