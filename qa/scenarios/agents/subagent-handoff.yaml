title: Subagent handoff

scenario:
  id: subagent-handoff
  surface: subagents
  runtimePairLane: core
  coverage:
    primary:
      - agent-runtime.subagent-turns-subagents
  objective: Verify the agent can delegate a bounded task to a subagent and fold the result back into the main thread.
  successCriteria:
    - Agent launches a bounded subagent task.
    - The current parent owns one successfully completed subagent task.
    - Final answer attributes the successful child's actual result and evidence.
  docsRefs:
    - docs/tools/subagents.md
    - docs/help/testing.md
  codeRefs:
    - src/agents/system-prompt.ts
    - extensions/qa-lab/src/report.ts
  execution:
    kind: flow
    summary: Verify the agent can delegate a bounded task to a subagent and fold the result back into the main thread.
    channel: qa-channel
    config:
      expectedChildLabel: qa-sidecar
      prompt: "Delegate one bounded QA task to a subagent with label qa-sidecar. Wait for that exact subagent to finish successfully. Then reply with three labeled sections exactly once: Delegated task, Result, Evidence. Put that child's actual completed result in Result and describe its delegated-child evidence in Evidence. Do not say 'waiting'."

flow:
  steps:
    - name: delegates a bounded task and reports the result
      actions:
        - call: reset
        - set: sessionKey
          value:
            expr: "`agent:qa:subagent-handoff:${randomUUID().slice(0, 8)}`"
        - set: requestCursorBefore
          value:
            expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor : 0"
        - call: runAgentPrompt
          args:
            - ref: env
            - sessionKey:
                ref: sessionKey
              message:
                expr: config.prompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 90000)
        - call: waitForAgentHistoryReply
          saveAs: outbound
          args:
            - ref: env
            - ref: sessionKey
            - lambda:
                params: [text]
                expr: "(() => { const lower = normalizeLowercaseStringOrEmpty(text); return lower.includes('delegated task') && lower.includes('result') && lower.includes('evidence') && !lower.includes('waiting'); })()"
            - expr: liveTurnTimeoutMs(env, 45000)
            - expr: "env.providerMode === 'mock-openai' ? 100 : 250"
        - assert:
            expr: "!['failed to delegate','could not delegate','subagent unavailable'].some((needle) => normalizeLowercaseStringOrEmpty(outbound.text).includes(needle))"
            message:
              expr: "`subagent handoff reported failure: ${outbound.text}`"
        - set: subagentEvidenceRequest
          value:
            expr: "({ env, kind: 'handoff', requesterSessionKey: sessionKey, expectedChildLabel: config.expectedChildLabel, timeoutMs: liveTurnTimeoutMs(env, 60000) })"
        - try:
            actions:
              - call: waitForCondition
                args:
                  - lambda:
                      async: true
                      expr: "(await collectSubagentScenarioEvidence(subagentEvidenceRequest)).evidence"
                  - expr: liveTurnTimeoutMs(env, 30000)
                  - expr: "env.providerMode === 'mock-openai' ? 100 : 250"
            catch:
              - set: subagentEvidenceFailure
                value:
                  expr: "await collectSubagentScenarioEvidence(subagentEvidenceRequest)"
              - throw:
                  expr: "`subagent handoff evidence failed: ${subagentEvidenceFailure.summary}`"
        # Parity gate criterion 2 (no fake progress / fake tool completion):
        # require an actual sessions_spawn tool call. Without this, a model
        # could produce the three labeled sections ("Delegated task", "Result",
        # "Evidence") as free-form prose without ever delegating to a real
        # subagent. The assertion is pinned to THIS scenario by matching the
        # scenario-unique prompt substring "Delegate one bounded QA task"
        # (not a broad /delegate|subagent/ regex) so the earlier
        # subagent-fanout-synthesis scenario — which also contains "delegate"
        # and produces its own pre-tool sessions_spawn request — cannot
        # satisfy the assertion here. The match is also constrained to
        # pre-tool requests (no toolOutput) because the mock only plans
        # sessions_spawn on requests with no toolOutput; the follow-up
        # request after the tool runs has plannedToolName unset.
        - set: subagentDebugRequests
          value:
            expr: "env.mock ? [...(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`))] : []"
        - assert:
            expr: "!env.mock || subagentDebugRequests.some((request) => !request.toolOutput && /delegate one bounded qa task/i.test(String(request.allInputText ?? '')) && request.plannedToolName === 'sessions_spawn' && request.plannedToolArgs?.label === config.expectedChildLabel)"
            message:
              expr: "`expected sessions_spawn tool call during subagent handoff scenario, saw plannedToolNames=${JSON.stringify(subagentDebugRequests.map((request) => request.plannedToolName ?? null))}`"
      detailsExpr: outbound.text
