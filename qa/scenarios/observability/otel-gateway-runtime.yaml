title: OTEL gateway runtime

scenario:
  id: otel-gateway-runtime
  surface: telemetry
  coverage:
    primary:
      - observability.otlp-http-traces-qa-lab
      - observability.telemetry-runtime-validation
      - observability.telemetry-trace
      - observability.telemetry-failure-recovery
  objective: Verify a real mock-provider Gateway and qa-channel run exports linked OTLP traces for normal execution and honest failed-tool recovery.
  successCriteria:
    - A qa-channel turn with a successful read exports linked run, tool, and terminal message-processing spans.
    - A missing-file tool failure is exported as an error tool span.
    - The failed-tool turn still produces an honest outbound response and a successful terminal message-processing span in the same trace.
    - Exporter retry behavior is not accepted as tool-failure recovery evidence.
  plugins:
    - diagnostics-otel
    - qa-channel
    - qa-lab
  docsRefs:
    - docs/gateway/opentelemetry.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - extensions/diagnostics-otel/src/service-recorders-tools.ts
    - extensions/diagnostics-otel/src/service-recorders-usage.ts
    - test/e2e/qa-lab/runtime/otel-gateway-runtime.e2e.test.ts
    - test/e2e/qa-lab/runtime/otel-test-support.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/runtime/otel-gateway-runtime.e2e.test.ts
    summary: Run the public QA gateway, qa-channel bus, mock provider, and a decoded local OTLP receiver.
