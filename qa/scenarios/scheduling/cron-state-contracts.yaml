title: Cron state lifecycle contracts

scenario:
  id: cron-state-contracts
  surface: automation
  category: automation.cron
  coverage:
    primary:
      - automation.create-edit-remove-jobs
      - automation.schedule-types
      - automation.timezone-and-stagger
      - automation.scheduler-persistence
      - automation.isolated-cron-execution-dedup
      - automation.run-history-dedup
  objective: Verify durable cron job state, scheduler execution, restart recovery, and run-history deduplication through production service boundaries.
  successCriteria:
    - At, every, and timezone-aware staggered cron schedules are created in a real temporary store.
    - An every schedule edit and one-shot removal survive service reloads.
    - A persisted one-shot job executes through the restarted production scheduler exactly once.
    - Two schedulers sharing one store execute one isolated job only once.
    - The isolated run produces one authoritative SQLite task-ledger history row.
    - Registry and scheduler reloads preserve that single terminal history row without replay.
  docsRefs:
    - docs/automation/cron-jobs.md
    - docs/automation/tasks.md
    - docs/cli/cron.md
  codeRefs:
    - src/cron/service.ts
    - src/cron/service/ops-lifecycle.ts
    - src/cron/service/ops-mutations.ts
    - src/cron/service/timer.ts
    - src/cron/task-run-history.ts
    - src/cron/cron-state-contracts.e2e.test.ts
  execution:
    kind: vitest
    path: src/cron/cron-state-contracts.e2e.test.ts
    summary: Exercise real cron stores, scheduler timers, restart recovery, isolated execution deduplication, and persisted task-ledger run history.
