title: Cron one-minute ping

scenario:
  id: cron-one-minute-ping
  surface: cron
  coverage:
    primary:
      - automation.cron-rpcs
      - automation.chat-announce-delivery
      - automation.isolated-cron-execution
    secondary:
      - channels.qa-channel-final-reply
  objective: Verify a Gateway cron reminder scheduled one minute in the future fires naturally and delivers its follow-up through the QA channel.
  successCriteria:
    - Gateway stores a one-shot cron reminder roughly one minute ahead.
    - The scheduler executes the reminder no earlier than its scheduled due time without forcing the job.
    - The isolated agent turn returns the reminder marker through qa-channel.
  docsRefs:
    - docs/help/testing.md
    - docs/channels/qa-channel.md
  codeRefs:
    - extensions/qa-lab/src/bus-server.ts
    - extensions/qa-lab/src/self-check.ts
  execution:
    kind: flow
    timeoutMs: 180000
    summary: Schedule a one-minute Gateway cron reminder, wait for its natural timer, and verify qa-channel delivery.
    channel: qa-channel
    config:
      channelId: qa-room
      channelTitle: QA Room
      reminderPromptTemplate: "A QA cron just fired. Send a one-line ping back to the room containing this exact marker: {{marker}}"

flow:
  steps:
    - name: stores a reminder roughly one minute ahead
      actions:
        - call: reset
        - set: at
          value:
            expr: "new Date(Date.now() + 60000).toISOString()"
        - set: cronMarker
          value:
            expr: "`QA-CRON-${randomUUID().slice(0, 8)}`"
        - call: env.gateway.call
          saveAs: response
          args:
            - cron.add
            - name:
                expr: "`qa-suite-${randomUUID()}`"
              enabled: true
              schedule:
                kind: at
                at:
                  ref: at
              sessionTarget: isolated
              wakeMode: now
              payload:
                kind: agentTurn
                message:
                  expr: "config.reminderPromptTemplate.replace('{{marker}}', cronMarker)"
              delivery:
                mode: announce
                channel: qa-channel
                to:
                  expr: "`channel:${config.channelId}`"
        - set: scheduledAt
          value:
            expr: "response.schedule?.at ?? at"
        - set: delta
          value:
            expr: "new Date(scheduledAt).getTime() - Date.now()"
        - assert:
            expr: "delta >= 45000 && delta <= 75000"
            message:
              expr: "`expected ~1 minute schedule, got ${delta}ms`"
        - set: jobId
          value:
            expr: response.id
      detailsExpr: scheduledAt

    - name: waits for the natural reminder and QA channel delivery
      actions:
        - assert:
            expr: "Boolean(jobId)"
            message: missing cron job id
        - assert:
            expr: "Boolean(cronMarker)"
            message: missing cron marker
        - set: runStartedAt
          value:
            expr: "Date.now()"
        - call: waitForCronRunCompletion
          saveAs: completedRun
          args:
            - callGateway:
                expr: "env.gateway.call.bind(env.gateway)"
              jobId:
                ref: jobId
              afterTs:
                ref: runStartedAt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 120000)
        - assert:
            expr: "Number.isSafeInteger(completedRun?.runAtMs) && completedRun.runAtMs >= new Date(scheduledAt).getTime()"
            message:
              expr: "`cron reminder actually started before its scheduled time ${scheduledAt}: ${JSON.stringify(completedRun)}`"
        - assert:
            expr: "Number.isSafeInteger(completedRun?.ts) && completedRun.ts >= runStartedAt && completedRun.ts >= completedRun.runAtMs"
            message:
              expr: "`expected the current scheduled cron attempt's recorded completion, got ${JSON.stringify(completedRun)}`"
        - assert:
            expr: "completedRun?.status === 'ok'"
            message:
              expr: "`expected a successful naturally scheduled reminder, got ${JSON.stringify(completedRun)}`"
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === config.channelId && candidate.text.includes(cronMarker)"
            - expr: liveTurnTimeoutMs(env, 45000)
      detailsExpr: outbound.text
