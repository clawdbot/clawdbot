title: Music generation controls

scenario:
  id: music-generation-controls
  surface: media-generation
  category: media.media-generation
  coverage:
    primary:
      - media.lyrics-instrumental-duration-and-format-controls
      - media.music-generation-provider-controls
      - media.music-generation-tool-invocation
  objective: Prove music_generate uses canonical model configuration, prepared providers, capability normalization, fallback routing, and real media persistence.
  successCriteria:
    - Canonical agents.defaults.mediaModels.music configuration enables music_generate and its list action reports provider models and capabilities.
    - Configured primary and fallback providers are attempted in order, while an explicit provider/model override selects only that provider.
    - Lyrics, instrumental, duration, and format values reach supporting providers with the requested values.
    - Unsupported lyrics and formats are dropped with visible diagnostics, while overlong duration is clamped with requested and applied values.
    - An invalid output format is rejected before any provider invocation.
    - Successful provider output is persisted as nonempty audio in the isolated real media store.
  docsRefs:
    - docs/tools/music-generation.md
    - docs/concepts/models.md
    - docs/help/testing.md
  codeRefs:
    - src/agents/tools/music-generate-tool.ts
    - src/music-generation/runtime.ts
    - src/music-generation/normalization.ts
    - src/media/store.ts
    - test/e2e/qa-lab/media/music-generation-controls.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/media/music-generation-controls.e2e.test.ts
    summary: Exercise the real music_generate tool through prepared provider fallback, capability normalization, and media persistence.
