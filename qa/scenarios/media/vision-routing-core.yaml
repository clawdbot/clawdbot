title: Core vision routing

scenario:
  id: vision-routing-core
  surface: media
  coverage:
    primary:
      - media.active-vision-model-bypass
      - media.vision-provider-fallback
  objective: Prove native image delivery and media-understanding fallback cross the real apply and active-model boundaries.
  successCriteria:
    - A native vision model records the bypass reason, makes no summarizer call, receives no inserted image summary, and receives the real image payload.
    - A failed primary vision provider falls through to the configured fallback in order and records the selected provider and model.
    - Fallback success inserts exactly one image summary and suppresses the now-described raw image from active-model hydration.
  docsRefs:
    - docs/concepts/qa-e2e-automation.md
    - docs/nodes/media-understanding.md
  codeRefs:
    - src/media-understanding/apply.ts
    - src/media-understanding/runner.ts
    - src/auto-reply/media-note.ts
    - src/auto-reply/reply/current-turn-images.ts
    - test/e2e/qa-lab/media/vision-routing-core.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/media/vision-routing-core.e2e.test.ts
    summary: Exercise native vision bypass and ordered provider fallback through apply, summary projection, and current-turn image resolution.
