title: Live inbound voice talkback

scenario:
  id: inbound-voice-talkback-live
  surface: media-understanding
  coverage:
    primary:
      - media.inbound-media-store
    secondary:
      - channels.inbound-media-normalization
  objective: Verify a real spoken audio attachment reaches OpenAI transcription and produces one visible talkback reply.
  gatewayConfigPatch:
    tools:
      media:
        models:
          - provider: openai
            model: gpt-4o-transcribe
            capabilities: [audio]
        audio:
          enabled: true
          echoTranscript: false
  successCriteria:
    - QA Channel saves the real spoken WAV and emits only its media://inbound identity.
    - OpenAI transcription supplies the spoken instruction to the live model.
    - The live model produces exactly one visible reply containing only the requested marker.
  docsRefs:
    - docs/channels/qa-channel.md
    - docs/concepts/qa-e2e-automation.md
    - docs/providers/openai.md
  codeRefs:
    - extensions/qa-channel/src/inbound.ts
    - extensions/qa-lab/src/voice-preflight.fixture.ts
    - src/media-understanding/openai-compatible-audio.ts
  execution:
    kind: flow
    channel: qa-channel
    suiteIsolation: isolated
    timeoutMs: 180000
    retryCount: 0
    summary: Run with `OPENCLAW_LIVE_OPENAI_KEY="${OPENAI_API_KEY}" pnpm openclaw qa suite --provider-mode live-frontier --model openai/gpt-5.4 --alt-model openai/gpt-5.4 --fast --scenario inbound-voice-talkback-live --concurrency 1`.
    config:
      requiredProviderMode: live-frontier
      requiredProvider: openai
      requiredModel: gpt-5.4
      conversationId: qa-live-voice-talkback
      expectedMarker: MATRIX QA VOICE PREFLIGHT OK
      expectedMarkerNormalized: MATRIXQAVOICEPREFLIGHTOK

flow:
  steps:
    - name: transcribes a real stored voice note and talks back once
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: scenario requires live-frontier provider mode
        - set: selected
          value:
            expr: splitModelRef(env.primaryModel)
        - assert:
            expr: "selected?.provider === config.requiredProvider"
            message:
              expr: "`expected live primary provider ${config.requiredProvider}, got ${env.primaryModel}`"
        - assert:
            expr: "selected?.model === config.requiredModel"
            message:
              expr: "`expected live primary model ${config.requiredModel}, got ${env.primaryModel}`"
        - assert:
            expr: "Boolean(env.gateway.runtimeEnv.OPENAI_API_KEY?.trim() || env.gateway.runtimeEnv.OPENCLAW_LIVE_OPENAI_KEY?.trim())"
            message: live OpenAI API key did not reach the Gateway child
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: logCursor
          value:
            expr: markGatewayLogCursor()
        - set: voiceFixture
          value:
            expr: await qaImport("./voice-preflight.fixture.js")
        - set: audioBuffer
          value:
            expr: voiceFixture.createQaVoicePreflightWav()
        - assert:
            expr: "Buffer.isBuffer(audioBuffer) && audioBuffer.length > 44 && audioBuffer.subarray(0, 4).toString('ascii') === 'RIFF'"
            message: expected the shared QA voice preflight fixture to be a non-empty WAV
        - sendInbound:
            conversation:
              id:
                expr: config.conversationId
              kind: direct
            senderId: alice
            senderName: Alice
            text: Follow the attached voice note and reply only as instructed by the audio.
            attachments:
              - id: live-voice-note
                kind: audio
                mimeType: audio/wav
                fileName: live-voice-note.wav
                mediaFactCarrier: media-store-url
                contentBase64:
                  expr: audioBuffer.toString('base64')
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === config.conversationId && String(candidate.text ?? '').toUpperCase().replace(/[^A-Z0-9]+/g, '') === config.expectedMarkerNormalized"
            - expr: resolveQaLiveTurnTimeoutMs(env, 90000, env.primaryModel)
        - call: sleep
          args:
            - 1500
        - set: visibleConversationOutbound
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && !message.deleted && message.conversation.id === config.conversationId)"
        - set: matchingOutbound
          value:
            expr: "visibleConversationOutbound.filter((message) => String(message.text ?? '').toUpperCase().replace(/[^A-Z0-9]+/g, '') === config.expectedMarkerNormalized)"
        - set: gatewayLog
          value:
            expr: "String(readGatewayLogs() ?? '').slice(logCursor)"
        - assert:
            expr: visibleConversationOutbound.length === 1 && matchingOutbound.length === 1
            message:
              expr: "`expected one live voice talkback reply, saw ${visibleConversationOutbound.length} visible messages and ${matchingOutbound.length} marker replies`"
        - assert:
            expr: "!gatewayLog.includes('MediaFetchError') && !gatewayLog.includes('audio: failed')"
            message:
              expr: "`live voice note failed before talkback: ${gatewayLog}`"
      detailsExpr: "`provider=${selected?.provider} model=${selected?.model} reply=${outbound.text}; markerReplies=${matchingOutbound.length}`"
