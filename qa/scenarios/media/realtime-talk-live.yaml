title: OpenAI realtime Talk live

scenario:
  id: openai-realtime-talk-live
  surface: voice
  category: voice.realtime-talk-sessions
  coverage:
    primary:
      - voice.openai-realtime-voice-backend-bridge
      - voice.talkback-runtime-behavior
      - voice.browser-webrtc-sessions
      - voice.live-smoke-output
  objective: Run the canonical OpenAI realtime Talk smoke and publish bounded QA evidence for the backend bridge, real PCM talkback, and browser WebRTC session.
  successCriteria:
    - The QA producer spawns the existing realtime Talk live smoke in OpenAI-only mode with one audio roundtrip cycle.
    - The backend bridge connects through the OpenAI realtime voice provider.
    - Real PCM16 mono 24 kHz input produces final user and assistant transcripts, response completion, and non-trivial audio without post-close audio.
    - A browser WebRTC session connects through the OpenAI realtime credential path.
    - Missing OpenAI credentials or browser prerequisites produce blocked evidence rather than false passing coverage.
    - Evidence retains only normalized leg status, byte counts, audio format metadata, and a status digest.
  docsRefs:
    - docs/nodes/talk.md
    - docs/providers/openai/voice-and-speech.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - test/e2e/qa-lab/media/realtime-talk-live.ts
    - scripts/dev/realtime-talk-live-smoke.ts
    - extensions/openai/realtime-voice-provider.ts
    - ui/src/pages/chat/realtime-talk-webrtc.ts
  execution:
    kind: script
    path: test/e2e/qa-lab/media/realtime-talk-live.ts
    summary: Spawns the canonical OpenAI realtime Talk live smoke and emits bounded QA Lab evidence.
    allowBlockedEvidence: true
    timeoutMs: 300000
    config:
      requiredProviderMode: live-frontier
    args:
      - --artifact-base
      - ${outputDir}
