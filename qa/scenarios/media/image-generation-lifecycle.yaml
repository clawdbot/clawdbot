title: Image generation task lifecycle

scenario:
  id: image-generation-lifecycle
  surface: image-generation
  coverage:
    primary:
      - media.generated-image-task-lifecycle
  objective: Verify one real QA-channel image request owns a stable asynchronous task across running, completion, cleanup, and recent-success duplicate guards.
  successCriteria:
    - The first image_generate request creates one running image-generation task with a stable task ID.
    - An exact duplicate while the task is running returns that task ID and does not make a second provider call.
    - The task completes through the generated-media wake path and delivers exactly one PNG outcome to QA-channel.
    - After completion cleanup, an exact duplicate resolves to the same recently succeeded task without another provider call.
  docsRefs:
    - docs/tools/image-generation.md
    - docs/channels/qa-channel.md
  codeRefs:
    - src/agents/tools/image-generate-tool.ts
    - src/agents/tools/media-generate-background-shared.ts
    - src/agents/media-generation-task-status.ts
    - test/e2e/qa-lab/media/image-generation-lifecycle.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/media/image-generation-lifecycle.e2e.test.ts
    summary: Hold one deterministic image provider call while QA-channel verifies running and recently completed duplicate guards around one task and one delivery.
