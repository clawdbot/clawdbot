title: Memory-core redaction boundaries

scenario:
  id: memory-core-redaction-boundaries
  surface: security
  category: security.credential-and-secret-hygiene
  coverage:
    primary:
      - security.redaction-dreaming
      - security.redaction-promotion
      - session-memory.memory-files-artifact-safety
  objective: Prove memory-core redacts sensitive interactive transcript content before dreaming ingestion and structurally rejects contaminated or untrusted promotion candidates.
  successCriteria:
    - A real interactive session transcript keeps safe control text while replacing a raw shared secret before the real dreaming phase ingests it.
    - The real promotion apply path writes exactly one clean trusted candidate and its canonical marker to MEMORY.md.
    - Dreaming-shaped content containing a raw secret is rejected rather than redacted into durable memory.
    - Explicitly untrusted content is rejected by provenance and leaves neither text nor a promotion marker in MEMORY.md.
  docsRefs:
    - docs/concepts/dreaming.md
    - docs/concepts/memory-architecture.md
    - docs/reference/memory-config.md
  codeRefs:
    - packages/memory-host-sdk/src/host/session-files.ts
    - extensions/memory-core/src/dreaming-phases.ts
    - extensions/memory-core/src/short-term-promotion-apply.ts
    - extensions/memory-core/src/redaction-product-boundaries.test.ts
  execution:
    kind: vitest
    path: extensions/memory-core/src/redaction-product-boundaries.test.ts
    summary: Run the real dreaming transcript-ingestion and durable promotion gates against raw-secret, contaminated, and untrusted inputs.
