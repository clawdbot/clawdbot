title: Doctor auth and SecretRef checks

scenario:
  id: doctor-auth-secretref-checks
  surface: runtime
  category: cli.doctor
  coverage:
    primary:
      - cli.auth-and-secretref-checks
  objective: Prove that the real doctor CLI validates gateway SecretRefs without leaking, replacing, or silently bypassing configured credentials.
  successCriteria:
    - A resolved environment SecretRef passes doctor validation without exposing its value.
    - An unresolved SecretRef remains configured and ambient gateway token fallback cannot mask the failure.
    - Exec SecretRefs remain gated unless the operator explicitly passes --allow-exec; Windows then proves the current fail-closed ACL diagnostic without executing or leaking the secret.
    - Explicit token generation persists a new token only when no SecretRef owns the field.
  docsRefs:
    - docs/cli/doctor.md
    - docs/gateway/secrets.md
  codeRefs:
    - src/flows/doctor-health-contributions.ts
    - src/commands/doctor-gateway-health.ts
    - test/e2e/qa-lab/runtime/doctor-auth-secretref-checks.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/runtime/doctor-auth-secretref-checks.e2e.test.ts
    summary: Run the real doctor CLI across resolved, unresolved, fallback, exec-gated, and generated-token auth states.
