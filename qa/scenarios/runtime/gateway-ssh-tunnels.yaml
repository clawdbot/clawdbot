title: Gateway SSH tunnel fallback

scenario:
  id: gateway-ssh-tunnels
  surface: runtime
  coverage:
    primary:
      - gateway.ssh-tunnels
  objective: Prove the Gateway status SSH fallback through a real isolated OpenSSH daemon and loopback Gateway.
  successCriteria:
    - An isolated OpenSSH daemon accepts an ephemeral key through strict host-key verification.
    - Gateway status starts a real local forward and reaches the authenticated loopback Gateway through it.
    - Gateway status closes the local forward after probing.
    - A changed host key produces an explicit SSH tunnel warning without hiding the directly reachable Gateway.
    - A stopped SSH daemon produces an explicit unreachable-tunnel warning without hiding the directly reachable Gateway.
  docsRefs:
    - docs/gateway/remote.md
    - docs/cli/gateway.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - src/infra/ssh-tunnel.ts
    - src/commands/gateway-status.ts
    - src/commands/gateway-status/probe-run.ts
    - test/e2e/qa-lab/runtime/gateway-ssh-tunnels.ts
  execution:
    kind: script
    path: test/e2e/qa-lab/runtime/gateway-ssh-tunnels.ts
    summary: Starts an isolated real sshd and loopback Gateway, then exercises success, cleanup, host-key rejection, and unreachable-daemon status diagnostics.
    timeoutMs: 120000
    args:
      - --artifact-base
      - ${outputDir}
