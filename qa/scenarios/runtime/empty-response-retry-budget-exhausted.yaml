title: Empty-response retry exhaustion fallback

scenario:
  id: empty-response-retry-budget-exhausted
  surface: runtime
  coverage:
    primary:
      - agent-runtime.failure-recovery-empty-response-recovery
      - agent-runtime.progress-visibility-failure-recovery
    secondary:
      - agent-runtime.failure-recovery-retry-policy
  objective: Verify repeated empty GPT turns end in one safe visible fallback after bounded recovery.
  successCriteria:
    - Scenario is mock-openai only so live lanes do not pick it up implicitly.
    - Recovery remains bounded and never repeats the settled read.
    - Isolated finalization requests expose no tools.
    - Exactly one host fallback is delivered without producing the requested success marker or a generic error.
  docsRefs:
    - docs/help/testing.md
  codeRefs:
    - extensions/qa-lab/src/providers/mock-openai/server.ts
    - src/agents/embedded-agent-runner/run/incomplete-turn-resolution.ts
    - src/agents/embedded-agent-runner/run/incomplete-turn-recovery.ts
  execution:
    kind: flow
    summary: Verify empty-response retry exhaustion still produces a visible reply.
    config:
      requiredProviderMode: mock-openai
      requiredProvider: mock-openai
      promptSnippet: Empty response exhaustion QA check
      prompt: "Empty response exhaustion QA check: read QA_KICKOFF_TASK.md, then answer with exactly EMPTY-EXHAUSTED-OK."
      retryNeedle: The previous attempt did not produce a user-visible answer.
      settledToolRetryNeedle: The previous assistant turn completed its tool calls but did not produce a user-visible answer.
      expectedFallback: "The tool run finished, but no final summary was produced. I did not repeat any completed actions."
      unexpectedSuccessMarker: EMPTY-EXHAUSTED-OK

flow:
  steps:
    - name: delivers a safe fallback after empty-response exhaustion
      actions:
        - assert:
            expr: "env.providerMode === 'mock-openai'"
            message: this seeded scenario is mock-openai only
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: reset
        - set: outboundStartIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - set: requestCursorBefore
          value:
            expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor : 0"
        - set: sessionKey
          value:
            expr: "`agent:qa:empty-response-exhausted:${randomUUID().slice(0, 8)}`"
        - call: startAgentRun
          saveAs: started
          args:
            - ref: env
            - sessionKey:
                ref: sessionKey
              message:
                expr: config.prompt
              timeoutMs:
                expr: liveTurnTimeoutMs(env, 45000)
        - set: waited
          value:
            expr: "await env.gateway.call('agent.wait', { runId: started.runId, timeoutMs: liveTurnTimeoutMs(env, 45000) }, { timeoutMs: liveTurnTimeoutMs(env, 50000) })"
        - assert:
            expr: "['ok', 'completed', 'succeeded'].includes(String(waited?.status)) || (waited?.status === 'error' && String(waited?.error ?? '').trim().toLowerCase() === 'completed')"
            message:
              expr: "`agent.wait returned ${String(waited?.status ?? 'unknown')}: ${String(waited?.error ?? '')}`"
        - set: firstScenarioOutbound
          value:
            expr: "(async () => { const deadline = Date.now() + liveTurnTimeoutMs(env, 30000); do { const messages = state.getSnapshot().messages.filter((message) => message.direction === 'outbound').slice(outboundStartIndex).filter((message) => message.conversation.id === 'qa-operator'); if (messages.length > 0) { return messages[0]; } await sleep(100); } while (Date.now() < deadline); throw new Error('timed out waiting for retry-exhaustion fallback delivery'); })()"
        - call: sleep
          args:
            - 300
        - set: scenarioOutbound
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').slice(outboundStartIndex).filter((message) => message.conversation.id === 'qa-operator')"
        - assert:
            expr: "scenarioOutbound.length === 1"
            message:
              expr: "`expected exactly one visible fallback after retry exhaustion, saw ${scenarioOutbound.length}: ${JSON.stringify(scenarioOutbound.map((message) => String(message.text ?? '')))}`"
        - assert:
            expr: "String(scenarioOutbound[0]?.text ?? '') === config.expectedFallback"
            message:
              expr: "`expected safe empty-response fallback, saw ${String(scenarioOutbound[0]?.text ?? '')}`"
        - assert:
            expr: "!scenarioOutbound.some((message) => String(message.text ?? '').includes(config.unexpectedSuccessMarker))"
            message:
              expr: "`retry exhaustion delivered its forbidden success marker: ${JSON.stringify(scenarioOutbound.map((message) => String(message.text ?? '')))}`"
        - if:
            expr: "Boolean(env.mock)"
            then:
              - set: scenarioRequests
                value:
                  expr: "(await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.promptSnippet))"
              - set: primaryModel
                value:
                  expr: "splitModelRef(env.primaryModel)?.model"
              - set: finalizationRequests
                value:
                  expr: "scenarioRequests.filter((request) => String(request.allInputText ?? '').includes(config.settledToolRetryNeedle))"
              - assert:
                  expr: "scenarioRequests.length === 4"
                  message:
                    expr: "`expected one read, one empty result turn, and two finalization attempts, saw ${scenarioRequests.length}: ${JSON.stringify(scenarioRequests.map((request) => ({ cursor: request.cursor, model: request.model, tool: request.plannedToolName ?? null, settledRetry: String(request.allInputText ?? '').includes(config.settledToolRetryNeedle), callId: request.toolOutputCallId ?? null })))}`"
              - assert:
                  expr: "scenarioRequests.every((request) => request.model === primaryModel)"
                  message:
                    expr: "`recovery escaped the primary model: ${JSON.stringify(scenarioRequests.map((request) => request.model))}`"
              - assert:
                  expr: "scenarioRequests[0]?.plannedToolName === 'read' && scenarioRequests.slice(1).every((request) => !request.plannedToolName)"
                  message:
                    expr: "`expected exactly one read with no tool replay, saw ${JSON.stringify(scenarioRequests.map((request) => request.plannedToolName ?? null))}`"
              - assert:
                  expr: "finalizationRequests.length === 2"
                  message:
                    expr: "`expected exactly two bounded settled-turn finalization attempts, saw ${finalizationRequests.length}`"
              - assert:
                  expr: "finalizationRequests.every((request) => !Array.isArray(request.body?.tools) || request.body.tools.length === 0)"
                  message: settled-turn finalization exposed a tool surface
      detailsExpr: "`requests=${String(scenarioRequests?.length ?? 0)} finalizations=${String(finalizationRequests?.length ?? 0)} fallback=${String(scenarioOutbound[0]?.text ?? '')}`"
