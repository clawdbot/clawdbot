title: Managed worktrees Workboard-owner lifecycle

scenario:
  id: managed-worktrees-workboard-lifecycle
  surface: runtime
  category: agent-runtime.agent-turn-execution
  coverage:
    primary:
      - agent-runtime.managed-worktrees-workboard-lifecycle
  objective: Prove the real child gateway materializes Workboard card workspaces as managed wb-<card-id> worktrees, writes the resolved checkout and branch back to each card, runs their subagents, removes a clean checkout losslessly, and retains a dirty checkout with a recorded cleanup outcome.
  successCriteria:
    - Dispatch materializes the card's source workspace under the managed state directory as wb-<card-id> on branch openclaw/wb-<card-id>.
    - The dispatched card persists the resolved managed checkout path and branch while retaining its source workspace metadata.
    - A real mock-provider subagent run reaches a terminal outcome, and run-end cleanup removes its clean checkout losslessly with a recorded removed-lossless outcome.
    - A second real subagent run leaves an untracked file, and run-end cleanup records retained-dirty while keeping the live checkout intact.
  docsRefs:
    - docs/concepts/managed-worktrees.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - src/agents/worktrees/service.ts
    - src/agents/worktrees/service.run-end-cleanup.test.ts
    - extensions/workboard/src/dispatcher.ts
    - extensions/workboard/src/dispatcher-workspace.ts
    - test/e2e/qa-lab/runtime/managed-worktrees-workboard-lifecycle-product-proof.e2e.test.ts
  execution:
    kind: vitest
    path: test/e2e/qa-lab/runtime/managed-worktrees-workboard-lifecycle-product-proof.e2e.test.ts
    summary: Run the real child gateway through Workboard card worktree materialization, workspace writeback, subagent completion, clean removal, and dirty retention with recorded cleanup outcomes.
