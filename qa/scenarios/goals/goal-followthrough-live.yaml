title: Active goal followthrough on bare continue

scenario:
  id: goal-followthrough-live
  surface: goals
  category: session-memory.context-engine
  runtimePairLane: core
  coverage:
    primary:
      - session-memory.goal-continuance-continuance
    secondary:
      - session-memory.goal-continuance-context-injection
  objective: Verify a live model advances the next concrete step of an active multi-step goal on a later bare continue turn.
  successCriteria:
    - The first goal turn acknowledges the staged first step without creating the second-step artifact early.
    - The durable goal remains active after the first step instead of closing before its objective is achieved.
    - A later inbound message contains only `continue`.
    - The continue turn creates the required artifact in the workspace instead of returning another plan.
    - The continue turn does not ask for permission or approval before the feasible write.
    - The final reply reports the completed artifact step.
  docsRefs:
    - docs/tools/goal.md
    - docs/channels/qa-channel.md
  codeRefs:
    - src/auto-reply/reply/inbound-meta.ts
    - src/auto-reply/reply/commands-goal.ts
    - src/agents/tools/goal-tools.ts
  execution:
    kind: flow
    suiteIsolation: isolated
    isolationReason: Creates and resumes an active goal and writes a live-model workspace artifact.
    retryCount: 0
    summary: Stage a two-step active goal, then require a bare continue turn to write the next artifact without replanning.
    channel: qa-channel
    config:
      requiredProviderMode: live-frontier
      conversationId: goal-followthrough-live
      senderId: qa-goal-operator
      artifactFilePrefix: goal-continuance-live
      artifactText: Goal continuance advanced the concrete next step.
      readyMarker: GOAL-CONTINUANCE-READY
      doneMarker: GOAL-CONTINUANCE-DONE
      forbiddenNeedles:
        - need permission
        - need your approval
        - can you approve
        - would you like me to
        - next i would

flow:
  steps:
    - name: starts the staged goal without completing its objective
      actions:
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - resetTransport: true
        - set: runSuffix
          value:
            expr: randomUUID().slice(0, 8)
        - set: conversationId
          value:
            expr: "`${config.conversationId}-${runSuffix}`"
        - set: artifactFile
          value:
            expr: "`${config.artifactFilePrefix}-${runSuffix}.txt`"
        - set: artifactPath
          value:
            expr: "path.join(env.gateway.workspaceDir, artifactFile)"
        - set: firstOutboundIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation:
              id:
                ref: conversationId
              kind: direct
            senderId:
              ref: config.senderId
            senderName: QA Goal Operator
            text:
              expr: "`/goal start Reply ${config.readyMarker}; write nothing. On bare continue only, create ${artifactFile} with '${config.artifactText}'; reply ${config.doneMarker}.`"
          saveAs: goalStartInbound
        - waitForOutbound:
            conversation:
              id:
                ref: conversationId
              kind: direct
            sinceIndex:
              ref: firstOutboundIndex
            textIncludes:
              ref: config.readyMarker
            timeoutMs:
              expr: liveTurnTimeoutMs(env, 90000)
          saveAs: readyReply
    - name: verifies the durable goal stays active before continuation
      actions:
        - call: waitForCondition
          saveAs: goalSession
          args:
            - lambda:
                async: true
                expr: "env.gateway.call('sessions.list', {}, { timeoutMs: 30000 }).then((result) => result.sessions?.find((session) => String(session.goal?.objective ?? '').includes(artifactFile) && session.hasActiveRun === false))"
            - expr: liveTurnTimeoutMs(env, 90000)
            - 100
        - set: readyReply
          value:
            expr: "state.getSnapshot().messages.find((message) => message.direction === 'outbound' && !message.deleted && message.replyToId === goalStartInbound.id && String(message.text ?? '').includes(config.readyMarker))"
        - assert:
            expr: "readyReply !== undefined"
            message: goal ready marker disappeared before the first turn settled
        - set: artifactBeforeContinue
          value:
            expr: "await fs.readFile(artifactPath, 'utf8').catch(() => undefined)"
        - assert:
            expr: "artifactBeforeContinue === undefined"
            message:
              expr: "`goal created the second-step artifact before continue: ${String(artifactBeforeContinue)}`"
        - assert:
            expr: "goalSession?.goal?.status === 'active'"
            message:
              expr: "`goal closed before continue: ${JSON.stringify(goalSession?.goal ?? null)}`"
    - name: advances the active goal on bare continue
      actions:
        - set: continueOutboundIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation:
              id:
                ref: conversationId
              kind: direct
            senderId:
              ref: config.senderId
            senderName: QA Goal Operator
            text: continue
          saveAs: continueInbound
        - waitForOutbound:
            conversation:
              id:
                ref: conversationId
              kind: direct
            sinceIndex:
              ref: continueOutboundIndex
            timeoutMs:
              expr: liveTurnTimeoutMs(env, 90000)
          saveAs: streamedDoneReply
        - call: waitForCondition
          args:
            - lambda:
                async: true
                expr: "env.gateway.call('sessions.list', {}, { timeoutMs: 30000 }).then((result) => result.sessions?.find((session) => String(session.goal?.objective ?? '').includes(artifactFile) && session.hasActiveRun === false))"
            - expr: liveTurnTimeoutMs(env, 90000)
            - 100
        - set: doneReply
          value:
            expr: "state.getSnapshot().messages.findLast((message) => message.direction === 'outbound' && !message.deleted && message.replyToId === continueInbound.id)"
        - assert:
            expr: "String(doneReply?.text ?? '').includes(config.doneMarker)"
            message:
              expr: "`goal completion marker disappeared before the continue turn settled: ${String(doneReply?.text ?? streamedDoneReply.text)}`"
        - set: artifact
          value:
            expr: "await fs.readFile(artifactPath, 'utf8').catch(() => undefined)"
        - assert:
            expr: "artifact?.trim() === config.artifactText"
            message:
              expr: "`goal continuation did not create the requested artifact before replying: ${doneReply.text}`"
        - assert:
            expr: "!config.forbiddenNeedles.some((needle) => normalizeLowercaseStringOrEmpty(doneReply.text).includes(needle))"
            message:
              expr: "`goal followthrough replanned or asked permission: ${doneReply.text}`"
      detailsExpr: "`ready=${readyReply.text}; done=${doneReply.text}; artifact=${artifact.trim()}`"
