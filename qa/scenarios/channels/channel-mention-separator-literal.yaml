title: Channel mention gating keeps a non-emoji separator literal

scenario:
  id: channel-mention-separator-literal
  surface: channels
  coverage:
    primary:
      - channels.mention-gating
    secondary:
      - channels.automatic-final-reply
  objective: Verify an identity spelling a non-emoji separator with a variation selector gains no bare-name trigger.
  successCriteria:
    - Group traffic typing the bare name without the separator produces no outbound reply.
    - A turn typing the name exactly as the identity spells it receives exactly one marker reply.
  gatewayConfigPatch:
    # The QA lane pins explicit group mention patterns, which take precedence
    # over the identity. Drop them so the gate reads the patterns the agent
    # identity derives.
    messages:
      groupChat:
        mentionPatterns: null
    agents:
      entries:
        qa:
          identity:
            name: "Bot$️"
  docsRefs:
    - docs/channels/group-messages.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - src/auto-reply/reply/mentions.ts
    - extensions/qa-channel/src/inbound.ts
  execution:
    kind: flow
    summary: Prove a variation selector after a non-emoji base stays required with a bare-name turn followed by an as-spelled turn.
    transportPolicy:
      requireGroupMention: true
    config:
      conversationId: qa-routing-separator-literal
      expectedMarker: QA-SEPARATOR-LITERAL-OK
      # The gated turn asks for a marker of its own: a reply that escapes the
      # gate names itself, so the check does not rest on a reply being slower
      # than the quiet window.
      gatedMarker: QA-SEPARATOR-BARE-LEAKED
      identityName: "Bot$️"
      bareName: "bot"
      typedName: "bot$️"

flow:
  steps:
    - name: keeps the bare name gated and accepts the spelled name
      actions:
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 60000]
        - call: waitForTransportReady
          args: [{ ref: env }, 60000]
        - resetTransport: true
        - set: outboundStartIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation:
              id: { ref: config.conversationId }
              kind: group
            senderId: driver
            senderName: QA Driver
            text:
              expr: "`${config.bareName} reply exactly: ${config.gatedMarker}`"
        - waitForNoOutbound:
            quietMs: 20000
            sinceIndex: { ref: outboundStartIndex }
        - sendInbound:
            conversation:
              id: { ref: config.conversationId }
              kind: group
            senderId: driver
            senderName: QA Driver
            text:
              expr: "`${config.typedName} reply exactly: ${config.expectedMarker}`"
        - waitForOutbound:
            conversation:
              id: { ref: config.conversationId }
              kind: group
            textIncludes: { ref: config.expectedMarker }
            timeoutMs:
              expr: liveTurnTimeoutMs(env, 60000)
          saveAs: outbound
        # The gated turn went out first, so by the time the spelled turn is
        # answered a leaked reply would already be on the transport.
        - set: outboundTexts
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').map((message) => String(message.text ?? '')).join('\\n')"
        - assert:
            expr: "!outboundTexts.includes(config.gatedMarker)"
            message:
              expr: "`bare ${config.bareName} escaped the mention gate`"
      detailsExpr: "JSON.stringify({ harness: 'qa-channel + qa-lab bus + ephemeral Gateway child + mock-openai', verdict: 'PASS', identityName: config.identityName, gatedBareName: config.bareName, gatedMarkerSeen: false, typed: config.typedName, reply: outbound.text }, null, 2)"
