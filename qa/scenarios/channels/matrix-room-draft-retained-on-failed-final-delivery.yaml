title: Matrix draft retained when the final delivery fails
scenario:
  id: matrix-room-draft-retained-on-failed-final-delivery
  surface: channels
  coverage:
    primary:
      - matrix.message-presentation-metadata
  docsRefs:
    - docs/concepts/streaming.md
  execution:
    kind: flow
    channel: matrix
    timeoutMs: 60000
    retryCount: 0
    config:
      matrixConfigOverrides:
        streaming: partial

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-room.js
  call: runDraftRetainedOnFailedFinalDeliveryScenario
  args:
    - expr: "scenarioContext"
