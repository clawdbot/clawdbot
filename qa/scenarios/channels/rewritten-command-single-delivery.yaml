title: Rewritten command replies deliver once

scenario:
  id: rewritten-command-single-delivery
  surface: channels
  coverage:
    primary:
      - channels.streaming-final-reply
    secondary:
      - channels.qa-channel-final-reply
  objective: Verify a chat command that rewrites into an agent work order produces one final channel reply.
  successCriteria:
    - The rewritten /learn turn reaches the agent and returns the requested marker.
    - Exactly one marker-bearing qa-channel outbound remains after delivery settles.
  docsRefs:
    - docs/channels/qa-channel.md
    - docs/concepts/streaming.md
  codeRefs:
    - src/auto-reply/reply/commands-learn.ts
    - src/auto-reply/reply/get-reply-inline-actions.ts
    - src/auto-reply/reply/dispatch-from-config.execute.ts
    - extensions/qa-channel/src/inbound.ts
  execution:
    kind: flow
    channel: qa-channel
    summary: Send a /learn work-order rewrite and prove its agent reply is delivered once.
    config:
      requiredProviderMode: mock-openai
      conversationId: qa-rewritten-command-single-delivery
      marker: QA-REWRITTEN-COMMAND-SINGLE-DELIVERY-OK

flow:
  steps:
    - name: delivers one rewritten-command reply
      actions:
        - assert:
            expr: env.providerMode === config.requiredProviderMode
            message: this deterministic rewritten-command proof requires mock-openai
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: startIndex
          value:
            expr: state.getSnapshot().messages.length
        - sendInbound:
            conversation:
              id:
                ref: config.conversationId
              kind: direct
            senderId: qa-rewritten-command-operator
            senderName: QA Rewritten Command Operator
            text:
              expr: "`/learn marker check. Reply exactly: ${config.marker}`"
        - call: waitForCondition
          saveAs: outbound
          args:
            - lambda:
                expr: "state.getSnapshot().messages.slice(startIndex).find((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId && candidate.text.includes(config.marker))"
            - expr: liveTurnTimeoutMs(env, 45000)
        - call: sleep
          args: [1000]
        - set: markerOutbounds
          value:
            expr: "state.getSnapshot().messages.slice(startIndex).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId && candidate.text.includes(config.marker))"
        - assert:
            expr: markerOutbounds.length === 1
            message:
              expr: "`expected one rewritten-command reply, got ${markerOutbounds.length}; transcript=${formatTransportTranscript(state, { conversationId: config.conversationId })}`"
      detailsExpr: outbound.text
