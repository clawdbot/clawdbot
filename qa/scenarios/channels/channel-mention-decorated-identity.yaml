title: Channel mention gating with a decorated identity name

scenario:
  id: channel-mention-decorated-identity
  surface: channels
  coverage:
    primary:
      - channels.mention-gating
    secondary:
      - channels.automatic-final-reply
  objective: Verify a required-mention group activates on the identity name typed without its decoration.
  successCriteria:
    - Group traffic that names nobody produces no outbound reply.
    - A turn typing the decorated identity name without its emoji receives exactly one marker reply.
  gatewayConfigPatch:
    # The QA lane pins explicit group mention patterns, which take precedence
    # over the identity. Drop them so the gate reads the patterns the agent
    # identity derives.
    messages:
      groupChat:
        mentionPatterns: null
    agents:
      entries:
        qa:
          identity:
            name: "小蝶🦋"
  docsRefs:
    - docs/channels/group-messages.md
    - docs/concepts/qa-e2e-automation.md
  codeRefs:
    - src/auto-reply/reply/mentions.ts
    - extensions/qa-channel/src/inbound.ts
  execution:
    kind: flow
    summary: Prove identity-derived mention gating with a nameless turn followed by a bare-name turn.
    transportPolicy:
      requireGroupMention: true
    config:
      conversationId: qa-routing-decorated-mention
      expectedMarker: QA-DECORATED-IDENTITY-OK
      # The gated turn asks for a marker of its own: a reply that escapes the
      # gate names itself, so the check does not rest on a reply being slower
      # than the quiet window.
      gatedMarker: QA-DECORATED-NAMELESS-LEAKED
      identityName: "小蝶🦋"
      typedName: "小蝶"

flow:
  steps:
    - name: blocks nameless traffic and accepts the bare name
      actions:
        - call: waitForGatewayHealthy
          args: [{ ref: env }, 60000]
        - call: waitForTransportReady
          args: [{ ref: env }, 60000]
        - resetTransport: true
        - set: outboundStartIndex
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').length"
        - sendInbound:
            conversation:
              id: { ref: config.conversationId }
              kind: group
            senderId: driver
            senderName: QA Driver
            text:
              expr: "`reply exactly: ${config.gatedMarker}`"
        - waitForNoOutbound:
            quietMs: 20000
            sinceIndex: { ref: outboundStartIndex }
        - sendInbound:
            conversation:
              id: { ref: config.conversationId }
              kind: group
            senderId: driver
            senderName: QA Driver
            text:
              expr: "`${config.typedName} reply exactly: ${config.expectedMarker}`"
        - waitForOutbound:
            conversation:
              id: { ref: config.conversationId }
              kind: group
            textIncludes: { ref: config.expectedMarker }
            timeoutMs:
              expr: liveTurnTimeoutMs(env, 60000)
          saveAs: outbound
        # The gated turn went out first, so by the time the bare-name turn is
        # answered a leaked reply would already be on the transport.
        - set: outboundTexts
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound').map((message) => String(message.text ?? '')).join('\\n')"
        - assert:
            expr: "!outboundTexts.includes(config.gatedMarker)"
            message: a turn naming nobody escaped the mention gate
      detailsExpr: "JSON.stringify({ harness: 'qa-channel + qa-lab bus + ephemeral Gateway child + mock-openai', verdict: 'PASS', identityName: config.identityName, typed: config.typedName, gatedMarkerSeen: false, reply: outbound.text }, null, 2)"
