title: Matrix room allowBots=mentions overrides account allowBots off
scenario:
  id: matrix-allowbots-room-override-enables-account-off
  surface: channels
  coverage:
    primary:
      - matrix.mention-gates
  execution:
    kind: flow
    channel: matrix
    suiteIsolation: isolated
    isolationReason: Asserts fresh model-driven configured-bot admission and cannot inherit allowBots session history from the shared Matrix worker.
    timeoutMs: 45000
    retryCount: 0
    config:
      matrixConfigOverrides:
        configuredBotRoles:
          - observer
        groupAllowRoles:
          - driver
          - observer
        groupsByKey:
          main:
            allowBots: mentions
            requireMention: true

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-allowbots.js
  call: runAllowBotsRoomOverrideEnablesAccountOffScenario
  args:
    - expr: "scenarioContext"
