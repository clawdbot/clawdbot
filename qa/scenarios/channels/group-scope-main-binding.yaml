title: Group scope main binding

scenario:
  id: group-scope-main-binding
  surface: channels
  coverage:
    secondary:
      - channels.runtime-conversation-routing
      - channels.outbound-group-reply
      - channels.room-session-qa-channel
  objective: Verify a selected QA channel group can share the agent main session without changing its visible reply destination.
  gatewayConfigPatch:
    bindings:
      - agentId: qa
        match:
          channel: qa-channel
          peer:
            kind: group
            id: group:qa-visible-tool-room
        session:
          groupScope: main
    messages:
      groupChat:
        visibleReplies: message_tool
  successCriteria:
    - A group message matched by a binding with session.groupScope main lands in agent:qa:main.
    - The isolated QA group session key is not created.
    - The agent reply is still delivered once to the originating group rather than a direct message.
  docsRefs:
    - docs/channels/groups.md
    - docs/concepts/session.md
    - docs/channels/qa-channel.md
  codeRefs:
    - src/routing/resolve-route.ts
    - extensions/qa-channel/src/inbound.ts
    - extensions/qa-channel/src/outbound.ts
  execution:
    kind: flow
    summary: Send a real QA channel group turn through an ephemeral Gateway and prove a binding collapses only session storage, not transport reply context.
    config:
      conversationId: qa-visible-tool-room
      promptSnippet: qa group visible reply tool check
      prompt: "@openclaw qa group visible reply tool check. Use the visible room reply path. exact marker: `QA-GROUP-TOOL-OK`"
      expectedMarker: QA-GROUP-TOOL-OK

flow:
  steps:
    - name: routes the selected group into main and replies to the group
      actions:
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: mainSessionKey
          value: agent:qa:main
        - set: isolatedSessionKey
          value:
            expr: "buildAgentSessionKey({ agentId: 'qa', channel: 'qa-channel', accountId: transport.accountId, peer: { kind: 'group', id: `group:${config.conversationId}` }, dmScope: env.cfg.session?.dmScope, groupScope: 'per-group', identityLinks: env.cfg.session?.identityLinks })"
        - set: requestCursorBefore
          value:
            expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor : 0"
        - sendInbound:
            conversation:
              id:
                ref: config.conversationId
              kind: group
              title: QA Visible Tool Room
            senderId: alice
            senderName: Alice
            text:
              ref: config.prompt
        - call: waitForCondition
          args:
            - lambda:
                async: true
                params: []
                expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).find((request) => String(request.allInputText ?? '').includes(config.promptSnippet)) : true"
            - expr: liveTurnTimeoutMs(env, 180000)
        - set: scenarioRequests
          value:
            expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`)).filter((request) => String(request.allInputText ?? '').includes(config.promptSnippet)) : []"
        - assert:
            expr: "!env.mock || scenarioRequests.some((request) => request.plannedToolName === 'message' && request.plannedToolArgs?.action === 'send' && request.plannedToolArgs?.message === config.expectedMarker)"
            message: mock provider did not call message(action=send) for the group reply
        - call: waitForOutboundMessage
          saveAs: outbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.direction === 'outbound' && candidate.conversation.id === config.conversationId && candidate.conversation.kind === 'group' && !candidate.threadId && String(candidate.text ?? '').includes(config.expectedMarker)"
            - expr: liveTurnTimeoutMs(env, 180000)
        - call: waitForCondition
          saveAs: mainSession
          args:
            - lambda:
                async: true
                params: []
                expr: "env.gateway.call('sessions.list', {}, { timeoutMs: 30000 }).then((result) => result.sessions?.find((session) => session.key === mainSessionKey && session.hasActiveRun === false))"
            - expr: liveTurnTimeoutMs(env, 180000)
            - 100
        - call: env.gateway.call
          saveAs: listedSessions
          args:
            - sessions.list
            - {}
            - timeoutMs: 30000
        - assert:
            expr: "listedSessions.sessions.some((session) => session.key === mainSessionKey)"
            message: canonical main session was not present after the bound group turn
        - assert:
            expr: "!listedSessions.sessions.some((session) => session.key === isolatedSessionKey)"
            message:
              expr: "`isolated group session unexpectedly exists: ${isolatedSessionKey}; sessions=${JSON.stringify(listedSessions.sessions.map((session) => session.key))}`"
        - call: readSessionTranscriptSummary
          saveAs: transcriptSummary
          args:
            - ref: env
            - ref: mainSessionKey
        - assert:
            expr: "transcriptSummary.successfulToolCallCounts.message === 1"
            message: main transcript did not persist exactly one successful group reply message-tool result
        - set: matchingOutbound
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && message.conversation.id === config.conversationId && message.conversation.kind === 'group' && String(message.text ?? '').includes(config.expectedMarker))"
        - assert:
            expr: matchingOutbound.length === 1
            message:
              expr: "`expected exactly one visible group reply, saw ${matchingOutbound.length}`"
      detailsExpr: "JSON.stringify({ verdict: 'PASS', configuredGroupScope: 'main', mainSessionKey, isolatedSessionKey, sessionKeysSeen: listedSessions.sessions.map((session) => session.key), reply: { kind: outbound.conversation.kind, id: outbound.conversation.id, text: outbound.text } })"
