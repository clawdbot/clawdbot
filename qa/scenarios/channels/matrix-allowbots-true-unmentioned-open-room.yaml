title: Matrix allowBots=true accepts unmentioned configured bot messages in open rooms
scenario:
  id: matrix-allowbots-true-unmentioned-open-room
  surface: channels
  coverage:
    primary:
      - matrix.mention-gates
  execution:
    kind: flow
    channel: matrix
    suiteIsolation: isolated
    isolationReason: Asserts fresh model-driven configured-bot admission and cannot inherit allowBots session history from the shared Matrix worker.
    timeoutMs: 45000
    retryCount: 0
    config:
      matrixConfigOverrides:
        allowBots: true
        configuredBotRoles:
          - observer
        groupAllowRoles:
          - driver
          - observer
        groupsByKey:
          main:
            requireMention: false

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-allowbots.js
  call: runAllowBotsTrueUnmentionedOpenRoomScenario
  args:
    - expr: "scenarioContext"
