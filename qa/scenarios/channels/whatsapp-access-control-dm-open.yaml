title: WhatsApp dmPolicy open allows direct messages

scenario:
  id: whatsapp-access-control-dm-open
  surface: channels
  coverage:
    primary:
      - whatsapp.direct-message-dmpolicy
  objective: Verify dmPolicy open accepts a direct message.
  gatewayConfigPatch:
    channels:
      whatsapp:
        accounts:
          $selectedAccount:
            dmPolicy: open
  successCriteria:
    - The direct message receives one marker reply.
  docsRefs:
    - docs/channels/whatsapp.md
  codeRefs:
    - extensions/whatsapp/src/inbound/access-control.ts
  execution:
    kind: flow
    channel: whatsapp
    suiteIsolation: isolated
    summary: Verify WhatsApp dmPolicy open behavior through the canonical adapter.
    config:
      conversationKind: direct
      conversationId: 15550000001@s.whatsapp.net
      senderId: 15550000002@s.whatsapp.net
      mentionPrefix: ""
      expectReply: true
      markerPrefix: WHATSAPP_QA_DM_OPEN
      timeoutMs: 60000

flow:
  shared: channel-access-control
