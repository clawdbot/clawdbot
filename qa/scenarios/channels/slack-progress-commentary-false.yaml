title: Slack progress commentary false uses the status headline instead of the commentary lane
scenario:
  id: slack-progress-commentary-false
  surface: channels
  coverage:
    primary:
      - agent-runtime.streaming-replies
  execution:
    kind: flow
    channel: slack
    timeoutMs: 90000
    retryCount: 1
    suiteIsolation: isolated
flow:
  module: ./live-transports/slack/scenario-runtime.js
  call: runSlackScenario
  args:
    - { expr: slackScenarioContext }
    - { moduleExport: slackQaProgressCommentaryFalseScenario }
