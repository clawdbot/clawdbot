title: Matrix allowBots=mentions accepts mentioned configured bot messages
scenario:
  id: matrix-allowbots-mentions-mentioned-room
  surface: channels
  coverage:
    primary:
      - matrix.mention-gates
  execution:
    kind: flow
    channel: matrix
    suiteIsolation: isolated
    isolationReason: Asserts fresh model-driven configured-bot admission and cannot inherit allowBots session history from the shared Matrix worker.
    timeoutMs: 45000
    retryCount: 0
    config:
      matrixConfigOverrides:
        allowBots: mentions
        configuredBotRoles:
          - observer
        groupAllowRoles:
          - driver
          - observer

flow:
  module: ./live-transports/matrix/scenarios/scenario-runtime-allowbots.js
  call: runAllowBotsMentionsMentionedRoomScenario
  args:
    - expr: "scenarioContext"
