title: Control UI live log tail

scenario:
  id: control-ui-live-log-tail
  surface: control-ui
  category: control-ui.operator-console
  coverage:
    primary:
      - control-ui.live-log-tail
  objective: >-
    Prove the Control UI advances the Gateway log cursor, appends new log
    records, and restores automatic following to the newest visible record.
  successCriteria:
    - Real Chromium opens the Logs page and renders the initial log page.
    - The next automatic logs.tail request carries the previous cursor.
    - The incremental response appends one new visible log row without replacing the buffer.
    - Re-enabling auto-follow returns the log stream to the newest row.
  docsRefs:
    - docs/web/control-ui.md
    - docs/gateway/logging.md
  codeRefs:
    - ui/src/e2e/logs-autofollow.e2e.test.ts
    - ui/src/pages/logs/logs-page.ts
  execution:
    kind: playwright
    path: ui/src/e2e/logs-autofollow.e2e.test.ts
    testNamePattern: returns to the newest line when auto-follow is re-enabled
    summary: >-
      Real Chromium coverage for cursor-based incremental log polling,
      visible append behavior, and auto-follow recovery.
