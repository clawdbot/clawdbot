title: Control UI guarded config write lifecycle

scenario:
  id: control-ui-config-safe-write
  surface: control-ui
  coverage:
    primary:
      - control-ui.config-snapshots
      - control-ui.schema-form-editing
      - control-ui.raw-json-editing
      - control-ui.base-hash-guarded-writes
      - control-ui.apply-and-restart
  objective: >-
    Verify the Control UI consumes config snapshots and schema, preserves
    base-hash guards across form and raw edits, recovers from a stale write,
    and sends the operator's apply-and-restart request.
  successCriteria:
    - Chromium renders schema-backed config values from config.get and config.schema.
    - A curated reset sends config.patch with the loaded base hash and exact patch payload.
    - A stale schema-form config.set is rejected visibly and Reload adopts the newer snapshot.
    - The retried form edit and explicit raw edit send config.set with the current base hash and exact raw payload.
    - Apply changes sends config.apply with the saved raw config, current base hash, and session key.
    - The UI shows Applying while config.apply is pending and clears the apply action after the mocked Gateway acknowledges it.
  docsRefs:
    - docs/web/control-ui.md
    - docs/gateway/configuration.md
    - docs/gateway/protocol.md
  codeRefs:
    - ui/src/e2e/config-safe-write.e2e.test.ts
    - ui/src/lib/config/config-write-coordinator.ts
    - ui/src/components/settings-save-indicator.ts
  execution:
    kind: playwright
    path: ui/src/e2e/config-safe-write.e2e.test.ts
    testNamePattern: edits schema and raw config with guarded set, patch, reload, and apply requests
    summary: >-
      Real Chromium coverage of Control UI config snapshot consumption and
      exact config.patch, config.set, and config.apply browser RPC contracts
      against a stateful mock Gateway. This does not claim real Gateway
      persistence or process-restart execution.
