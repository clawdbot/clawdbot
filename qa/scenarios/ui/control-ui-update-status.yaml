title: Control UI update status browser proof

scenario:
  id: control-ui-update-status
  surface: control-ui
  category: control-ui.operator-console
  coverage:
    primary:
      - control-ui.update-run-status
      - control-ui.update-run-status-gateway-restart
      - control-ui.update-run-status-package-update
  objective: >-
    Prove the Control UI turns update availability, package-update results,
    and restart handoff state into visible operator status.
  successCriteria:
    - Chromium renders the available Gateway update and sends exactly one update.run request.
    - A failed global package update renders its exact status, reason, and recovery guidance.
    - A coalesced Gateway restart renders visible reconnect guidance.
    - Managed update handoff ordering preserves a visible outcome and reconciles status after reconnect.
  docsRefs:
    - docs/web/control-ui.md
    - docs/help/testing-updates-plugins.md
  codeRefs:
    - ui/src/e2e/update-coalesced.e2e.test.ts
    - ui/src/app/overlays.ts
    - ui/src/app/update-overlay-helpers.ts
  execution:
    kind: playwright
    path: ui/src/e2e/update-coalesced.e2e.test.ts
    summary: >-
      Real Chromium coverage for update invocation, package-update status,
      coalesced restart feedback, and managed handoff reconciliation.
