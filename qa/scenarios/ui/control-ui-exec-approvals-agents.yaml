title: Control UI agent-scoped exec approvals administration

scenario:
  id: control-ui-exec-approvals-agents
  surface: control-ui
  category: control-ui.operator-console
  coverage:
    primary:
      - control-ui.exec-approvals-agents
  objective: >-
    Prove an operator can select an agent's exec approval policy, edit it,
    save with optimistic concurrency, and observe the applied Gateway state.
  successCriteria:
    - Chromium lists the configured agents and selects the reviewer approval scope.
    - The operator edits security, prompt, fallback, skill CLI, and allowlist policy fields.
    - Saving sends the complete reviewer policy with the loaded snapshot hash.
    - The reloaded Gateway snapshot renders the applied values and a clean saved state.
  docsRefs:
    - docs/web/control-ui.md
    - docs/help/testing.md
  codeRefs:
    - ui/src/e2e/operator-admin.e2e.test.ts
    - ui/src/pages/devices/view-exec-approvals.ts
    - ui/src/lib/nodes/index.ts
  execution:
    kind: playwright
    path: ui/src/e2e/operator-admin.e2e.test.ts
    testNamePattern: edits, saves, and reapplies reviewer-scoped exec approvals
    summary: >-
      Real Chromium coverage for agent-scoped exec approval listing, editing,
      hash-bound save, reload, and applied visible state.
