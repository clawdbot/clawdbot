title: Control UI base-path shell and explicit Gateway target

scenario:
  id: control-ui-shell-routing
  surface: control-ui
  coverage:
    primary:
      - control-ui.base-path-routing
      - control-ui.dev-gatewayurl-target
  objective: >-
    Prove a direct Control UI route under a configured base path loads its
    public assets and connects through an explicitly confirmed Gateway URL.
  successCriteria:
    - Chromium directly opens the Chat route beneath the configured Control UI base path.
    - The connected shell and Chat page render without redirecting to the root mount.
    - Public icon and manifest requests resolve beneath the configured base path with valid MIME types.
    - Confirming an explicit Gateway URL creates the browser WebSocket for that exact target.
  docsRefs:
    - docs/web/control-ui.md
  codeRefs:
    - ui/src/e2e/control-ui-shell-routing.e2e.test.ts
    - ui/src/app/browser.ts
    - ui/src/app/public-assets.ts
    - ui/src/app/startup-settings.ts
  execution:
    kind: playwright
    path: ui/src/e2e/control-ui-shell-routing.e2e.test.ts
    testNamePattern: opens a base-path route and connects to the confirmed alternate Gateway URL
    summary: >-
      Real Chromium proof for prefixed direct navigation, base-mounted public
      assets, explicit Gateway confirmation, and the connected shell.
