title: Control UI browser screenshot response-body cancellation

scenario:
  id: control-ui-browser-screenshot-body-cancel
  surface: control-ui
  coverage:
    secondary:
      - control-ui.gateway-hosted-ui-control
  objective: >-
    Verify the rendered browser panel keeps a failed screenshot visible while
    canceling the unread authenticated assistant-media response body.
  successCriteria:
    - Chromium opens the Control UI and renders the browser panel.
    - The browser panel displays the screenshot HTTP failure.
    - The unread assistant-media response body is canceled exactly once.
    - Browser tab and screenshot requests retain the expected target and authentication.
  docsRefs:
    - docs/web/control-ui.md
    - docs/tools/browser.md
  codeRefs:
    - ui/src/e2e/browser-screenshot-body-cancel.e2e.test.ts
    - ui/src/components/browser/browser-client.ts
    - ui/src/test-helpers/control-ui-e2e.ts
  execution:
    kind: playwright
    path: ui/src/e2e/browser-screenshot-body-cancel.e2e.test.ts
    testNamePattern: keeps the status error visible and cancels the unread media body
    summary: >-
      Real Chromium coverage for screenshot failure visibility, authenticated
      browser requests, and unread response-body cancellation.
