title: Control UI activity summaries

scenario:
  id: control-ui-activity-summaries
  surface: control-ui
  category: control-ui.operator-console
  coverage:
    primary:
      - control-ui.activity-summaries
  objective: >-
    Prove the Control UI turns live tool lifecycle events into one concise,
    operator-visible Activity summary with hidden arguments and final output.
  successCriteria:
    - Real Chromium opens Activity and starts from an empty operator view.
    - A live tool-start event creates one running summary with arguments hidden.
    - The matching tool-result event updates that same row to Done without duplication.
    - Expanding the row reveals the final output and run identity.
  docsRefs:
    - docs/web/control-ui.md
    - docs/help/testing.md
  codeRefs:
    - ui/src/e2e/activity-summaries.e2e.test.ts
    - ui/src/pages/activity/activity-page.ts
    - ui/src/pages/activity/tool-activity.ts
  execution:
    kind: playwright
    path: ui/src/e2e/activity-summaries.e2e.test.ts
    testNamePattern: updates one visible tool summary from running to completed output
    summary: >-
      Real Chromium coverage for Activity tool lifecycle summarization,
      redacted arguments, stable row identity, and final output expansion.
