[package]
name = "openclaw-desktop-linux"
version = "0.1.0"
description = "OpenClaw desktop companion for Linux"
edition = "2021"
rust-version = "1.97.1"

[[bin]]
name = "openclaw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
mdns-sd = { version = "0.21.1", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
# macos-private-api backs Quick Chat's transparent window. Tauri gates
# `WebviewWindowBuilder::transparent` behind it on macOS, and the feature must
# stay in sync with `app.macOSPrivateApi` in tauri.conf.json or tauri-build
# fails. It is inert on Linux and Windows.
tauri = { version = "2.11.5", features = [
  "image-png",
  "macos-private-api",
  "tray-icon",
  "unstable",
] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
# 2.11.0 returns Windows installer errors after Tauri has torn down the UI.
# Lift this pin once cleanup runs only after a successful installer launch.
tauri-plugin-updater = "=2.10.1"
tauri-plugin-window-state = "2.4.1"
tauri-utils = { version = "2.9.3", features = ["config-json5"] }
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = "1.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
tauri-plugin-notifications = { git = "https://github.com/steipete/tauri-plugin-notifications.git", rev = "35d04a6af588a5d5d438da0320c7d95a877cfe14" }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notifications = { git = "https://github.com/steipete/tauri-plugin-notifications.git", rev = "35d04a6af588a5d5d438da0320c7d95a877cfe14", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-notifications = { git = "https://github.com/steipete/tauri-plugin-notifications.git", rev = "35d04a6af588a5d5d438da0320c7d95a877cfe14" }
