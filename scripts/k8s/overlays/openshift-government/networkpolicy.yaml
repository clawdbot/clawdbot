apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-government-boundary
spec:
  podSelector:
    matchLabels:
      app: openclaw
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              openclaw.dev/gateway-client: allowed
      ports:
        - protocol: TCP
          port: 18789
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              openclaw.dev/egress-proxy: allowed
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
