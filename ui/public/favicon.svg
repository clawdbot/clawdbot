<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crab-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35a55b"/>
      <stop offset="100%" stop-color="#1f6b38"/>
    </linearGradient>
  </defs>
  <!-- SMIL, not CSS: Chromium/Safari only run declarative SMIL inside <img>-loaded
       SVGs, and every app surface loads this file via <img src>. OpenCrustacean
       brand mark: geometric green crab claw that floats and snaps its pincer. -->
  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -5; 0 0" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 58 56; 2 58 56; -2 58 56; 0 58 56" keyTimes="0; 0.4; 0.55; 0.7"
      dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
    <path d="M20 92 L34 100 L46 82 L58 78 L74 80 L96 76 L104 72 L92 64 L74 60 L58 56 L74 48 L92 42 L104 38 L96 32 L78 26 L60 28 L44 34 L32 46 L30 60 L34 74 Z" fill="url(#crab-gradient)"/>
  </g>
</svg>
